<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BEL Field">
<meta name="theme-color" content="#161A0E">
<title>BEL Field Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --charcoal:#161A0E; --panel-bg:#22261A; --panel-mid:#2D3121; --panel-lite:#3A3D25;
  --border:#55593A; --clay:#C12A0A; --clay-lite:#D8462A; --ochre:#BC7710; --ochre-lite:#D99A35;
  --cream:#EEE6CB; --cream-dim:#D4C796; --cream-muted:#9C8F63; --white:#F8F2DF;
  --danger:#C12A0A; --info:#BDAA72; --good:#7D8740;
  --r:10px; --r-lg:16px;
  --serif:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Karla,Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tabbar-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;}
body{
  background:var(--charcoal); color:var(--cream); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--cream);background:var(--panel-bg);
  border:1px solid var(--border);border-radius:var(--r);padding:12px;width:100%;}
input:focus,select,textarea:focus{outline:2px solid var(--ochre);outline-offset:-1px;}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em;}

/* ---------- APP SHELL ---------- */
#app{display:flex;flex-direction:column;height:100dvh;}
#topbar{
  flex:0 0 auto;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:linear-gradient(180deg,#0F1209,var(--charcoal));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;position:relative;z-index:20;
}
#topbar .brand{font-family:var(--serif);font-size:1.15rem;color:var(--white);line-height:1.1;flex:1;min-width:0;}
#topbar .brand small{display:block;font-family:var(--sans);font-size:.66rem;color:var(--cream-muted);
  letter-spacing:.12em;text-transform:uppercase;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#clock{font-variant-numeric:tabular-nums;font-size:1.35rem;color:var(--ochre-lite);font-weight:600;letter-spacing:-.01em;}
.icon-btn{width:42px;height:42px;border-radius:var(--r);display:grid;place-items:center;
  background:var(--panel-bg);border:1px solid var(--border);font-size:1.1rem;flex:0 0 auto;}
.icon-btn:active{background:var(--panel-lite);}

#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--tabbar-h) + var(--safe-b) + 24px);}

#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(22,26,14,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
}
.tabbtn{height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--cream-muted);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;}
.tabbtn .ic{font-size:1.3rem;line-height:1;}
.tabbtn.active{color:var(--ochre-lite);}
.tabbtn.active .ic{transform:translateY(-1px);}
.tabbtn .dot{position:absolute;margin:-22px 0 0 22px;width:7px;height:7px;border-radius:50%;background:var(--clay-lite);}

/* ---------- CARDS ---------- */
.card{background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:12px;}
.card.tight{padding:13px 14px;}
.sec-label{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-muted);
  margin:22px 2px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sec-label:first-child{margin-top:4px;}
.muted{color:var(--cream-muted);}
.dim{color:var(--cream-dim);}
.sm{font-size:.82rem;}
.xs{font-size:.72rem;}
.row{display:flex;align-items:center;gap:10px;}
.row.wrap{flex-wrap:wrap;}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.grow{flex:1;min-width:0;}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- NOW CARD ---------- */
#nowcard{background:linear-gradient(155deg,#3A3D25,#262A18 55%,#1C2012);
  border:1px solid var(--ochre);border-radius:var(--r-lg);padding:20px 18px;position:relative;overflow:hidden;}
#nowcard::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--ochre);}
#nowcard.late{border-color:var(--clay-lite);}
#nowcard.late::before{background:var(--clay-lite);}
#nowcard.idle{border-color:var(--border);}
#nowcard.idle::before{background:var(--border);}
.now-kicker{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ochre-lite);
  display:flex;align-items:center;gap:7px;}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ochre-lite);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.now-title{font-family:var(--serif);font-size:1.75rem;line-height:1.15;color:var(--white);margin:9px 0 6px;}
.now-meta{font-size:.87rem;color:var(--cream-dim);}
.now-time{font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--cream);margin-top:10px;}
.countdown{font-variant-numeric:tabular-nums;font-size:2.5rem;font-weight:300;color:var(--ochre-lite);
  letter-spacing:-.02em;line-height:1;margin-top:12px;}
.countdown.over{color:var(--clay-lite);}
.countdown small{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-muted);
  display:block;font-weight:400;margin-top:6px;}
#progressbar{height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden;margin-top:14px;}
#progressbar i{display:block;height:100%;background:var(--ochre);transition:width .5s;}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 16px;
  border-radius:var(--r);background:var(--panel-mid);border:1px solid var(--border);color:var(--cream);
  font-size:.9rem;font-weight:500;transition:.12s;}
.btn:active{transform:scale(.975);background:var(--panel-lite);}
.btn.primary{background:var(--clay);border-color:var(--clay-lite);color:var(--white);}
.btn.ochre{background:var(--ochre);border-color:var(--ochre-lite);color:#231a10;font-weight:600;}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent;border-color:var(--danger);color:#EE8A6E;}
.btn.good{background:var(--good);border-color:#97A256;color:var(--white);}
.btn.full{width:100%;}
.btn.sm{min-height:44px;padding:0 13px;font-size:.8rem;}
.btn.on{background:var(--good);border-color:#97A256;color:var(--white);}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;}
.btnrow.three{grid-template-columns:1fr 1fr 1fr;}

/* ---------- TIMELINE ---------- */
.tl{position:relative;padding-left:20px;}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tlitem{position:relative;margin-bottom:10px;}
.tlitem::before{content:'';position:absolute;left:-19px;top:20px;width:12px;height:12px;border-radius:50%;
  background:var(--panel-bg);border:2px solid var(--border);}
.tlitem.done::before{background:var(--good);border-color:var(--good);}
.tlitem.now::before{background:var(--ochre);border-color:var(--ochre);box-shadow:0 0 0 5px rgba(188,119,16,.22);}
.tlitem.done .card{opacity:.55;}
.tlitem.now .card{border-color:var(--ochre);background:var(--panel-mid);}
.timecol{font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--ochre-lite);font-weight:600;
  min-width:58px;flex:0 0 auto;}
.timecol small{display:block;font-size:.66rem;color:var(--cream-muted);font-weight:400;}
.seg-title{font-family:var(--serif);font-size:1.2rem;color:var(--white);line-height:1.2;}
.done .seg-title{text-decoration:line-through;text-decoration-color:var(--cream-muted);}

/* ---------- CHIPS / PILLS ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border);
  background:var(--panel-mid);color:var(--cream-dim);white-space:nowrap;}
.chip.speaking{background:rgba(188,119,16,.2);border-color:var(--ochre);color:var(--ochre-lite);}
.chip.travel{background:rgba(189,170,114,.18);border-color:#BDAA72;color:#D9C890;}
.chip.interview{background:rgba(193,42,10,.22);border-color:var(--clay-lite);color:#E8775A;}
.chip.site{background:rgba(125,135,64,.2);border-color:var(--good);color:#C3CB82;}
.chip.meal{background:rgba(212,199,150,.1);color:var(--cream-dim);}
.chip.free{background:transparent;}
.chip.ok{background:rgba(125,135,64,.22);border-color:var(--good);color:#C3CB82;}
.chip.warn{background:rgba(188,119,16,.2);border-color:var(--ochre);color:var(--ochre-lite);}
.chip.bad{background:rgba(193,42,10,.18);border-color:var(--danger);color:#EE8A6E;}

/* ---------- SEGMENTED CONTROL ---------- */
.segctl{display:flex;background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--r);
  padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.segctl button{flex:1 0 auto;min-height:46px;padding:0 14px;border-radius:7px;font-size:.82rem;
  color:var(--cream-muted);white-space:nowrap;}
.segctl button.active{background:var(--panel-lite);color:var(--white);font-weight:600;}

/* ---------- CONSENT GRID ---------- */
.consent{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.ctog{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:var(--r);
  background:var(--panel-mid);border:1px solid var(--border);font-size:.78rem;text-align:left;line-height:1.2;}
.ctog .box{width:20px;height:20px;flex:0 0 auto;border-radius:5px;border:2px solid var(--cream-muted);
  display:grid;place-items:center;font-size:.75rem;color:transparent;}
.ctog.on{background:rgba(125,135,64,.2);border-color:var(--good);color:var(--white);}
.ctog.on .box{background:var(--good);border-color:var(--good);color:var(--white);}

/* ---------- RECORDER ---------- */
.rec{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);
  background:var(--moss,#1F1812);border:1px solid var(--border);margin-top:12px;}
.rec.live{border-color:var(--danger);background:rgba(193,42,10,.12);}
.rec .rt{font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:300;letter-spacing:-.02em;flex:1;}
.rec.live .rt{color:#EE8A6E;}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--cream-muted);}
.rec.live .recdot{background:var(--danger);animation:pulse 1.2s infinite;}

/* ---------- MISC ---------- */
.divider{height:1px;background:var(--border);margin:14px -16px;}
.kv{display:flex;gap:10px;font-size:.85rem;padding:7px 0;border-bottom:1px solid rgba(85,89,58,.4);
  width:100%;text-align:left;line-height:1.45;}
.kv:last-child{border-bottom:0;}
.kv b{flex:0 0 92px;font-weight:500;color:var(--cream-muted);font-size:.75rem;
  letter-spacing:.06em;text-transform:uppercase;padding-top:2px;}

/* ---------- TAPPABILITY ----------
   Anything that opens something else gets the same affordance:
   a chevron, an ochre value, and a visible press state. If it
   looks like this, it does something when you touch it. */
.kv.tap{min-height:46px;align-items:center;padding:9px 0;}
.kv.tap .grow{color:var(--ochre-lite);}
.kv.tap::after{content:'›';color:var(--cream-muted);font-size:1.3rem;line-height:1;
  flex:0 0 auto;padding-left:4px;}
.kv.tap:active{background:var(--panel-lite);border-radius:6px;
  box-shadow:0 0 0 8px var(--panel-lite);}
.card.tap:active,.tlitem .card:active,.q:active{background:var(--panel-lite);}
.card.tap{position:relative;}
.chip.tap:active{background:var(--panel-lite);}
.tapnote{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-muted);
  display:flex;align-items:center;gap:5px;margin-top:2px;}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.linkrow .btn{flex:1 1 auto;min-width:132px;}
.empty{text-align:center;padding:48px 20px;color:var(--cream-muted);}
.empty .big{font-size:2.6rem;opacity:.5;margin-bottom:10px;}
a.link{color:var(--ochre-lite);text-decoration:none;border-bottom:1px solid rgba(217,154,53,.4);}
.notefield{min-height:76px;resize:vertical;margin-top:10px;font-size:15px;}

/* ---------- QUESTION GUIDE ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:14px -16px 0;padding:12px 16px 10px;border-top:1px solid var(--border);}
.qhead .lbl{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-muted);}
.qcount{font-variant-numeric:tabular-nums;font-size:.72rem;color:var(--ochre-lite);white-space:nowrap;}
.qcount.done{color:#C3CB82;}
.qwrap{display:flex;flex-direction:column;gap:8px;}
.q{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:13px 14px;border-radius:var(--r);background:var(--panel-mid);
  border:1px solid var(--border);border-left:3px solid var(--ochre);line-height:1.45;}
.q:active{background:var(--panel-lite);}
.q .qbox{width:22px;height:22px;flex:0 0 auto;margin-top:1px;border-radius:6px;
  border:2px solid var(--cream-muted);display:grid;place-items:center;font-size:.8rem;color:transparent;}
.q .qlabel{display:block;font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ochre-lite);margin-bottom:5px;}
.q .qtext{display:block;font-size:.95rem;color:var(--white);}
.q.asked{border-left-color:var(--good);background:var(--panel-bg);}
.q.asked .qbox{background:var(--good);border-color:var(--good);color:var(--white);}
.q.asked .qtext{color:var(--cream-muted);}
.q.asked .qlabel{color:var(--cream-muted);}
.qsub{margin:8px 0 0 33px;padding-left:12px;border-left:1px solid var(--border);
  display:flex;flex-direction:column;gap:7px;}
.qsub div{font-size:.85rem;color:var(--cream-dim);line-height:1.4;}
.qsub div::before{content:'↳ ';color:var(--cream-muted);}
.qfocus{font-size:.85rem;color:var(--ochre-lite);margin-top:9px;line-height:1.4;}
.qnone{font-size:.85rem;color:#E8775A;padding:12px 14px;border-radius:var(--r);
  background:rgba(193,42,10,.14);border:1px solid var(--clay-lite);line-height:1.45;}
.qsrc{font-size:.72rem;color:var(--cream-muted);line-height:1.5;padding:11px 13px;
  background:var(--panel-mid);border-radius:var(--r);margin-bottom:12px;}
.qgroup{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre-lite);
  margin:18px 0 8px;}

/* ---------- SHEET (modal) ---------- */
#scrim{position:fixed;inset:0;background:rgba(8,10,5,.72);z-index:40;opacity:0;pointer-events:none;
  transition:.22s;backdrop-filter:blur(3px);}
#scrim.open{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel-bg);
  border-top:1px solid var(--ochre);border-radius:20px 20px 0 0;
  max-height:88dvh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding:8px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch;}
#sheet.open{transform:translateY(0);}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 14px;}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-16px);z-index:60;
  bottom:calc(var(--tabbar-h) + var(--safe-b) + 16px);background:var(--panel-lite);
  border:1px solid var(--ochre);color:var(--white);padding:12px 20px;border-radius:99px;
  font-size:.86rem;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 26px rgba(0,0,0,.5);
  max-width:88vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- TABLET / LANDSCAPE ---------- */
@media (min-width:760px){
  #main{padding:20px 24px calc(var(--tabbar-h) + var(--safe-b) + 28px);max-width:1100px;margin:0 auto;width:100%;}
  .now-title{font-size:2.2rem;}
  .countdown{font-size:3.2rem;}
  .consent{grid-template-columns:repeat(4,1fr);}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .cols2 .card{margin-bottom:0;}
  #tabbar{grid-template-columns:repeat(5,minmax(0,190px));justify-content:center;}
}
.brief-sec{margin-top:18px}
.brief-sec h3{font-size:1.15rem;color:var(--white);margin:0 0 8px}
.brief-sec.flag{border:1px solid var(--clay-lite);background:rgba(193,42,10,.12);border-radius:var(--r);padding:12px 14px}
.brief-sec.flag h3{color:#E8775A}
.brief-intro{font-size:.9rem;color:var(--cream-dim);line-height:1.5;margin-bottom:8px}
.brief-item{padding:10px 0;border-top:1px solid rgba(85,89,58,.45)}
.brief-item b{display:block;color:var(--ochre-lite);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;font-weight:600}
.brief-item p{margin:0;font-size:.92rem;line-height:1.5;color:var(--cream)}
.brief-src{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.brief-src a{font-size:.68rem;color:var(--cream-muted);text-decoration:none;border:1px solid var(--border);border-radius:99px;padding:3px 9px}
.brief-src a:active{background:var(--panel-lite)}
.brief-loc{margin-top:7px}

/* ---------- PALETTE VARIETY ---------- */
#topbar{border-bottom:0}
#topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#3A3D25 0 20%,#BC7710 20% 40%,#701905 40% 60%,#C12A0A 60% 80%,#BDAA72 80% 100%)}
.sec-label{color:#A89A6A}
.btn{background:#3A3D25;border-color:#55593A}
.btn.ghost{background:transparent}
.tabbtn[data-view=now].active{color:#D99A35}
.tabbtn[data-view=day].active{color:#BDAA72}
.tabbtn[data-view=show].active{color:#E8775A}
.tabbtn[data-view=oral].active{color:#D8462A}
.tabbtn[data-view=place].active{color:#C3CB82}

/* NOW card — Cedar into Darkness */
#nowcard{background:linear-gradient(155deg,#5a1606 0%,#3a1306 40%,#1C2012 100%);border-color:#BC7710}
#nowcard::before{background:linear-gradient(180deg,#BC7710,#C12A0A)}
#nowcard.idle{background:linear-gradient(155deg,#3A3D25,#262A18 55%,#1C2012);border-color:#55593A}
#nowcard.idle::before{background:#BDAA72}
#progressbar i{background:linear-gradient(90deg,#BC7710,#C12A0A)}

/* Block types — chip, time, dot and card edge share a colour */
.chip.speaking{background:rgba(188,119,16,.2);border-color:#BC7710;color:#E2A548}
.chip.interview{background:rgba(193,42,10,.22);border-color:#C12A0A;color:#EE8A6E}
.chip.travel{background:rgba(189,170,114,.16);border-color:#BDAA72;color:#E1D29E}
.chip.site{background:rgba(125,135,64,.24);border-color:#7D8740;color:#C3CB82}
.chip.meal{background:rgba(112,25,5,.45);border-color:#9A2A10;color:#E8B39A}
.chip.free{background:transparent;border-color:#55593A;color:#A89A6A}
.tlitem .card{border-left-width:4px}
.tlitem.t-speaking .card{border-left-color:#BC7710}   .tlitem.t-speaking .timecol{color:#E2A548}
.tlitem.t-interview .card{border-left-color:#C12A0A} .tlitem.t-interview .timecol{color:#EE8A6E}
.tlitem.t-travel .card{border-left-color:#BDAA72}    .tlitem.t-travel .timecol{color:#E1D29E}
.tlitem.t-site .card{border-left-color:#7D8740}      .tlitem.t-site .timecol{color:#C3CB82}
.tlitem.t-meal .card{border-left-color:#9A2A10}   .tlitem.t-meal .timecol{color:#E8B39A}
.tlitem.t-free .card{border-left-color:#55593A}   .tlitem.t-free .timecol{color:#A89A6A}

.shot{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;border-radius:var(--r);
  background:var(--panel-mid);border:1px solid var(--border);border-left:3px solid var(--sc,#BC7710);margin-bottom:7px;line-height:1.4}

.shot .qbox{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:2px solid var(--cream-muted);display:grid;place-items:center;font-size:.8rem;color:transparent;margin-top:1px}

.shot.got .st{text-decoration:line-through;text-decoration-color:var(--cream-muted)}
.shot .sk{display:inline-block;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sc2,#E2A548);margin-right:6px}
.shot .st{display:block;color:var(--white);font-size:.93rem;margin-top:2px}
.shot .sn{display:block;color:var(--cream-dim);font-size:.8rem;margin-top:4px}
.shot .rel{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#EE8A6E;border:1px solid #C12A0A;border-radius:99px;padding:1px 6px;margin-left:4px}
.shot.k-wide{--sc:#BC7710;--sc2:#E2A548} .shot.k-detail{--sc:#7D8740;--sc2:#C3CB82}
.shot.k-action{--sc:#C12A0A;--sc2:#EE8A6E} .shot.k-sound{--sc:#BDAA72;--sc2:#E1D29E}
.shot.k-portrait{--sc:#9A2A10;--sc2:#E8B39A} .shot.k-archival{--sc:#55593A;--sc2:#A89A6A}
.shotcard{background:linear-gradient(135deg,#3A3D25,#22261A 70%);border-color:#7D8740}


.phr{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:var(--r);background:var(--panel-mid);
  border:1px solid var(--border);border-left:3px solid var(--pc,#BC7710);margin-bottom:7px}
.phr.k-q{--pc:#C12A0A}.phr.k-w{--pc:#7D8740}.phr.k-p{--pc:#BC7710}
.phr .es{display:block;font-family:var(--serif);font-size:1.12rem;color:var(--white);line-height:1.25}
.phr .en{display:block;font-size:.82rem;color:var(--cream-dim);margin-top:3px}
.phr .nt{display:block;font-size:.74rem;color:#A89A6A;margin-top:4px;font-style:italic}
.phr .say{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--panel-lite);
  color:var(--cream);font-size:.95rem;display:grid;place-items:center}
.phr .say:active{background:#BC7710;color:#1F1406}
.phrcard{background:linear-gradient(135deg,#9A2A10,#3a1306 65%,#22261A);border-color:#C12A0A}
.phrkey{display:flex;gap:12px;flex-wrap:wrap;font-size:.68rem;color:var(--cream-muted);margin:4px 0 10px}
.phrkey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

#topbar .belmark{width:38px;height:38px;flex:0 0 auto;margin-right:-2px}

	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {
	right: 0;
	margin-right: -12px;
	border-left-color: #fff;
	}
.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;
	border-right-color: #fff;
	}

/* Printing */

@media print {
	/* Prevent printers from removing background-images of controls. */
	.leaflet-control {
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
		}
	}

#nowmap{height:300px;border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;background:#0F1209;z-index:1}
#nowmap .leaflet-tile-pane{filter:brightness(.82) saturate(.75)}
.leaflet-container{font-family:var(--sans)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel-mid);color:var(--cream);border:1px solid var(--border)}
.leaflet-popup-content{margin:12px 14px;font-size:.85rem;line-height:1.4}
.leaflet-container a.leaflet-popup-close-button{color:var(--cream-muted)}
.leaflet-control-attribution{background:rgba(22,26,14,.8)!important;color:var(--cream-muted)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--cream-dim)!important}
.leaflet-bar a{background:var(--panel-mid);color:var(--cream);border-color:var(--border)}
.mpin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;
  background:var(--panel-lite);color:var(--white);border:2px solid var(--cream);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.mpin.cur{background:var(--ochre);color:#231a10;border-color:var(--white);box-shadow:0 0 0 6px rgba(188,119,16,.35)}
.mpin.done{background:var(--good);opacity:.7}
.mtag{min-width:24px;height:20px;padding:0 5px;border-radius:5px;display:grid;place-items:center;font-size:.66rem;font-weight:700;
  background:#701905;color:var(--white);border:1px solid #BDAA72;box-shadow:0 1px 5px rgba(0,0,0,.45);white-space:nowrap}
.pnum{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;margin-right:8px;border-radius:5px;
  background:#701905;color:var(--white);border:1px solid var(--cream-muted);font-family:var(--sans);font-size:.72rem;font-weight:700;vertical-align:3px}
.mpin.me{width:16px;height:16px;background:var(--info);border:3px solid #fff}
.mpop b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--white);margin-bottom:4px}
.mpop .t{color:var(--cream-dim);font-size:.78rem}
.mpop .r{display:flex;gap:6px;margin-top:9px}
.mpop button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--border);background:var(--panel-lite);color:var(--cream);font-size:.75rem}
.mpop button.o{background:var(--ochre);color:#231a10;border-color:var(--ochre-lite);font-weight:600}
.maplegend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px;font-size:.7rem;color:var(--cream-muted)}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

</style>

chool. From the saved Costa Rica map. Commercial bananas began here in 1872; heart of the Jamaican/Antillean migration. See Field briefing §4–5.", "lat": 9.9913106, "lng": -83.0415078}, {"id": "loc_houseculture", "name": "House of Culture (Casa de la Cultura), Limón", "address": "XXVC+9J8, Limón", "kind": "historical", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "Documents the daily life, art and history of the region's ethnic groups, with a focus on Afro-Caribbean heritage. From the saved Costa Rica map.", "lat": 9.9934529, "lng": -83.0284575}, {"id": "loc_taylors", "name": "Taylor's Dine & Grill — next to Black Star Line", "address": "XXVC+W2P, costado este, Black Star Line, C. 5, Limón 70101", "kind": "community", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "From the saved Costa Rica map.", "lat": 9.9945918, "lng": -83.0306306}, {"id": "loc_lizzie", "name": "Lizzie 1872", "address": "Limón 70101", "kind": "community", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "From the saved Costa Rica map. Likely named for the schooner Lizzie, which landed 123 Jamaican railway workers at Limón on 15 Jan 1873 (Field briefing §8).", "lat": 10.0037495, "lng": -83.0333247}, {"id": "loc_bananatour", "name": "Banana Plantation Tour & Gift Shop", "address": "XW7G+45V, Ruta 241, Limón", "kind": "ecological", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "From the saved Costa Rica map. See Field briefing §5.", "lat": 9.9634182, "lng": -83.0751375}, {"id": "loc_westfalia", "name": "Westfalia Green Valley CR", "address": "Limón 70101", "kind": "ecological", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "Ecological farm near Puerto Limón with trails and medicinal and ornamental plants. From the saved Costa Rica map.", "lat": 9.9212497, "lng": -83.0052481}, {"id": "loc_bananito", "name": "Selva Bananito Lodge", "address": "Bananito Sur, Limón", "kind": "lodging", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "From the saved Costa Rica map.", "lat": 9.8224182, "lng": -83.0628433}, {"id": "loc_tortuguero", "name": "Tortuguero", "address": "Pococí, Limón", "kind": "ecological", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "Far north of Limón province — boat access. Not on the schedule. From the saved Costa Rica map.", "lat": 10.540018, "lng": -83.5021945}, {"id": "loc_kekoldi", "name": "Këköldi Indigenous Reserve", "address": "Këköldi territory, inland from Puerto Viejo de Talamanca (confirm access point)", "kind": "ecological", "meetingPoint": "", "parking": "", "access": "", "contact": "Community-sanctioned tours — reservaskalawala.com", "notes": "Land reclamation; Këköldi Scientific Center. Visit only via community-sanctioned tours. See Field briefing §6.", "lat": null, "lng": null}, {"id": "loc_pvcasa", "name": "Casa de la Cultura de Puerto Viejo (former UNIA Liberty Hall)", "address": "Puerto Viejo de Talamanca — ask locally", "kind": "historical", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "Land bought by Garvey supporters in 1935; Liberty Hall completed 1937; later an English school. Pin not set — find it on the Monday ride. See Field briefing §8.", "lat": null, "lng": null}, {"id": "loc_libertyhall", "name": "UNIA Liberty Hall / Black Star Line — Limón", "address": "Next to Taylor's Dine & Grill, C. 5, Limón", "kind": "historical", "meetingPoint": "", "parking": "", "access": "", "contact": "", "notes": "Known locally as “the Blacks” (Black Star Line). National heritage building. Pin approximate. See Field briefing §8.", "lat": 9.99455, "lng": -83.031}], "log": [], "createdAt": 0, "updatedAt": 0, "sharedBank": {"title": "Black Land and Water Stories — general bank", "source": "Gayle T. Tate · Black Ecologies Summer Institute 2026. Written for the Northern Neck & Middle Peninsula of Virginia project; adapt the Virginia-specific references before using in Costa Rica. [One typo corrected from the source: 'growing n them' → 'growing in them'.]", "groups": [{"name": "Water", "qs": ["Please tell us the story of how you came to fishing and working with the water? What are some of your more memorable moments in this development?", "Many people say that they have familial connections to these practices. Do you? If so could you describe those? If not could you tell us more about how you came to it?", "What are some of your favorite things to catch? What are some of the critical steps in catching this kind of fish?", "Do you eat or share or both? If so, please tell us about that.", "What other benefits do you find in fishing or being on the water?", "What is your favorite way to prepare fish? Tell us the rough outline of a favorite recipe?", "Do you hunt or garden? Could you tell us about your other experiences with these? What do you get out of these activities?"]}, {"name": "Land", "qs": ["Please tell us the story of how you came to stewarding the land and or growing on it? What are some of your more memorable moments in this development?", "Many people say that they have familial connections to these practices. Do you? If so could you describe those? If not could you tell us more about how you came to it?", "What are some of your favorite things to grow? What are some of the critical steps in growing these plants? How do you use them?", "What is your favorite way to prepare what you grow? Could you tell us the rough outline of a favorite recipe?", "Do you eat or share or both? If so, please tell us about that.", "What other benefits do you find in growing on the land or stewarding it?", "Do you hunt or fish? Could you tell us about your other experiences with these? What do you get out of these activities?"]}, {"name": "Spirit, change & extraction", "qs": ["Many people we have interviewed for this work describe spiritual connections they establish to or through land or water. If you’re comfortable discussing it, can you tell us about any such connections you find outdoors?", "Have you noticed changes in these systems in your time fishing, hunting, or growing in them? Are there more or less of certain species? Have you noticed changes in the water or the land? If so what do you think is making these changes?", "Have you noticed changes in the land or atmosphere in your time growing on them? Have certain things become more difficult to grow? If so what do you think is making these changes?", "What do you think about the proposed data center on the Rappahannock River in Caroline that will siphon 90 million gallons of water a day from the river? Or about Virginia being the data center capital of the U.S.? [ADAPT — swap for local development and land pressures on the Talamanca coast.]"]}]}, "briefing": {"title": "Field briefing — Afro-Indigenous history & land on the southern Caribbean", "source": "Research notes compiled by Jona, Oct 8 2026. Sources kept as given; tap any to open (needs signal).", "sections": [{"h": "Read with care", "flag": true, "items": [{"t": "Two framings sit side by side", "b": "Section 1 says colonial Costa Rica had no large, permanent Maroon societies; sections 3–4 describe an Afro-Indigenous refuge in Talamanca. They can both be true (small-scale flight and absorption into Bribri and Cabécar communities, not palenques), but hold them together when you talk to people, and let local accounts lead.", "src": [], "loc": null}, {"t": "Uneven sources", "b": "The scholarly anchors here are the UT repository and the Academia paper on Africans in colonial Costa Rica (1600–1750). The Bribri-welcome and \"Zambo\" claims rest mostly on a hotel blog (The Oasis at Puket); several other points rest on Facebook posts and Instagram reels. Treat those as leads to test, not citations.", "src": [], "loc": null}, {"t": "Shipwreck numbers — now clearer", "b": "2025 reporting (CNN, Archaeology): the ships sailed from Copenhagen via West Africa — the Fridericus Quartus from Ghana (the Gold Coast) — with about 800 people aboard; more than 600 Africans were put ashore in what is now Cahuita National Park. That does not support the “~800 Yoruba” line in the earlier notes — say “from the Gold Coast” unless a source shows otherwise. The Këköldi Supreme Court ruling still needs checking.", "src": [["CNN via KTVZ (full text)", "https://ktvz.com/cnn-other/2025/05/02/costa-rica-shipwrecks-long-thought-to-be-pirate-ships-were-transporting-enslaved-people-scientists-say/"], ["Archaeology Magazine", "https://archaeology.org/news/2025/05/05/wrecks-of-two-danish-slave-ships-located-off-costa-rica/"]], "loc": null}]}, {"h": "1 · Slavery & resistance in colonial Costa Rica", "intro": "Unlike Jamaica, Colombia or Mexico, Costa Rica did not develop large, autonomous or permanent Maroon (cimarrón or palenque) societies. With a small enslaved population, sparse colonial infrastructure and an integrated multi-ethnic labor force, resistance generally took the form of individual flight, day-to-day adaptation, or integration into Indigenous and mestizo communities rather than large-scale mountain states.", "src": [["Politika", "https://www.politika.io/en/notice/maroons-and-their-communities-in-the-americas"], ["UT repository", "https://repositories.lib.utexas.edu/items/310bf4f4-8652-4935-9a72-d738bec6b7b5"], ["Facebook — Black Hikers Unite", "https://www.facebook.com/groups/blackhikersuniteinc/posts/1901232884148038/"], ["Academia — Africans & descendants 1600–1750", "https://www.academia.edu/45528535/Africans_and_Their_Descendants_in_Colonial_Costa_Rica_1600_1750"], ["Wikipedia — Maroons", "https://en.wikipedia.org/wiki/Maroons"]], "items": [{"t": "A poor, isolated outpost", "b": "Unlike the plantation economies of the Caribbean or the US South, colonial Costa Rica was a poor, isolated outpost of the Spanish Empire.", "src": [["Tico Times — Finding La Negrita", "https://ticotimes.net/2022/07/31/finding-la-negrita-a-story-of-coming-home"], ["UT repository", "https://repositories.lib.utexas.edu/items/310bf4f4-8652-4935-9a72-d738bec6b7b5"]], "loc": null}, {"t": "Demographics", "b": "Enslaved Africans were a distinct minority in the colonial province's population.", "src": [["UT repository", "https://repositories.lib.utexas.edu/items/310bf4f4-8652-4935-9a72-d738bec6b7b5"]], "loc": null}, {"t": "The first wave", "b": "Enslaved Africans arrived in the 1500s with Spanish conquistadors. With no direct slave port, most were trafficked through Portobelo, Panama.", "src": [["Wikipedia — Afro–Costa Ricans", "https://en.wikipedia.org/wiki/Afro%E2%80%93Costa_Ricans"], ["AA Registry", "https://aaregistry.org/story/the-afro-costa-rican-community-a-story/"], ["Black Agenda Report", "https://www.blackagendareport.com/bar-book-forum-natasha-gordon-chipemberes-finding-la-negrita"]], "loc": null}, {"t": "Labor", "b": "No heavy cash-crop economy in the early centuries: enslaved people worked alongside Indigenous and mestizo laborers on small farms, cattle ranches and as domestics — domestic estates in Cartago, cattle ranches in Nicoya, and isolated cacao plantations in the Matina Valley on the Caribbean coast.", "src": [["Tico Times — Finding La Negrita", "https://ticotimes.net/2022/07/31/finding-la-negrita-a-story-of-coming-home"], ["Academia — Africans & descendants 1600–1750", "https://www.academia.edu/45528535/Africans_and_Their_Descendants_in_Colonial_Costa_Rica_1600_1750"]], "loc": null}, {"t": "Forms of flight", "b": "Rather than militarized palenques (as in Panama or Colombia), cimarrones more often blended into remote frontier zones, allied temporarily with Indigenous groups, or assimilated into the free pardo (mixed-race) population.", "src": [["Wikipedia — Maroons", "https://en.wikipedia.org/wiki/Maroons"], ["YouTube", "https://www.youtube.com/watch?v=i3HUobyirFM"], ["Facebook — Black Hikers Unite", "https://www.facebook.com/groups/blackhikersuniteinc/posts/1901232884148038/"], ["Academia — Africans & descendants 1600–1750", "https://www.academia.edu/45528535/Africans_and_Their_Descendants_in_Colonial_Costa_Rica_1600_1750"]], "loc": null}, {"t": "Abolition", "b": "Because the enslaved population was small, many achieved freedom or integrated into the multi-ethnic populace. Costa Rica abolished slavery in 1824.", "src": [["Coopersquared", "https://coopersquared.com/2022/12/13/afro-costa-ricans-history-of-inequality-long-road-to-pura-vida/"], ["UT repository", "https://repositories.lib.utexas.edu/items/310bf4f4-8652-4935-9a72-d738bec6b7b5"], ["AA Registry", "https://aaregistry.org/story/the-afro-costa-rican-community-a-story/"]], "loc": null}]}, {"h": "2 · The unconquered Bribri & the Talamanca sanctuary", "items": [{"t": "Matrilineal clans", "b": "The Bribri are one of Costa Rica's largest Indigenous peoples, organized around a matrilineal clan system in which women hold spiritual and land-inheriting power.", "src": [["IC Magazine — Bribri", "https://icmagazine.org/indigenous-peoples/bribri/"], ["Wikipedia — Bribri", "https://en.wikipedia.org/wiki/Bribri_people"]], "loc": "loc_bribri"}, {"t": "Refuge in the mountains", "b": "When the Spanish tried to enslave and displace Indigenous peoples in the 16th–17th centuries, the Bribri and Cabécar resisted and retreated into the Talamanca range. The Spanish never truly conquered it, so Talamanca stayed outside colonial control — and became a refuge for others fleeing Spanish rule.", "src": [["EBSCO Research Starters", "https://www.ebsco.com/research-starters/social-sciences-and-humanities/indigenous-people-central-america-and-costa-rica/"], ["WRM — Bribris, a people never conquered", "https://www.wrm.org.uy/bulletin-articles/bribris-a-people-never-conquered-who-are-standing-up-to-redd"], ["Facebook group post", "https://www.facebook.com/groups/356776146318389/posts/1044874020841928/"], ["The Oasis at Puket (hotel blog)", "https://theoasisatpuket.com/afro-caribbean-culture-puerto-viejo/"]], "loc": null}]}, {"h": "3 · Shipwrecks & Afro-Indigenous convergence", "items": [{"t": "What happened, 1710", "b": "Two Danish slave ships, the Fridericus Quartus and Christianus Quintus, sailed Copenhagen → West Africa → the Caribbean, bound for the Danish colony of St. Thomas. Lost in haze, they reached this coast on 2 March 1710. After a rebellion on the Fridericus Quartus and a mutiny of sailors and captives, the Fridericus Quartus was set on fire and the Christianus Quintus lost its anchor line and drifted onto the reef. More than 600 Africans were left on the beach at what is now Cahuita National Park.", "src": [["CNN via KTVZ (full text)", "https://ktvz.com/cnn-other/2025/05/02/costa-rica-shipwrecks-long-thought-to-be-pirate-ships-were-transporting-enslaved-people-scientists-say/"], ["Archaeology Magazine", "https://archaeology.org/news/2025/05/05/wrecks-of-two-danish-slave-ships-located-off-costa-rica/"], ["CNN — Danish slave ships (May 2025)", "https://www.cnn.com/2025/05/02/science/danish-slave-ships-costa-rica-intl-scli"]], "loc": "loc_cahuita"}, {"t": "How the wrecks were identified (2023–25)", "b": "Locals long called them pirate ships. In 2015 US archaeologists noticed yellow bricks; in 2023 the National Museum of Denmark and the Viking Ship Museum excavated. Oak dated by tree rings to 1690–95 (western Baltic); bricks made in Flensburg from southern Danish clay; Danish clay pipes from just before 1710; charred timbers matching the recorded fire. Led by David Gregory and Andreas Kallmeyer Bloch (National Museum of Denmark).", "src": [["CNN via KTVZ (full text)", "https://ktvz.com/cnn-other/2025/05/02/costa-rica-shipwrecks-long-thought-to-be-pirate-ships-were-transporting-enslaved-people-scientists-say/"], ["Archaeology Magazine", "https://archaeology.org/news/2025/05/05/wrecks-of-two-danish-slave-ships-located-off-costa-rica/"], ["ECU — Expedition Costa Rica", "https://sites.ecu.edu/expeditioncostarica/?p=36"]], "loc": "loc_cahuita"}, {"t": "The youth divers", "b": "For about a decade, young Afro-descendant and Indigenous scuba divers trained by the Ambassadors of the Sea Community Diving Center (founded by María Suárez Toro) worked on the identification. The project appeared in the 2020 series Enslaved.", "src": [["CNN via KTVZ (full text)", "https://ktvz.com/cnn-other/2025/05/02/costa-rica-shipwrecks-long-thought-to-be-pirate-ships-were-transporting-enslaved-people-scientists-say/"], ["Semanario Universidad — youth divers", "https://semanariouniversidad.com/cultura/jovenes-del-caribe-sur-cuidan-patrimonio-en-el-fondo-del-mar-y-recuperan-su-historia-perdida/"], ["Wikipedia — María Suárez Toro", "https://en.wikipedia.org/wiki/Mar%C3%ADa_Su%C3%A1rez_Toro"], ["Nat Geo — Into the Depths, ep. 3", "https://www.nationalgeographic.com/podcasts/into-the-depths/article/episode-3-building"]], "loc": "loc_cahuita"}, {"t": "Descendants", "b": "Celia Ortiz of Cartago told CNN her 103-year-old mother descends from Miguel Maroto, one of the men who came ashore. Many survivors were captured by the Spanish and sold inland — which is why descendants turn up in the Central Valley, not only on the coast (see Lohse). A story lead, not a contact: approach only through people who already know the family.", "src": [["CNN via KTVZ (full text)", "https://ktvz.com/cnn-other/2025/05/02/costa-rica-shipwrecks-long-thought-to-be-pirate-ships-were-transporting-enslaved-people-scientists-say/"], ["Lohse dissertation (UT Austin, 2005)", "https://repositories.lib.utexas.edu/items/310bf4f4-8652-4935-9a72-d738bec6b7b5"]], "loc": null}, {"t": "Convergence in Talamanca", "b": "Some survivors, with maroons from the Matina cacao plantations, are said to have found refuge in the Talamanca mountains among the Bribri. This rests mainly on a hotel blog — ask the Bribri guide and the divers what they know before using it.", "src": [["The Oasis at Puket (hotel blog)", "https://theoasisatpuket.com/afro-caribbean-culture-puerto-viejo/"]], "loc": null}, {"t": "\"Zambos\"", "b": "Escaped Africans are said to have intermarried with Bribri and Cabécar communities; their descendants were historically called Zambos. Same caution as above.", "src": [["AA Registry", "https://aaregistry.org/story/the-afro-costa-rican-community-a-story/"], ["The Oasis at Puket (hotel blog)", "https://theoasisatpuket.com/afro-caribbean-culture-puerto-viejo/"]], "loc": null}]}, {"h": "4 · Later Afro-Costa Rican culture & erasure", "items": [{"t": "The second wave", "b": "In the late 19th century thousands of free Afro-Caribbean workers, mainly from Jamaica, came to Limón to build the national railroad and work for the United Fruit Company. Today's Afro-Caribbean and calypso heritage is largely rooted in that migration rather than in colonial Maroon communities.", "src": [["The Oasis at Puket — Jamaican immigration", "https://theoasisatpuket.com/jamaican-immigration-and-afro-caribbean-culture-in-limon-costa-rica/"], ["Wikipedia — Afro–Costa Ricans", "https://en.wikipedia.org/wiki/Afro%E2%80%93Costa_Ricans"], ["The Oasis at Puket (hotel blog)", "https://theoasisatpuket.com/afro-caribbean-culture-puerto-viejo/"], ["Travel Noire — Inside Limón", "https://travelnoire.com/inside-limon-the-land-of-afro-costa-ricans"]], "loc": "loc_limon"}, {"t": "What gets overshadowed", "b": "Modern Limón culture strongly reflects those Jamaican roots, which can eclipse the older alliance between the Bribri and Africans who freed themselves.", "src": [["The Oasis at Puket (hotel blog)", "https://theoasisatpuket.com/afro-caribbean-culture-puerto-viejo/"]], "loc": null}, {"t": "Limón Province today", "b": "Puerto Limón, Cahuita and Puerto Viejo are the cultural center of Afro-Costa Ricans — distinct traditions, Limonese Creole, and celebrations.", "src": [["Instagram reel", "https://www.instagram.com/reel/CxHK5SopLev/?hl=en"], ["Instagram reel", "https://www.instagram.com/reel/DUnb0sKDlwW/"]], "loc": "loc_houseculture"}, {"t": "Central Valley", "b": "Significant secondary migration of Afro-descendant residents to San José, Alajuela and Heredia over the decades, for education, work and urban life.", "src": [["My Tan Feet — Central Valley", "https://mytanfeet.com/costa-rica-travel-tips/visit-central-valley-in-costa-rica/"], ["My Tan Feet — Grecia", "https://mytanfeet.com/cities-costa-rica/grecia-costa-rica-alajuela/"], ["Quatro Legal", "https://quatro.legal/considering-the-regions-of-costa-rica/"], ["Minority Rights Group", "https://minorityrights.org/country/costa-rica/"], ["Instagram reel", "https://www.instagram.com/reel/DUnb0sKDlwW/"]], "loc": null}]}, {"h": "5 · Bananas", "intro": "Plantations are concentrated in the Caribbean lowlands of Limón and in Sarapiquí; bananas are one of the country's top agricultural exports.", "items": [{"t": "Origins", "b": "Commercial banana farming began in Limón in 1872, driven by railroad expansion and major US fruit companies.", "src": [], "loc": "loc_limon"}, {"t": "Major producers", "b": "Global brands like Dole run large-scale farms in Sarapiquí and on the Caribbean coast.", "src": [["Dole", "https://www.dole.com/en-gb/blog/the-home-of-dole-bananas"]], "loc": null}, {"t": "Certification", "b": "Rainforest Alliance has certified model farms — including Platanera Río Sixaola — that target carbon neutrality and protect surrounding forest.", "src": [["Rainforest Alliance", "https://www.rainforest-alliance.org/in-the-field/these-banana-farms-in-costa-rica-are-growing-a-brighter-future/"]], "loc": "loc_platanera"}, {"t": "Pesticides", "b": "Intensive pesticide use remains a critical ecological problem, with a high volume of authorized fungicides and nematicides.", "src": [["ScienceDirect — pesticide study", "https://www.sciencedirect.com/science/article/pii/S0160412023001502"]], "loc": null}, {"t": "Growing & packing", "b": "About nine months from shoot to harvest. Bunches are wrapped in blue plastic bags against pests; colored ribbons mark the target export market.", "src": [], "loc": null}, {"t": "Visiting", "b": "Working farms can be visited — the Banana Plantation Tour & Gift Shop near Limón, or eco-farms in Sarapiquí.", "src": [], "loc": "loc_bananatour"}]}, {"h": "6 · Land rights now — Puerto Viejo (Wolaba)", "intro": "The southern Caribbean is at a tipping point: high-end gentrification, luxury hotel development and legal ambiguity around the Maritime-Terrestrial Zone law are putting pressure on ancestral land. A Supreme Court ruling reportedly ordered the state to expropriate coastal lands in Cocles and Puerto Viejo and return them to the Këköldi Indigenous Reserve — a complex landscape in which Afro-descendant and Indigenous communities are organizing to protect their spaces.", "src": [["ReVista (Harvard DRCLAS)", "https://revista.drclas.harvard.edu/voices-of-the-caribbean-afro-costa-ricans-move-towards-empowerment-and-equality/"], ["MIR — Garvey's legacy", "https://mironline.ca/costa-ricas-caribbean-coast-marcus-garveys-legacy-as-a-tool-of-resistance/"], ["FCPR — encounter with Afro-Caribbean communities", "https://www.fcpr.org/en/reflexion-de-un-encuentro-con-comunidades-afrocaribenas-en-costa-rica/"]], "items": [{"t": "ATACS", "b": "Asociación de Tribus Afrodescendientes del Caribe Sur — arguably the most important group fighting displacement of Afro-Costa Ricans from coastal ancestral land. Seeks recognition as a tribal people under international law (ILO Convention 169).", "src": [["FCPR — encounter with Afro-Caribbean communities", "https://www.fcpr.org/en/reflexion-de-un-encuentro-con-comunidades-afrocaribenas-en-costa-rica/"]], "loc": null}, {"t": "ODECO", "b": "Organización de Desarrollo Étnico Comunitario — works with ATACS; organizes human rights gatherings in Puerto Viejo (e.g. the Wátima Wéyu Uolaba assembly) and trains community members in legal tools to defend territory.", "src": [["FCPR — encounter with Afro-Caribbean communities", "https://www.fcpr.org/en/reflexion-de-un-encuentro-con-comunidades-afrocaribenas-en-costa-rica/"]], "loc": null}, {"t": "Këköldi Indigenous Reserve", "b": "Just inland from Puerto Viejo and active in land reclamation. The Këköldi Scientific Center works on wildlife conservation, bird research and green iguana repopulation. Community-sanctioned tours put money into territorial defense.", "src": [["Reserva Kalawala — Indigenous travel PV", "https://www.reservaskalawala.com/en/indigenoustravelpv/"], ["ReVista (Harvard DRCLAS)", "https://revista.drclas.harvard.edu/voices-of-the-caribbean-afro-costa-ricans-move-towards-empowerment-and-equality/"], ["Puerto Viejo Satellite — volunteer", "https://www.puertoviejosatellite.com/en/volunteer/"], ["CRHF — Indigenous projects", "https://www.crhf.org/community-services/indigenous-projects/"]], "loc": "loc_kekoldi"}, {"t": "Bribri land defenders", "b": "Deeper in Talamanca, Bribri clans recovering land occupied by non-Indigenous ranchers have faced serious intimidation; Front Line Defenders monitors their safety.", "src": [["Front Line Defenders — Bribri people", "https://www.frontlinedefenders.org/en/organization/bribri-people"]], "loc": null}, {"t": "El Puente / The Bridge", "b": "Puerto Viejo center offering microloans, food security and education support for Bribri and Afro-Caribbean community members.", "src": [["Workaway Foundation", "https://www.workawayfoundation.org/projects/costa-rica"], ["Puerto Viejo Satellite — volunteer", "https://www.puertoviejosatellite.com/en/volunteer/"]], "loc": null}, {"t": "More to follow up", "b": "afrodescendientes.org · Centro de Mujeres Afrocostarricenses.", "src": [["afrodescendientes.org", "https://afrodescendientes.org"], ["Centro de Mujeres Afro (Facebook)", "https://www.facebook.com/centromujeresafro/"]], "loc": null}]}, {"h": "7 · On the ground", "items": [{"t": "Cultural spaces first", "b": "On arrival, ask around about community assemblies or open forums hosted by ATACS.", "src": [], "loc": null}, {"t": "Book Indigenous-owned", "b": "Avoid large foreign-owned permaculture or yoga resorts with a history of land-representation problems. Book directly with Bribri guides from Talamanca or Këköldi.", "src": [["MIR — Garvey's legacy", "https://mironline.ca/costa-ricas-caribbean-coast-marcus-garveys-legacy-as-a-tool-of-resistance/"], ["Reserva Kalawala — Indigenous travel PV", "https://www.reservaskalawala.com/en/indigenoustravelpv/"]], "loc": null}, {"t": "Respect the matrilineal system", "b": "Among the Bribri, land rights and clan lineage pass through women; community decisions and land defense are guided by female elders.", "src": [["Front Line Defenders — Bribri people", "https://www.frontlinedefenders.org/en/organization/bribri-people"]], "loc": null}]}, {"h": "8 · Limón, Garvey & collective memory", "intro": "From Carmen Hutchinson Miller (2012) and Carlos Minott (Asociación Proyecto Caribe). Limón became the “Black province” not by majority but through settlement forced by racism and sustained by everyday Jamaican-rooted practice — language, food, church, celebration.", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""], ["Minott, “Afrodescendants in Costa Rica” (Wadabagei 8:1) — your PDF", ""]], "items": [{"t": "Unwanted, then recruited", "b": "The 1862 Ley de Bases y Colonización barred African and Chinese settlement while paying European immigrants in land. A decade later the railroad needed labour: Kingston papers ran “Labourers Wanted” ads for the Costa Rica Railroad Co. (Dec 1872).", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": null}, {"t": "The schooner Lizzie", "b": "On 15 Jan 1873 the schooner Lizzie docked at Limón from Jamaica with 123 railway workers and 3 women (Gaceta Oficial). Your map's “Lizzie 1872” pin in Limón likely names this ship — ask about it.", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": "loc_lizzie"}, {"t": "Who came", "b": "1,396 Caribbean immigrants Dec 1872 – May 1874; ~20,000 Jamaicans 1900–13 (Chomsky), plus Cubans, St Lucians, Barbadians, Kittitians. One-year contracts became settlement when the 170 km railway took until 1890.", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": null}, {"t": "A landscape that carries the migration", "b": "Travelling down from the Central Valley the vegetation changes — palms, cacao, breadfruit and other trees that came with Caribbean people — and so do the houses along the tracks.", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": null}, {"t": "Food as archive", "b": "Rice and beans in coconut milk with scotch bonnet on Sundays, patties, plantain tart, grater cake, pan bon, ackee and saltfish, red bean soup, coconut biscuit, Johnny cake, rundown, cut cake.", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": "loc_dinnerclass"}, {"t": "Garvey in Costa Rica", "b": "Marcus Garvey worked as a timekeeper for United Fruit in 1910 and visited four times. August 31 — the Día del Negro y de la Cultura Afro-Costarricense — traces to him. The UNIA Liberty Hall in Limón (“the Blacks”, for Black Star Line) was declared national heritage with help from engineer Ramiro Crawford (Limón Roots magazine).", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": "loc_libertyhall"}, {"t": "Puerto Viejo's own Liberty Hall", "b": "Garvey supporters bought land in Puerto Viejo in 1935; the Liberty Hall finished in 1937 later became an English school and is now the Casa de la Cultura de Puerto Viejo. A 2003 bill (Edwin Patterson Bent) proposed renaming it Casa de la Cultura Marcus Garvey.", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": "loc_pvcasa"}, {"t": "Calendar", "b": "Three big dates for Afro-Limonenses: 31 August, 15 September, and Carnaval in October. Carnaval de Limón has traditionally centred on 12 October — check whether anything runs 10–16 Oct this year.", "src": [["Hutchinson Miller, “The Province and Port of Limón” (JAH 1:2, 2012) — your PDF", ""]], "loc": "loc_limon"}, {"t": "Denial and “racial democracy”", "b": "Minott: Costa Rica long described itself as a “white” nation; colonial African ancestry was absorbed and denied (communities in Guanacaste and Puntarenas with African ancestry often do not identify as such). The Cocorí textbook was made optional only after community protest.", "src": [["Minott, “Afrodescendants in Costa Rica” (Wadabagei 8:1) — your PDF", ""]], "loc": null}, {"t": "Political firsts", "b": "Alex Curling, first Afro-descendant congressman (1952); his 1954 bill became Law 1903, the “Curling Rule” against inequality by origin. Later: Joselyn Sawyers, Epsy Campbell, Edwin Patterson Bent.", "src": [["Minott, “Afrodescendants in Costa Rica” (Wadabagei 8:1) — your PDF", ""]], "loc": null}, {"t": "Talamanca's council (2001)", "b": "21 members — 6 Indigenous and 7 Afro-descendant — and no specific anti-racism programme.", "src": [["Minott, “Afrodescendants in Costa Rica” (Wadabagei 8:1) — your PDF", ""]], "loc": null}, {"t": "Afro-Costa Rican organizations (c. 2004)", "b": "Asociación Proyecto Caribe, Centro de Mujeres Afrocostarricenses, a local UNIA chapter, Comité Cívico Cultural de Limón, Remembranzas Afrocaribeñas, Damas del Caribe, Asociación para la Cultura Africana, Centro de Investigación Afrolatinoamericano y del Caribe, Fundación Arte y Cultura, and the festival “Flores de la Diáspora Africana”. Twenty years old — check which are still active.", "src": [["Minott, “Afrodescendants in Costa Rica” (Wadabagei 8:1) — your PDF", ""]], "loc": null}]}, {"h": "9 · Beyond Costa Rica — the wider network", "intro": "Starting points for taking this method across Central America, the Caribbean and the Global South, from the Black Central Americas Project resource list.", "src": [["Black Central Americas Project — resources", "https://www.blackcentralamericasproject.org/resources"]], "items": [{"t": "Black Central Americas Project", "b": "Curated resources across the region. blackcentralamericasproject@gmail.com · Instagram @bcaproject.", "src": [["Black Central Americas Project — resources", "https://www.blackcentralamericasproject.org/resources"], ["Instagram @bcaproject", "https://www.instagram.com/bcaproject/?hl=en"]], "loc": null}, {"t": "Panama", "b": "Afro-Antillean Museum of Panama (Panama City), in a former Methodist church — canal and railroad workers. Melva Lowe de Goodin, Afrodescendientes en el Istmo de Panamá 1501–2012. Bocas del Toro is next door to Sixaola.", "src": [["Museo Afroantillano (PDF)", "https://micultura.gob.pa/wp-content/uploads/2020/05/afroantillano.pdf"], ["Lowe de Goodin (archive.org)", "https://archive.org/details/afrodescendientes/mode/2up"]], "loc": null}, {"t": "Nicaragua & Honduras — Garifuna", "b": "Asociación Afrogarífuna de Nicaragua (AAGANIC). Sarah England, Afro-Central Americans in New York City — Garifuna movement between Honduran coastal villages and NYC.", "src": [["AAGANIC (Facebook)", "https://www.facebook.com/p/Asociaci%C3%B3n-Afrogar%C3%ADfuna-de-Nicaragua-100080485459563/"], ["England (UPF)", "https://upf.com/book.asp?id=9780813080147"]], "loc": null}, {"t": "Landscape & art", "b": "Melanie White, “A Caribbean Coast Feeling” (Small Axe, 2023) — June Beer, Judith Kain, Iris Abrahams: Black Central American women's landscape painting as anticolonial critique. A direct companion to a Black ecologies visual practice.", "src": [["Small Axe", "https://read.dukeupress.edu/small-axe/article-abstract/27/3%20(72)/15/383398/A-Caribbean-Coast-Feeling-On-Black-Central?redirectedFrom=fulltext"]], "loc": null}, {"t": "Regional history", "b": "Lowell Gudmundson, “Africanos y afrodescendientes en Centroamérica” (2010). Lohse on colonial Costa Rica.", "src": [["Gudmundson (Nuevo Mundo)", "https://journals.openedition.org/nuevomundo/57996"], ["Lohse dissertation (UT Austin, 2005)", "https://repositories.lib.utexas.edu/items/310bf4f4-8652-4935-9a72-d738bec6b7b5"]], "loc": null}, {"t": "Rights & travel infrastructure", "b": "Afro-Costa Rica Information Initiative (laws and decrees for Afro-descendant communities). AfroResistance (Janvieve Williams Comrie). AfroLatinx Travel (Dash Harris, Javier Wallace) — group-trip know-how for a future field school.", "src": [["afrocostarica.com", "https://afrocostarica.com/"], ["AfroResistance", "https://www.afroresistance.org/"], ["AfroLatinx Travel", "https://www.instagram.com/afrolatinotravel/?hl=en"]], "loc": null}, {"t": "Underwater heritage", "b": "The Cahuita work links to Black diving networks documenting slave wrecks across the Atlantic (Nat Geo's Into the Depths). A natural thread between a Costa Rica, Caribbean and West Africa programme.", "src": [["Nat Geo — Into the Depths, ep. 3", "https://www.nationalgeographic.com/podcasts/into-the-depths/article/episode-3-building"]], "loc": null}]}]}, "shots": [{"id": "sh01", "loc": "loc_terminal", "kind": "action", "title": "MEPE departure — bags, tickets, bus pulling out", "note": "Arrival/departure bookends for the edit.", "release": false, "got": false}, {"id": "sh02", "loc": "loc_pvbus", "kind": "wide", "title": "Window: the route changing — palms, cacao, breadfruit, houses on the tracks", "note": "Hutchinson Miller: the landscape itself carries the migration. Roll continuously on the descent to the coast (§8).", "release": false, "got": false}, {"id": "sh03", "loc": "loc_pvbus", "kind": "action", "title": "Bus arriving in Puerto Viejo — town in motion", "note": "", "release": false, "got": false}, {"id": "sh04", "loc": "loc_cahuita", "kind": "wide", "title": "Reef line and surf off Cahuita Point from the beach trail", "note": "The 1710 wreck zone. Shoot from shore; don't imply the exact wreck position.", "release": false, "got": false}, {"id": "sh05", "loc": "loc_cahuita", "kind": "action", "title": "Low tracking along the sand toward the point", "note": "Story beat: more than 600 people came ashore here (§3).", "release": false, "got": false}, {"id": "sh06", "loc": "loc_cahuita", "kind": "detail", "title": "Water over coral / light through shallow surf", "note": "Abstract cutaways for the shipwreck narration.", "release": false, "got": false}, {"id": "sh07", "loc": "loc_cahuita", "kind": "sound", "title": "Reef surf and howler monkeys at first light", "note": "Room tone for the whole sequence — 2 min minimum.", "release": false, "got": false}, {"id": "sh08", "loc": "loc_cahuitatown", "kind": "portrait", "title": "Ambassadors of the Sea — divers, gear, the dive centre", "note": "Only with their agreement; minors need guardian consent. Ask what footage they already hold.", "release": true, "got": false}, {"id": "sh09", "loc": "loc_cahuita", "kind": "archival", "title": "Underwater wreck footage — request, don't shoot", "note": "Wrecks sit in a national park; get licensed footage from the divers or the National Museum of Denmark.", "release": false, "got": false}, {"id": "sh10", "loc": "loc_bribri", "kind": "detail", "title": "Cacao pods on the tree; hands opening a pod", "note": "Hands only unless the guide agrees to more.", "release": false, "got": false}, {"id": "sh11", "loc": "loc_bribri", "kind": "action", "title": "Traditional cacao processing — roasting, stone grinding", "note": "Ask first. No ceremony, homes or children without explicit permission (§7).", "release": true, "got": false}, {"id": "sh12", "loc": "loc_bribri", "kind": "wide", "title": "Waterfall — wide and a slow push-in", "note": "Audio will be ambient only.", "release": false, "got": false}, {"id": "sh13", "loc": "loc_bribri", "kind": "sound", "title": "River and forest — 2 min", "note": "", "release": false, "got": false}, {"id": "sh14", "loc": "loc_pvcasa", "kind": "wide", "title": "Casa de la Cultura — former UNIA Liberty Hall (1937)", "note": "Exterior, signage, any plaque; ask who looks after it (§8).", "rel ", "kind": "wide", "title": "Canopy layers — slow tilt from ground to crown", "note": "", "release": false, "got": false}, {"id": "sh25", "loc": "loc_platanera", "kind": "detail", "title": "Banana bunches in blue bags; coloured market ribbons", "note": "Needs farm permission (§5).", "release": false, "got": false}, {"id": "sh26", "loc": "loc_platanera", "kind": "action", "title": "Cable-way and packing line", "note": "Workers' faces only with consent.", "release": true, "got": false}, {"id": "sh27", "loc": "loc_puntauva", "kind": "wide", "title": "Punta Uva from the water — kayak POV", "note": "Waterproof housing.", "release": false, "got": false}, {"id": "sh28", "loc": "loc_cocles", "kind": "wide", "title": "Cocles — beachfront from the sand toward the new builds", "note": "Pairs with the Këköldi land-return story (§6).", "release": false, "got": false}, {"id": "sh29", "loc": "loc_libertyhall", "kind": "wide", "title": "Liberty Hall / Black Star Line building — façade and street life", "note": "National heritage; Garvey thread (§8).", "release": false, "got": false}, {"id": "sh30", "loc": "loc_limon", "kind": "wide", "title": "Port of Limón — cranes, seawall, the sea Jamaican workers arrived by", "note": "Scouting — not on this trip's schedule.", "release": false, "got": false}, {"id": "sh31", "loc": "loc_houseculture", "kind": "detail", "title": "Casa de la Cultura de Limón — exhibits, if filming is allowed", "note": "", "release": false, "got": false}, {"id": "sh32", "loc": "loc_limon", "kind": "archival", "title": "1900 photo of Caribbean railroad workers — Archivo Nacional, Fondo de Fotografía 3198", "note": "Cited by Hutchinson Miller; request a licensed scan.", "release": false, "got": false}, {"id": "sh33", "loc": "loc_limon", "kind": "archival", "title": "1872 “Labourers Wanted” ad, Colonial Standard (UWI Mona library) and Gaceta Oficial 15 Jan 1873 (the Lizzie)", "note": "Title cards for the migration sequence.", "release": false, "got": false}], "phrasebo /* ---------- TIME HELPERS ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function toMin(hhmm){
  if(!hhmm) return 0;
  var m = String(hhmm).match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
  if(!m) return 0;
  var h = +m[1], mm = +m[2];
  if(m[3]){ var ap = m[3].toLowerCase(); if(ap==='pm' && h<12) h+=12; if(ap==='am' && h===12) h=0; }
  return h*60 + mm;
}
function fromMin(min){
  min = ((Math.round(min)%1440)+1440)%1440;
  return pad(Math.floor(min/60)) + ':' + pad(min%60);
}
function fmt12(hhmm){
  var t = toMin(hhmm), h = Math.floor(t/60), m = t%60;
  var ap = h>=12 ? 'PM' : 'AM'; var hh = h%12; if(hh===0) hh=12;
  return hh + ':' + pad(m) + ' ' + ap;
}
function nowMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(iso, n){
  var p = String(iso||todayISO()).split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function prettyDate(iso){
  if(!iso) return '';
  var p = String(iso).split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function durStr(mins){
  mins = Math.max(0, Math.round(mins));
  var h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+'h '+m+'m';
  if(h) return h+'h';
  return m+'m';
}
function clockStr(sec){
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h? h+':' : '') + (h? pad(m) : m) + ':' + pad(s);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============================================================
   DATA MODEL
   ------------------------------------------------------------
   ops = {
     schoolId, schoolTitle, destination, dateStart, days:[{date,label}],
     segments:[ {id,dayIdx,start,end,type,title,speaker,speakerBio,intro,
                 av,locationId,personId,notes,status,actualStart,actualEnd,
                 from,to,mode,buffer} ],
     people:[ {id,name,role,org,phone,email,relation,
               consent:{verbal,written,media,archive},
               stage, device, files, recSec, recStartedAt, topics, notes, recordedOn} ],
     locations:[ {id,name,address,meetingPoint,parking,access,contact,notes,lat,lng} ],
     log:[ {id,ts,kind,text} ]
   }
   ============================================================ */

function blankOps(){
  return {
    version: 1,
    schoolId: null,
    schoolTitle: 'Untitled Field School',
    destination: '',
    dateStart: todayISO(),
    days: [{ date: todayISO(), label: 'Day 1' }],
    segments: [], people: [], locations: [], log: [],
    createdAt: Date.now(), updatedAt: Date.now()
  };
}

/* Map a planner agenda item's type onto a field segment type */
function mapType(t, title){
  t = String(t||'').toLowerCase();
  var s = String(title||'').toLowerCase();
  if(t==='travel' || /depart|arriv|drive|transfer|airport|shuttle|van/.test(s)) return 'travel';
  if(/oral history|interview/.test(s)) return 'interview';
  if(t==='site-visit' || t==='site') return 'site';
  if(/lunch|dinner|breakfast|meal|break/.test(s)) return 'meal';
  if(t==='lecture' || t==='workshop' || t==='community' || t==='panel') return 'speaking';
  return 'speaking';
}

/* Build a field-ops record from a planner field school */
function importFromPlanner(fs, contacts){
  var o = blankOps();
  o.schoolId    = fs.id;
  o.schoolTitle = fs.title || 'Field School';
  o.destination = fs.destination || '';
  o.dateStart   = fs.dateStart || todayISO();

  var agenda = (fs.agenda || []).slice().sort(function(a,b){
    return (a.day - b.day) || (toMin(a.time) - toMin(b.time));
  });

  var maxDay = 1;
  agenda.forEach(function(a){ if(a.day > maxDay) maxDay = a.day; });
  if(fs.dateStart && fs.dateEnd){
    var span = Math.round((new Date(fs.dateEnd) - new Date(fs.dateStart)) / 86400000) + 1;
    if(span > maxDay && span < 60) maxDay = span;
  }
  o.days = [];
  for(var d=0; d<maxDay; d++){
    o.days.push({ date: addDays(o.dateStart, d), label: 'Day ' + (d+1) });
  }

  /* Locations from planner sites */
  (fs.sites || []).forEach(function(s){
    o.locations.push({
      id: 'loc_' + s.id, name: s.name || 'Site', address: s.location || '',
      meetingPoint: '', parking: '', access: '', contact: '',
      notes: s.relevance || '', lat: s.lat || null, lng: s.lng || null,
      kind: s.type || 'site'
    });
  });

  /* Segments from agenda, with inferred end times */
  agenda.forEach(function(a, i){
    var dayIdx = Math.max(0, (a.day || 1) - 1);
    var start  = fromMin(toMin(a.time || '09:00'));
    var next   = agenda[i+1];
    var end;
    if(next && (next.day === a.day) && toMin(next.time) > toMin(a.time)){
      var gap = toMin(next.time) - toMin(a.time);
      end = fromMin(toMin(start) + Math.min(gap, 180));
    } else {
      end = fromMin(toMin(start) + 90);
    }
    var type = mapType(a.type, a.title);
    /* Match a site by fuzzy title overlap */
    var locId = null;
    o.locations.forEach(function(L){
      var key = L.name.split(/[\s&—-]+/).filter(function(w){ return w.length > 4; })[0];
      if(key && new RegExp(key, 'i').test(a.title || '')) locId = L.id;
    });
    o.segments.push({
      id: 'seg_' + (a.id || uid()), dayIdx: dayIdx, start: start, end: end,
      type: type, title: a.title || 'Untitled', speaker: a.speaker || '',
      speakerBio: '', intro: '', av: '', locationId: locId, personId: null,
      notes: a.desc || '', status: 'pending', actualStart: null, actualEnd: null,
      from: '', to: '', mode: type === 'travel' ? 'Van' : '', buffer: 0
    });
  });

  /* People: contacts tied to this field school become the oral-history roster */
  (contacts || []).forEach(function(c){
    if(c.fieldSchool && c.fieldSchool !== fs.id) return;
    var likely = /community partner|speaker|artist|elder|resident|vendor/i.test(c.role || c.type || '');
    o.people.push({
      id: 'per_' + c.id, name: c.name || 'Unnamed', role: c.role || c.type || '',
      org: c.org || '', phone: c.phone || '', email: c.email || '',
      relation: c.notes || '',
      consent: { verbal:false, written:false, media:false, archive:false },
      stage: likely ? 'Scheduled' : 'Not started',
      device: '', files: [], recSec: 0, recStartedAt: null,
      topics: [], notes: '', recordedOn: '', priority: likely
    });
  });

  return o;
}

/* Seed = the Costa Rica 2026 preliminary site visit */
function demoOps(){
  var o = JSON.parse(JSON.stringify(CR2026));
  o.createdAt = Date.now(); o.updatedAt = Date.now();

/* ---------- BOOT ---------- */
function boot(){
  ops = loadOps();
  /* A device still holding the Mississippi data: archive it (nothing is
     lost — it can be downloaded from the menu) and load the new trip. */
  if(ops && ops.schoolId === 'ms2026'){
    try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(ops)); }catch(e){ console.warn('archive failed', e); }
    ops = null;
  }
  if(!ops){
    ops = demoOps();
    saveOps();
  }
  /* Same trip, newer seed (addresses, map places): refresh places and
     block links/notes, keep everything done on the device. */
  if(ops.schoolId === CR2026.schoolId && ops.seedId !== SEED_ID){
    var seedLocIds = CR2026.locations.map(function(l){ return l.id; });
    var mine = ops.locations.filter(function(l){ return seedLocIds.indexOf(l.id) < 0 && !/^loc_/.test(l.id); });
    ops.locations = JSON.parse(JSON.stringify(CR2026.locations)).concat(mine);
    CR2026.segments.forEach(function(ss){
      var s = segById(ss.id); if(!s) return;
      s.locationId = ss.locationId; s.notes = ss.notes; s.mode = ss.mode; s.phrases = ss.phrases;
    });
    CR2026.people.forEach(function(sp){
      if(!perById(sp.id)) ops.people.push(JSON.parse(JSON.stringify(sp)));
    });
    var gotMap = {}; (ops.shots || []).forEach(function(x){ gotMap[x.id] = x; });
    var mineShots = (ops.shots || []).filter(function(x){ return !/^sh\d+$/.test(x.id); });
    ops.shots = JSON.parse(JSON.stringify(CR2026.shots || [])).map(function(x){
      if(gotMap[x.id]){ x.got = gotMap[x.id].got; x.gotAt = gotMap[x.id].gotAt; } return x; }).concat(mineShots);
    ops.seedId = SEED_ID;
    saveOps();
  }
  /* Land on today if today is one of the field school days */
  var t = todayISO();
  var idx = ops.days.findIndex(function(d){ return d.date === t; });
  activeDayIdx = idx >= 0 ? idx : 0;

  document.getElementById('fs-name').textContent = ops.schoolTitle;
  document.getElementById('fs-sub').textContent  = (ops.destination || 'Black Ecologies Lab');

  render();
  startClock();
}

function startClock(){
  function upd(){
    var d = new Date();
    document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if(view === 'now') paintNow();
    if(recTimer) paintRecTimers();
  }
  upd();
  clearInterval(tick);
  tick = setInterval(upd, 1000);
}

/* ============================================================
   SELECTORS
   ============================================================ */
function daySegs(idx){
  return ops.segments.filter(function(s){ return s.dayIdx === idx; })
    .sort(function(a,b){ return toMin(a.start) - toMin(b.start); });
}
function segById(id){ return ops.segments.find(function(s){ return s.id === id; }); }
function perById(id){ return ops.people.find(function(p){ return p.id === id; }); }
function locById(id){ return ops.locations.find(function(l){ return l.id === id; }); }

function todayIdx(){
  var t = todayISO();
  var i = ops.days.findIndex(function(d){ return d.date === t; });
  return i;
}

/* The segment happening right now, only if today is a field-school day */
function currentSeg(){
  var i = todayIdx();
  if(i < 0) return null;
  var n = nowMin();
  return daySegs(i).find(function(s){
    return toMin(s.start) <= n && n < toMin(s.end) && s.status !== 'done' && s.status !== 'skipped';
  }) || null;
}
function nextSeg(){
  var i = todayIdx();
  if(i < 0) return daySegs(activeDayIdx)[0] || null;
  var n = nowMin();
  return daySegs(i).find(function(s){
    return toMin(s.start) > n && s.status !== 'done' && s.status !== 'skipped';
  }) || null;
}
/* Running behind: an earlier segment is still open past its end time */
function overdueSeg(){
  var i = todayIdx();
  if(i < 0) return null;
  var n = nowMin();
  return daySegs(i).find(function(s){
    return toMin(s.end) <= n && s.status !== 'done' && s.status !== 'skipped';
  }) || null;
}

function logEvent(kind, text){
  ops.log.unshift({ id: uid('log'), ts: Date.now(), kind: kind, text: text });
  if(ops.log.length > 400) ops.log.length = 400;
}

/* ============================================================
   QUICK-TAP ACTIONS
   ============================================================ */
function startSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'active';
  s.actualStart = fromMin(nowMin());
  logEvent('start', 'Started "' + s.title + '" at ' + fmt12(s.actualStart));
  haptic(); saveOps(); render();
  toast('Started · ' + fmt12(s.actualStart));
}
function doneSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'done';
  s.actualEnd = fromMin(nowMin());
  if(!s.actualStart) s.actualStart = s.start;
  var planned = toMin(s.end) - toMin(s.start);
  var actual  = toMin(s.actualEnd) - toMin(s.actualStart);
  var delta   = actual - planned;
  logEvent('done', 'Completed "' + s.title + '" · ' + durStr(actual) +
    (Math.abs(delta) >= 5 ? (delta > 0 ? ' (+' + durStr(delta) + ' over)' : ' (' + durStr(-delta) + ' under)') : ' (on time)'));
  haptic(); saveOps(); render();
  toast(Math.abs(delta) < 5 ? 'Done · on time' :
    (delta > 0 ? 'Done · ' + durStr(delta) + ' over' : 'Done · ' + durStr(-delta) + ' early'));
}
function skipSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'skipped';
  logEvent('skip', 'Skipped "' + s.title + '"');
  haptic(); saveOps(); render(); toast('Marked skipped');
}
function reopenSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'pending'; s.actualStart = null; s.actualEnd = null;
  saveOps(); render(); toast('Reopened');
}
/* Push this segment and everything after it on the same day */
function pushDay(id, mins){
  var s = segById(id); if(!s) return;
  var from = toMin(s.start);
  daySegs(s.dayIdx).forEach(function(x){
    if(toMin(x.start) >= from && x.status !== 'done'){
      x.start = fromMin(toMin(x.start) + mins);
      x.end   = fromMin(toMin(x.end)   + mins);
    }
  });
  logEvent('shift', (mins > 0 ? 'Pushed ' : 'Pulled ') + Math.abs(mins) + 'm from "' + s.title + '" onward');
  haptic(); saveOps(); render();
  toast((mins > 0 ? 'Pushed +' : 'Pulled −') + Math.abs(mins) + ' min from here on');
}
