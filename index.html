<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BEL Field">
<meta name="theme-color" content="#243329">
<title>BEL Field Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --charcoal:#243329; --panel-bg:#2E3F34; --panel-mid:#384B3E; --panel-lite:#435948;
  --border:#4F6855; --clay:#A85A2E; --clay-lite:#C26E3D; --ochre:#BF7435; --ochre-lite:#D48C4A;
  --cream:#EFE9DC; --cream-dim:#D5CEBD; --cream-muted:#9E9282; --white:#F8F3EA;
  --danger:#c04040; --info:#4a7ea8; --good:#5b8f5f;
  --r:10px; --r-lg:16px;
  --serif:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Karla,Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tabbar-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;}
body{
  background:var(--charcoal); color:var(--cream); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--cream);background:var(--panel-bg);
  border:1px solid var(--border);border-radius:var(--r);padding:12px;width:100%;}
input:focus,select,textarea:focus{outline:2px solid var(--ochre);outline-offset:-1px;}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em;}

/* ---------- APP SHELL ---------- */
#app{display:flex;flex-direction:column;height:100dvh;}
#topbar{
  flex:0 0 auto;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:linear-gradient(180deg,#1d2a21,var(--charcoal));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;position:relative;z-index:20;
}
#topbar .brand{font-family:var(--serif);font-size:1.15rem;color:var(--white);line-height:1.1;flex:1;min-width:0;}
#topbar .brand small{display:block;font-family:var(--sans);font-size:.66rem;color:var(--cream-muted);
  letter-spacing:.12em;text-transform:uppercase;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#clock{font-variant-numeric:tabular-nums;font-size:1.35rem;color:var(--ochre-lite);font-weight:600;letter-spacing:-.01em;}
.icon-btn{width:42px;height:42px;border-radius:var(--r);display:grid;place-items:center;
  background:var(--panel-bg);border:1px solid var(--border);font-size:1.1rem;flex:0 0 auto;}
.icon-btn:active{background:var(--panel-lite);}

#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--tabbar-h) + var(--safe-b) + 24px);}

#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(29,42,33,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
}
.tabbtn{height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--cream-muted);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;}
.tabbtn .ic{font-size:1.3rem;line-height:1;}
.tabbtn.active{color:var(--ochre-lite);}
.tabbtn.active .ic{transform:translateY(-1px);}
.tabbtn .dot{position:absolute;margin:-22px 0 0 22px;width:7px;height:7px;border-radius:50%;background:var(--clay-lite);}

/* ---------- CARDS ---------- */
.card{background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:12px;}
.card.tight{padding:13px 14px;}
.sec-label{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-muted);
  margin:22px 2px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sec-label:first-child{margin-top:4px;}
.muted{color:var(--cream-muted);}
.dim{color:var(--cream-dim);}
.sm{font-size:.82rem;}
.xs{font-size:.72rem;}
.row{display:flex;align-items:center;gap:10px;}
.row.wrap{flex-wrap:wrap;}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.grow{flex:1;min-width:0;}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- NOW CARD ---------- */
#nowcard{background:linear-gradient(155deg,#3b4f40,#2b3a30 55%,#26332a);
  border:1px solid var(--ochre);border-radius:var(--r-lg);padding:20px 18px;position:relative;overflow:hidden;}
#nowcard::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--ochre);}
#nowcard.late{border-color:var(--clay-lite);}
#nowcard.late::before{background:var(--clay-lite);}
#nowcard.idle{border-color:var(--border);}
#nowcard.idle::before{background:var(--border);}
.now-kicker{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ochre-lite);
  display:flex;align-items:center;gap:7px;}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ochre-lite);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.now-title{font-family:var(--serif);font-size:1.75rem;line-height:1.15;color:var(--white);margin:9px 0 6px;}
.now-meta{font-size:.87rem;color:var(--cream-dim);}
.now-time{font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--cream);margin-top:10px;}
.countdown{font-variant-numeric:tabular-nums;font-size:2.5rem;font-weight:300;color:var(--ochre-lite);
  letter-spacing:-.02em;line-height:1;margin-top:12px;}
.countdown.over{color:var(--clay-lite);}
.countdown small{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-muted);
  display:block;font-weight:400;margin-top:6px;}
#progressbar{height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden;margin-top:14px;}
#progressbar i{display:block;height:100%;background:var(--ochre);transition:width .5s;}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 16px;
  border-radius:var(--r);background:var(--panel-mid);border:1px solid var(--border);color:var(--cream);
  font-size:.9rem;font-weight:500;transition:.12s;}
.btn:active{transform:scale(.975);background:var(--panel-lite);}
.btn.primary{background:var(--clay);border-color:var(--clay-lite);color:var(--white);}
.btn.ochre{background:var(--ochre);border-color:var(--ochre-lite);color:#231a10;font-weight:600;}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent;border-color:var(--danger);color:#e08a8a;}
.btn.good{background:var(--good);border-color:#6fa873;color:var(--white);}
.btn.full{width:100%;}
.btn.sm{min-height:44px;padding:0 13px;font-size:.8rem;}
.btn.on{background:var(--good);border-color:#6fa873;color:var(--white);}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;}
.btnrow.three{grid-template-columns:1fr 1fr 1fr;}

/* ---------- TIMELINE ---------- */
.tl{position:relative;padding-left:20px;}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tlitem{position:relative;margin-bottom:10px;}
.tlitem::before{content:'';position:absolute;left:-19px;top:20px;width:12px;height:12px;border-radius:50%;
  background:var(--panel-bg);border:2px solid var(--border);}
.tlitem.done::before{background:var(--good);border-color:var(--good);}
.tlitem.now::before{background:var(--ochre);border-color:var(--ochre);box-shadow:0 0 0 5px rgba(191,116,53,.22);}
.tlitem.done .card{opacity:.55;}
.tlitem.now .card{border-color:var(--ochre);background:var(--panel-mid);}
.timecol{font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--ochre-lite);font-weight:600;
  min-width:58px;flex:0 0 auto;}
.timecol small{display:block;font-size:.66rem;color:var(--cream-muted);font-weight:400;}
.seg-title{font-family:var(--serif);font-size:1.2rem;color:var(--white);line-height:1.2;}
.done .seg-title{text-decoration:line-through;text-decoration-color:var(--cream-muted);}

/* ---------- CHIPS / PILLS ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border);
  background:var(--panel-mid);color:var(--cream-dim);white-space:nowrap;}
.chip.speaking{background:rgba(191,116,53,.2);border-color:var(--ochre);color:var(--ochre-lite);}
.chip.travel{background:rgba(74,126,168,.18);border-color:#4a7ea8;color:#8bb8d8;}
.chip.interview{background:rgba(168,90,46,.22);border-color:var(--clay-lite);color:#e0a077;}
.chip.site{background:rgba(91,143,95,.2);border-color:var(--good);color:#96c79a;}
.chip.meal{background:rgba(213,206,189,.1);color:var(--cream-dim);}
.chip.free{background:transparent;}
.chip.ok{background:rgba(91,143,95,.22);border-color:var(--good);color:#9fd0a3;}
.chip.warn{background:rgba(191,116,53,.2);border-color:var(--ochre);color:var(--ochre-lite);}
.chip.bad{background:rgba(192,64,64,.18);border-color:var(--danger);color:#e69a9a;}

/* ---------- SEGMENTED CONTROL ---------- */
.segctl{display:flex;background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--r);
  padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.segctl button{flex:1 0 auto;min-height:46px;padding:0 14px;border-radius:7px;font-size:.82rem;
  color:var(--cream-muted);white-space:nowrap;}
.segctl button.active{background:var(--panel-lite);color:var(--white);font-weight:600;}

/* ---------- CONSENT GRID ---------- */
.consent{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.ctog{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:var(--r);
  background:var(--panel-mid);border:1px solid var(--border);font-size:.78rem;text-align:left;line-height:1.2;}
.ctog .box{width:20px;height:20px;flex:0 0 auto;border-radius:5px;border:2px solid var(--cream-muted);
  display:grid;place-items:center;font-size:.75rem;color:transparent;}
.ctog.on{background:rgba(91,143,95,.2);border-color:var(--good);color:var(--white);}
.ctog.on .box{background:var(--good);border-color:var(--good);color:var(--white);}

/* ---------- RECORDER ---------- */
.rec{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);
  background:var(--moss,#1F1812);border:1px solid var(--border);margin-top:12px;}
.rec.live{border-color:var(--danger);background:rgba(192,64,64,.12);}
.rec .rt{font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:300;letter-spacing:-.02em;flex:1;}
.rec.live .rt{color:#ef9d9d;}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--cream-muted);}
.rec.live .recdot{background:var(--danger);animation:pulse 1.2s infinite;}

/* ---------- MISC ---------- */
.divider{height:1px;background:var(--border);margin:14px -16px;}
.kv{display:flex;gap:10px;font-size:.85rem;padding:7px 0;border-bottom:1px solid rgba(79,104,85,.4);
  width:100%;text-align:left;line-height:1.45;}
.kv:last-child{border-bottom:0;}
.kv b{flex:0 0 92px;font-weight:500;color:var(--cream-muted);font-size:.75rem;
  letter-spacing:.06em;text-transform:uppercase;padding-top:2px;}

/* ---------- TAPPABILITY ----------
   Anything that opens something else gets the same affordance:
   a chevron, an ochre value, and a visible press state. If it
   looks like this, it does something when you touch it. */
.kv.tap{min-height:46px;align-items:center;padding:9px 0;}
.kv.tap .grow{color:var(--ochre-lite);}
.kv.tap::after{content:'›';color:var(--cream-muted);font-size:1.3rem;line-height:1;
  flex:0 0 auto;padding-left:4px;}
.kv.tap:active{background:var(--panel-lite);border-radius:6px;
  box-shadow:0 0 0 8px var(--panel-lite);}
.card.tap:active,.tlitem .card:active,.q:active{background:var(--panel-lite);}
.card.tap{position:relative;}
.chip.tap:active{background:var(--panel-lite);}
.tapnote{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-muted);
  display:flex;align-items:center;gap:5px;margin-top:2px;}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.linkrow .btn{flex:1 1 auto;min-width:132px;}
.empty{text-align:center;padding:48px 20px;color:var(--cream-muted);}
.empty .big{font-size:2.6rem;opacity:.5;margin-bottom:10px;}
a.link{color:var(--ochre-lite);text-decoration:none;border-bottom:1px solid rgba(212,140,74,.4);}
.notefield{min-height:76px;resize:vertical;margin-top:10px;font-size:15px;}

/* ---------- QUESTION GUIDE ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:14px -16px 0;padding:12px 16px 10px;border-top:1px solid var(--border);}
.qhead .lbl{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-muted);}
.qcount{font-variant-numeric:tabular-nums;font-size:.72rem;color:var(--ochre-lite);white-space:nowrap;}
.qcount.done{color:#9fd0a3;}
.qwrap{display:flex;flex-direction:column;gap:8px;}
.q{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:13px 14px;border-radius:var(--r);background:var(--panel-mid);
  border:1px solid var(--border);border-left:3px solid var(--ochre);line-height:1.45;}
.q:active{background:var(--panel-lite);}
.q .qbox{width:22px;height:22px;flex:0 0 auto;margin-top:1px;border-radius:6px;
  border:2px solid var(--cream-muted);display:grid;place-items:center;font-size:.8rem;color:transparent;}
.q .qlabel{display:block;font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ochre-lite);margin-bottom:5px;}
.q .qtext{display:block;font-size:.95rem;color:var(--white);}
.q.asked{border-left-color:var(--good);background:var(--panel-bg);}
.q.asked .qbox{background:var(--good);border-color:var(--good);color:var(--white);}
.q.asked .qtext{color:var(--cream-muted);}
.q.asked .qlabel{color:var(--cream-muted);}
.qsub{margin:8px 0 0 33px;padding-left:12px;border-left:1px solid var(--border);
  display:flex;flex-direction:column;gap:7px;}
.qsub div{font-size:.85rem;color:var(--cream-dim);line-height:1.4;}
.qsub div::before{content:'↳ ';color:var(--cream-muted);}
.qfocus{font-size:.85rem;color:var(--ochre-lite);margin-top:9px;line-height:1.4;}
.qnone{font-size:.85rem;color:#e0a077;padding:12px 14px;border-radius:var(--r);
  background:rgba(168,90,46,.14);border:1px solid var(--clay-lite);line-height:1.45;}
.qsrc{font-size:.72rem;color:var(--cream-muted);line-height:1.5;padding:11px 13px;
  background:var(--panel-mid);border-radius:var(--r);margin-bottom:12px;}
.qgroup{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre-lite);
  margin:18px 0 8px;}

/* ---------- SHEET (modal) ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,16,12,.72);z-index:40;opacity:0;pointer-events:none;
  transition:.22s;backdrop-filter:blur(3px);}
#scrim.open{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel-bg);
  border-top:1px solid var(--ochre);border-radius:20px 20px 0 0;
  max-height:88dvh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding:8px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch;}
#sheet.open{transform:translateY(0);}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 14px;}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-16px);z-index:60;
  bottom:calc(var(--tabbar-h) + var(--safe-b) + 16px);background:var(--panel-lite);
  border:1px solid var(--ochre);color:var(--white);padding:12px 20px;border-radius:99px;
  font-size:.86rem;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 26px rgba(0,0,0,.5);
  max-width:88vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- TABLET / LANDSCAPE ---------- */
@media (min-width:760px){
  #main{padding:20px 24px calc(var(--tabbar-h) + var(--safe-b) + 28px);max-width:1100px;margin:0 auto;width:100%;}
  .now-title{font-size:2.2rem;}
  .countdown{font-size:3.2rem;}
  .consent{grid-template-columns:repeat(4,1fr);}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .cols2 .card{margin-bottom:0;}
  #tabbar{grid-template-columns:repeat(5,minmax(0,190px));justify-content:center;}
}
@media print{#tabbar,#topbar{display:none;}body{background:#fff;color:#000;}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="icon-btn" onclick="openMenu()" aria-label="Menu">☰</button>
    <div class="brand"><span id="fs-name">Field Companion</span><small id="fs-sub">Black Ecologies Lab</small></div>
    <div id="clock">--:--</div>
  </header>
  <main id="main"></main>
  <nav id="tabbar">
    <button class="tabbtn active" data-view="now"   onclick="go('now')"><span class="ic">◉</span>Now</button>
    <button class="tabbtn" data-view="day"   onclick="go('day')"><span class="ic">≡</span>Day</button>
    <button class="tabbtn" data-view="show"  onclick="go('show')"><span class="ic">◈</span>Run</button>
    <button class="tabbtn" data-view="oral"  onclick="go('oral')"><span class="ic">◍</span>Oral</button>
    <button class="tabbtn" data-view="place" onclick="go('place')"><span class="ic">⌖</span>Places</button>
  </nav>
</div>
<div id="scrim" onclick="closeSheet()"></div>
<div id="sheet"><div class="grabber"></div><div id="sheet-body"></div></div>
<div id="toast"></div>
<script>

ation":"Horticulturist, herbalist and artist from the 7th Ward of New Orleans. Third-generation grower specializing in Afro-Indigenous ethnobotany. Founder of TruCulture Farm, spanning New Orleans and Hattiesburg.","consent":{"verbal":false,"written":false,"media":false,"archive":false},"stage":"Scheduled","device":"","files":[],"recSec":0,"recStartedAt":null,"topics":["Afro-Indigenous ethnobotany","Third-generation growing","7th Ward to Hattiesburg","Land in Black hands","Culture sharing against racial capitalism"],"notes":"SCHEDULED INTERVIEW — Mon 8/17, 1:30 PM, 75 minutes, at TruCulture Farm. The only interview in the itinerary with a stated duration. Outdoor farm setting: wind screen essential, watch for tractor and livestock noise. Bailey is also a lead driver on Sun 8/16 — do not schedule anything that collides with the New Orleans run.  ⚠ SPELLING: the itinerary says \"Hutchison\", the interview guide says \"Hutchinson\". Confirm which is correct before anything is captioned or archived.","recordedOn":"","priority":true,"focus":"Afro-Indigenous Agriculture, Land Vision & Fannie Lou Hamer","guideTitle":"Director of TruCulture Farm","questions":[{"id":"per_bailey_q1","label":"Ancestral Grounding","text":"What is your earliest sensory memory of the dirt, plants, or outdoors in Mississippi — a scent, a taste, or a texture — that told you land was a place of safety or belonging?","asked":false},{"id":"per_bailey_q2","label":"On Afro-Indigenous Practices","text":"Please tell us the story of how you came to steward this land. How do Afro-Indigenous agricultural practices shape the way you tend, harvest, and listen to the soil at TruCulture Farm? How does your role as a healer impact your approach to growing food and feeding people?","asked":false},{"id":"per_bailey_q3","label":"On Fannie Lou Hamer’s Spirit","text":"Mrs. Fannie Lou Hamer famously taught us that \"if you have a pig in your backyard, if you have some vegetables in your garden... nobody can push you around.\" And to fight for reproductive justice. How does the memory of Mrs. Hamer inform your daily practices here at TruCulture?","asked":false},{"id":"per_bailey_q4","label":"On Environmental Shifts","text":"Have you noticed changes in the climate, soil, or growing seasons in your time on the land? How are you adapting your agricultural practices to these shifts?","asked":false},{"id":"per_bailey_q5","label":"On the Vision for TruCulture Farm","text":"Looking toward the future, what is your boldest vision for TruCulture Farm as a living sanctuary, learning hub, and space for Afro-Indigenous agricultural reclamation in Hattiesburg and New Orleans? And how will TruCulture work continue to be a bridge between NOLA and Hattiesburg?","asked":false}]},{"id":"per_vickie","name":"Vickie Roberts-Ratliff","role":"Land advocate · Interview","org":"Land, Literacy and Legacy","phone":"","email":"","relation":"Co-Founder of Land Literacy & Legacy. Sixth-generation Mississippi landowner and agroforestry advocate who led the campaign for Fannie Lou Hamer’s state historical marker.","consent":{"verbal":false,"written":false,"media":false,"archive":false},"stage":"Scheduled","device":"","files":[],"recSec":0,"recStartedAt":null,"topics":["Six generations of land ownership","Agroforestry","The Fannie Lou Hamer marker campaign","Heirs’ property","Winona and Hamer’s 1963 arrest"],"notes":"SCHEDULED INTERVIEW — Thu 8/20, 10:00 AM, at the Winona historical marker. Outdoor and roadside: traffic noise plus full morning sun. Bring shade and a windscreen; consider recording in the van or a nearby interior if the marker audio is unusable.","recordedOn":"","priority":true,"focus":"Black Family Land Retention, Winona Marker & Fannie Lou Hamer","guideTitle":"Director of Land Literacy & Legacy","questions":[{"id":"per_vickie_q1","label":"Ancestral Grounding","text":"As a sixth-generation landowner, what does it feel like in your body to walk the very same acres of land that your family fought to keep despite the systemic loss of land that Black people face?","asked":false},{"id":"per_vickie_q2","label":"On the Winona Marker","text":"You spearheaded the historic campaign to erect the official Mississippi State Historical Marker at the Montgomery County Jail site in Winona, where Mrs. Fannie Lou Hamer, June Johnson, Euvester Simpson, and fellow activists were brutally beaten in 1963. What was the spiritual and personal journey of bringing that historical memory back to the land?","asked":false},{"id":"per_vickie_q3","label":"On Land Literacy","text":"What are the most critical steps, tools, and strategies for Black families looking to protect, hold, and pass down ancestral land across generations?","asked":false},{"id":"per_vickie_q4","label":"On Visions for Black Land","text":"What is your vision for the future of Black family land retention and timber stewardship in Mississippi over the next fifty years?","asked":false,"sub":["Can you talk about your visions of civil rights memorialization on your own land and why you feel it’s important?","How do you keep Fannie Lou Hamer alive in the work you do in Winona?"]}]},{"id":"per_annette","name":"Annette Hollowell","role":"Landowner & host · Land story interview","org":"Foxfire Ranch","phone":"","email":"","relation":"Steward of Foxfire Ranch, an 80-acre Black-owned farm and cultural sanctuary in Waterford held by the Hollowell family for over a century. A haven for healing, storytelling and Hill Country Blues traditions.","consent":{"verbal":false,"written":false,"media":false,"archive":false},"stage":"Scheduled","device":"","files":[],"recSec":0,"recStartedAt":null,"topics":["A century of family landholding","Foxfire as sanctuary","Hill Country Blues lineage","Healing and gathering space","Keeping Black land in Black hands"],"notes":"SCHEDULED INTERVIEW — Thu 8/20, 5:00 PM, at Foxfire Ranch, paired with dinner and Day 5 field notes. Golden hour is the visual opportunity of the whole week; dinner service is the audio risk. Consider recording before the meal rather than during.","recordedOn":"","priority":true,"focus":"Black Land Ownership, Hill Country Blues, Culinary Legacy & Cultural Sanctuary","guideTitle":"Manager & Steward of Foxfire Ranch","questions":[{"id":"per_annette_q1","label":"Ancestral Grounding","text":"Foxfire Ranch has been in your family for over a century. Who is the ancestor or family member you feel most strongly beside you when you host people on this 80-acre sanctuary?","asked":false},{"id":"per_annette_q2","label":"On Creating Cultural Sanctuary","text":"Foxfire Ranch is famous for preserving Hill Country Blues and providing a haven for rest and healing. How do culture, food, music, and Black land ownership intersect here?","asked":false},{"id":"per_annette_q3","label":"On Family Legacy & Stewardship","text":"What did it take for your family to hold onto this land through changing political and economic eras, and how has its purpose evolved under your care?","asked":false},{"id":"per_annette_q4","label":"On the Horizon","text":"What is your vision for Foxfire Ranch over the next century as a place for Black land stewards, storytellers, and community gatherings?","asked":false}]},{"id":"per_romona","name":"Romona Taylor Williams","role":"Organizer · Coffee chat","org":"MCUP (Mississippi Communities United for Prosperity)","phone":"","email":"","relation":"Co-Founder and CEO of MCUP. Thirty years in community development and environmental justice, and architect of the nationally recognized ASEEDS model.","consent":{"verbal":false,"written":false,"media":false,"archive":false},"stage":"Scheduled","device":"","files":[],"recSec":0,"recStartedAt":null,"topics":["Thirty years of EJ organizing","The ASEEDS model","Mayersville and the flood memorial","Environmental racism and structural accountability","Community development in the Delta"],"notes":"TIME NOT STATED in the itinerary — provisionally 1:00–2:00 PM Tue 8/18 at Coffee & Prose. Also co-leads the 3:00 PM Mayersville flood memorial dialogue, which is the richer recording opportunity of the two. Café audio will be difficult; the Mayersville site is outdoors but quieter.","recordedOn":"","priority":true,"focus":"Environmental Justice, Climate Resistance & Data Centers","guideTitle":"CEO of MCUP & ASEEDS Project Lead","questions":[{"id":"per_romona_q1","label":"Ancestral Grounding","text":"When you close your eyes and think about your lineage in Mississippi, what is a specific lesson, prayer, or piece of advice from an ancestor or elder that keeps you grounded when fighting for your community?","asked":false},{"id":"per_romona_q2","label":"On Frontline Defense","text":"You have spent decades fighting environmental racism and advocating for green/grey infrastructure. How do you see the current surge of resource-extractive industries — such as energy-and-water-guzzling data centers — threatening Mississippi’s Black and rural communities?","asked":false},{"id":"per_romona_q3","label":"On Data & Resource Exploitation","text":"Tech infrastructure demands massive amounts of local water and power. How is MCUP organizing frontline communities to resist this environmental exploitation while building equitable community policy?","asked":false},{"id":"per_romona_q4","label":"On Visions for Black Futures","text":"Looking ahead, what is your ultimate vision for Mississippi’s frontline communities at the intersections of race and environmental justice?","asked":false}]},{"id":"per_rhondalyn","name":"Rhondalyn Peairs","role":"Public historian","org":"Historich","phone":"","email":"","relation":"Public historian and founder of Historich, an educational services and tourism company in Oxford. A fifth-generation Mississippian working as educator, documentarian and cultural entrepreneur.","consent":{"verbal":false,"written":false,"media":false,"archive":false},"stage":"Not started","device":"","files":[],"recSec":0,"recStartedAt":null,"topics":["Fifth-generation Mississippi","Public history practice","Who gets to tell Mississippi’s story","Documentary methods","Delta and Hill Country connections"],"notes":"Present twice: Tue 8/18 grounding circle at Crossroads, and Wed 8/19 evening conversation at Foxfire. She is a documentarian herself — worth a conversation about method and about how she wants this recorded, not just a subject interview.","recordedOn":"","priority":false,"focus":"Black History, Oral History & Heritage Preservation","guideTitle":"Director of Historich","questions":[{"id":"per_rhondalyn_q1","label":"Ancestral Grounding","text":"Who was the first storyteller or historian in your own family or community — official or unofficial — who taught you that Black life in Mississippi was sacred and worth preserving?","asked":false},{"id":"per_rhondalyn_q2","label":"On Preserving Unwritten History","text":"How do you approach the work of preserving Black history and heritage in places where official markers or archives have historically ignored or erased Black life?","asked":false},{"id":"per_rhondalyn_q3","label":"On Storytelling as Resistance","text":"In what ways do local oral histories and landscape stories challenge the prevailing national narratives about Mississippi being defined only by its trauma?","asked":false},{"id":"per_rhondalyn_q4","label":"On Passing the Torch","text":"How can heritage preservation be used as an active tool to empower young Mississippians to claim their home and shape its future?","asked":false}]},{"id":"per_chandra","name":"Chandra Williams","role":"Arts director","org":"Crossroads Cultural Arts Center","phone":"","email":"","relation":"Artist, educator and Executive Director of Crossroads Cultural Arts Center in Clarksdale. The center treats Blues as a living African cultural practice and provides space to reclaim Black cultural identity amid inequity and appropriation.","consent":{"verbal":false,"written":false,"media":false,"archive":false},"stage":"Not started","device":"","files":[],"recSec":0,"recSt /* ---------- TIME HELPERS ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function toMin(hhmm){
  if(!hhmm) return 0;
  var m = String(hhmm).match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
  if(!m) return 0;
  var h = +m[1], mm = +m[2];
  if(m[3]){ var ap = m[3].toLowerCase(); if(ap==='pm' && h<12) h+=12; if(ap==='am' && h===12) h=0; }
  return h*60 + mm;
}
function fromMin(min){
  min = ((Math.round(min)%1440)+1440)%1440;
  return pad(Math.floor(min/60)) + ':' + pad(min%60);
}
function fmt12(hhmm){
  var t = toMin(hhmm), h = Math.floor(t/60), m = t%60;
  var ap = h>=12 ? 'PM' : 'AM'; var hh = h%12; if(hh===0) hh=12;
  return hh + ':' + pad(m) + ' ' + ap;
}
function nowMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(iso, n){
  var p = String(iso||todayISO()).split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function prettyDate(iso){
  if(!iso) return '';
  var p = String(iso).split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function durStr(mins){
  mins = Math.max(0, Math.round(mins));
  var h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+'h '+m+'m';
  if(h) return h+'h';
  return m+'m';
}
function clockStr(sec){
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h? h+':' : '') + (h? pad(m) : m) + ':' + pad(s);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- TAP HELPERS ----------
   kv()    static row, no action
   kvTap() row that opens something — chevron + press state
   navHref() the maps handoff, shared by every place in the app */
function kv(label, value){
  if(!value) return '';
  return '<div class="kv"><b>' + esc(label) + '</b><span class="grow">' + value + '</span></div>';
}
function kvTap(label, value, action){
  if(!value) return '';
  return '<button class="kv tap" onclick="' + action + '"><b>' + esc(label) + '</b>' +
    '<span class="grow">' + value + '</span></button>';
}
function navHref(L){
  if(!L) return '';
  var q = encodeURIComponent(L.address || L.name);
  return (L.lat && L.lng) ? ('geo:' + L.lat + ',' + L.lng + '?q=' + q)
                          : ('https://maps.apple.com/?q=' + q);
}
function navTo(locId){
  var L = locById(locId); if(!L) return;
  try{ window.open(navHref(L), '_blank'); }
  catch(e){ toast('Could not open Maps'); }
}
function telHref(phone){ return 'tel:' + String(phone||'').replace(/[^\d+]/g,''); }
