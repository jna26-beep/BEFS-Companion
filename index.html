  return '<div class="kv"><b>' + esc(label) + '</b><span class="grow">' + value + '</span></div>';
}
function kvTap(label, value, action){
  if(!value) return '';
  return '<button class="kv tap" onclick="' + action + '"><b>' + esc(label) + '</b>' +
    '<span class="grow">' + value + '</span></button>';
}
function navHref(L){
  if(!L) return '';
  var q = encodeURIComponent(L.address || L.name);
  return (L.lat && L.lng) ? ('geo:' + L.lat + ',' + L.lng + '?q=' + q)
                          : ('https://maps.apple.com/?q=' + q);
}
function navTo(locId){
  var L = locById(locId); if(!L) return;
  try{ window.open(navHref(L), '_blank'); }
  catch(e){ toast('Could not open Maps'); }
}
function telHref(phone){ return 'tel:' + String(phone||'').replace(/[^\d+]/g,''); }

function openSheet(html){
  document.getElementById('sheet-body').innerHTML = html;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}

/* ============================================================
   DATA MODEL
   ------------------------------------------------------------
   ops = {
     schoolId, schoolTitle, destination, dateStart, days:[{date,label}],
     segments:[ {id,dayIdx,start,end,type,title,speaker,speakerBio,intro,
                 av,locationId,personId,notes,status,actualStart,actualEnd,
                 from,to,mode,buffer} ],
     people:[ {id,name,role,org,phone,email,relation,
               consent:{verbal,written,media,archive},
               stage, device, files, recSec, recStartedAt, topics, notes, recordedOn} ],
     locations:[ {id,name,address,meetingPoint,parking,access,contact,notes,lat,lng} ],
     log:[ {id,ts,kind,text} ]
   }
   ============================================================ */

function blankOps(){
  return {
    version: 1,
    schoolId: null,
    schoolTitle: 'Untitled Field School',
    destination: '',
    dateStart: todayISO(),
    days: [{ date: todayISO(), label: 'Day 1' }],
    segments: [], people: [], locations: [], log: [],
    createdAt: Date.now(), updatedAt: Date.now()
  };
}

/* Map a planner agenda item's type onto a field segment type */
function mapType(t, title){
  t = String(t||'').toLowerCase();
  var s = String(title||'').toLowerCase();
  if(t==='travel' || /depart|arriv|drive|transfer|airport|shuttle|van/.test(s)) return 'travel';
  if(/oral history|interview/.test(s)) return 'interview';
  if(t==='site-visit' || t==='site') return 'site';
  if(/lunch|dinner|breakfast|meal|break/.test(s)) return 'meal';
  if(t==='lecture' || t==='workshop' || t==='community' || t==='panel') return 'speaking';
  return 'speaking';
}

/* Build a field-ops record from a planner field school */
function importFromPlanner(fs, contacts){
  var o = blankOps();
  o.schoolId    = fs.id;
  o.schoolTitle = fs.title || 'Field School';
  o.destination = fs.destination || '';
  o.dateStart   = fs.dateStart || todayISO();

  var agenda = (fs.agenda || []).slice().sort(function(a,b){
    return (a.day - b.day) || (toMin(a.time) - toMin(b.time));
  });

  var maxDay = 1;
  agenda.forEach(function(a){ if(a.day > maxDay) maxDay = a.day; });
  if(fs.dateStart && fs.dateEnd){
    var span = Math.round((new Date(fs.dateEnd) - new Date(fs.dateStart)) / 86400000) + 1;
    if(span > maxDay && span < 60) maxDay = span;
  }
  o.days = [];
  for(var d=0; d<maxDay; d++){
    o.days.push({ date: addDays(o.dateStart, d), label: 'Day ' + (d+1) });
  }

  /* Locations from planner sites */
  (fs.sites || []).forEach(function(s){
    o.locations.push({
      id: 'loc_' + s.id, name: s.name || 'Site', address: s.location || '',
      meetingPoint: '', parking: '', access: '', contact: '',
      notes: s.relevance || '', lat: s.lat || null, lng: s.lng || null,
      kind: s.type || 'site'
    });
  });

  /* Segments from agenda, with inferred end times */
  agenda.forEach(function(a, i){
    var dayIdx = Math.max(0, (a.day || 1) - 1);
    var start  = fromMin(toMin(a.time || '09:00'));
    var next   = agenda[i+1];
    var end;
    if(next && (next.day === a.day) && toMin(next.time) > toMin(a.time)){
      var gap = toMin(next.time) - toMin(a.time);
      end = fromMin(toMin(start) + Math.min(gap, 180));
    } else {
      end = fromMin(toMin(start) + 90);
    }
    var type = mapType(a.type, a.title);
    /* Match a site by fuzzy title overlap */
    var locId = null;
    o.locations.forEach(function(L){
      var key = L.name.split(/[\s&—-]+/).filter(function(w){ return w.length > 4; })[0];
      if(key && new RegExp(key, 'i').test(a.title || '')) locId = L.id;
    });
    o.segments.push({
      id: 'seg_' + (a.id || uid()), dayIdx: dayIdx, start: start, end: end,
      type: type, title: a.title || 'Untitled', speaker: a.speaker || '',
      speakerBio: '', intro: '', av: '', locationId: locId, personId: null,
      notes: a.desc || '', status: 'pending', actualStart: null, actualEnd: null,
      from: '', to: '', mode: type === 'travel' ? 'Van' : '', buffer: 0
    });
  });

  /* People: contacts tied to this field school become the oral-history roster */
  (contacts || []).forEach(function(c){
    if(c.fieldSchool && c.fieldSchool !== fs.id) return;
    var likely = /community partner|speaker|artist|elder|resident|vendor/i.test(c.role || c.type || '');
    o.people.push({
      id: 'per_' + c.id, name: c.name || 'Unnamed', role: c.role || c.type || '',
      org: c.org || '', phone: c.phone || '', email: c.email || '',
      relation: c.notes || '',
      consent: { verbal:false, written:false, media:false, archive:false },
      stage: likely ? 'Scheduled' : 'Not started',
      device: '', files: [], recSec: 0, recStartedAt: null,
      topics: [], notes: '', recordedOn: '', priority: likely
    });
  });

  return o;
}

/* Seed = the Costa Rica 2026 preliminary site visit */
function demoOps(){
  var o = JSON.parse(JSON.stringify(CR2026));
  o.createdAt = Date.now(); o.updatedAt = Date.now();
  return o;
}

/* ---------- BOOT ---------- */
function boot(){
  ops = loadOps();
  /* A device still holding the Mississippi data: archive it (nothing is
     lost — it can be downloaded from the menu) and load the new trip. */
  if(ops && ops.schoolId === 'ms2026'){
    try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(ops)); }catch(e){ console.warn('archive failed', e); }
    ops = null;
  }
  if(!ops){
    ops = demoOps();
    saveOps();
  }
  /* Same trip, newer seed (addresses, map places): refresh places and
     block links/notes, keep everything done on the device. */
  if(ops.schoolId === CR2026.schoolId && ops.seedId !== SEED_ID){
    if(ops.planId !== CR2026.planId){
      /* The day plan itself changed (new flights): take the new days and blocks,
         keep any blocks added on this device. */
      var mineSegs = ops.segments.filter(function(s){ return !/^c\d+$/.test(s.id); });
      ops.days = JSON.parse(JSON.stringify(CR2026.days));
      ops.dateStart = CR2026.dateStart; ops.destination = CR2026.destination;
      ops.segments = JSON.parse(JSON.stringify(CR2026.segments)).concat(mineSegs.filter(function(s){ return s.dayIdx < ops.days.length; }));
      ops.planId = CR2026.planId;
      logEvent('edit', 'Schedule updated for the new flights (Oct 12–17)');
    }
    var seedLocIds = CR2026.locations.map(function(l){ return l.id; });
    var mine = ops.locations.filter(function(l){ return seedLocIds.indexOf(l.id) < 0 && !/^loc_/.test(l.id); });
    ops.locations = JSON.parse(JSON.stringify(CR2026.locations)).concat(mine);
    CR2026.segments.forEach(function(ss){
      var s = segById(ss.id); if(!s) return;
      s.locationId = ss.locationId; s.notes = ss.notes; s.mode = ss.mode; s.phrases = ss.phrases;
    });
    CR2026.people.forEach(function(sp){
      var ex = perById(sp.id);
      if(!ex) ops.people.push(JSON.parse(JSON.stringify(sp)));
      else ['name','role','org','relation','notes','topics'].forEach(function(k){ ex[k] = JSON.parse(JSON.stringify(sp[k])); });
    });
    var gotMap = {}; (ops.shots || []).forEach(function(x){ gotMap[x.id] = x; });
    var mineShots = (ops.shots || []).filter(function(x){ return !/^sh\d+$/.test(x.id); });
    ops.shots = JSON.parse(JSON.stringify(CR2026.shots || [])).map(function(x){
      if(gotMap[x.id]){ x.got = gotMap[x.id].got; x.gotAt = gotMap[x.id].gotAt; } return x; }).concat(mineShots);
    ops.seedId = SEED_ID;
    saveOps();
  }
  /* Land on today if today is one of the field school days */
  var t = todayISO();
  var idx = ops.days.findIndex(function(d){ return d.date === t; });
  activeDayIdx = idx >= 0 ? idx : 0;

  document.getElementById('fs-name').textContent = ops.schoolTitle;
  document.getElementById('fs-sub').textContent  = (ops.destination || 'Black Ecologies Lab');
  var ti = ops.days.findIndex(function(d){ return d.date === todayISO(); });
  activeDayIdx = ti >= 0 ? ti : 0;

  renderPluginTabs();
  render();
  startClock();
}

function startClock(){
  function upd(){
    var d = new Date();
    document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if(view === 'now') paintNow();
    if(recTimer) paintRecTimers();
  }
  upd();
  clearInterval(tick);
  tick = setInterval(upd, 1000);
}

/* ============================================================
   SELECTORS
   ============================================================ */
function daySegs(idx){
  return ops.segments.filter(function(s){ return s.dayIdx === idx; })
    .sort(function(a,b){ return toMin(a.start) - toMin(b.start); });
}
function segById(id){ return ops.segments.find(function(s){ return s.id === id; }); }
function perById(id){ return ops.people.find(function(p){ return p.id === id; }); }
function locById(id){ return ops.locations.find(function(l){ return l.id === id; }); }

function todayIdx(){
  var t = todayISO();
  var i = ops.days.findIndex(function(d){ return d.date === t; });
  return i;
}

/* The segment happening right now, only if today is a field-school day */
function currentSeg(){
  var i = todayIdx();
  if(i < 0) return null;
  var n = nowMin();
  return daySegs(i).find(function(s){
    return toMin(s.start) <= n && n < toMin(s.end) && s.status !== 'done' && s.status !== 'skipped';
  }) || null;
}
function nextSeg(){
  var i = todayIdx();
  if(i < 0) return daySegs(activeDayIdx)[0] || null;
  var n = nowMin();
  return daySegs(i).find(function(s){
    return toMin(s.start) > n && s.status !== 'done' && s.status !== 'skipped';
  }) || null;
}
/* Running behind: an earlier segment is still open past its end time */
function overdueSeg(){
  var i = todayIdx();
  if(i < 0) return null;
  var n = nowMin();
  return daySegs(i).find(function(s){
    return toMin(s.end) <= n && s.status !== 'done' && s.status !== 'skipped';
  }) || null;
}

function logEvent(kind, text){
  ops.log.unshift({ id: uid('log'), ts: Date.now(), kind: kind, text: text });
  if(ops.log.length > 400) ops.log.length = 400;
}

/* ============================================================
   QUICK-TAP ACTIONS
   ============================================================ */
function startSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'active';
  s.actualStart = fromMin(nowMin());
  logEvent('start', 'Started "' + s.title + '" at ' + fmt12(s.actualStart));
  haptic(); saveOps(); render();
  toast('Started · ' + fmt12(s.actualStart));
}
function doneSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'done';
  s.actualEnd = fromMin(nowMin());
  if(!s.actualStart) s.actualStart = s.start;
  var planned = toMin(s.end) - toMin(s.start);
  var actual  = toMin(s.actualEnd) - toMin(s.actualStart);
  var delta   = actual - planned;
  logEvent('done', 'Completed "' + s.title + '" · ' + durStr(actual) +
    (Math.abs(delta) >= 5 ? (delta > 0 ? ' (+' + durStr(delta) + ' over)' : ' (' + durStr(-delta) + ' under)') : ' (on time)'));
  haptic(); saveOps(); render();
  toast(Math.abs(delta) < 5 ? 'Done · on time' :
    (delta > 0 ? 'Done · ' + durStr(delta) + ' over' : 'Done · ' + durStr(-delta) + ' early'));
}
function skipSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'skipped';
  logEvent('skip', 'Skipped "' + s.title + '"');
  haptic(); saveOps(); render(); toast('Marked skipped');
}
function reopenSeg(id){
  var s = segById(id); if(!s) return;
  s.status = 'pending'; s.actualStart = null; s.actualEnd = null;
  saveOps(); render(); toast('Reopened');
}
/* Push this segment and everything after it on the same day */
function pushDay(id, mins){
  var s = segById(id); if(!s) return;
  var from = toMin(s.start);
  daySegs(s.dayIdx).forEach(function(x){
    if(toMin(x.start) >= from && x.status !== 'done'){
      x.start = fromMin(toMin(x.start) + mins);
      x.end   = fromMin(toMin(x.end)   + mins);
    }
  });
  logEvent('shift', (mins > 0 ? 'Pushed ' : 'Pulled ') + Math.abs(mins) + 'm from "' + s.title + '" onward');
  haptic(); saveOps(); render();
  toast((mins > 0 ? 'Pushed +' : 'Pulled −') + Math.abs(mins) + ' min from here on');
}

/* ============================================================
   VIEW ROUTER
   ============================================================ */
function go(v){
  view = v;
  document.querySelectorAll('.tabbtn').forEach(function(b){
    b.classList.toggle('active', b.dataset.view === v);
  });
  document.getElementById('main').scrollTop = 0;
  lastNowHtml = '';
  render();
}
function renderPluginTabs(){
  var z = document.getElementById('plugin-tabs'); if(!z) return;
  z.innerHTML = PLUGINS.map(function(p){
    return '<button class="tabbtn' + (view === 'plugin:' + p.id ? ' active' : '') + '" data-view="plugin:' + p.id + '" onclick="go(\'plugin:' + p.id + '\')">' +
      '<span class="ic">' + p.icon + '</span>' + esc(p.name[deLang()] || p.name.en) + '</button>';
  }).join('');
}
function render(){
  lastNowHtml = '';
  var m = document.getElementById('main');
  if(String(view).indexOf('plugin:') === 0){ mountPlugin(view.slice(7)); renderPluginTabs(); if(nowMap){ try{ nowMap.remove(); }catch(e){} nowMap = null; } return; }
  if(view === 'now')   m.innerHTML = viewNow();
  if(view === 'day')   m.innerHTML = viewDay();
  if(view === 'show')  m.innerHTML = viewShow();
  if(view === 'oral')  m.innerHTML = viewOral();
  if(view === 'place') m.innerHTML = viewPlace();
  if(view === 'now')   paintNow();
  if(view === 'now'){ loadWx(false); }
  if(view === 'now')   initNowMap(); else if(nowMap){ try{ nowMap.remove(); }catch(e){} nowMap = null; }
}


/* ============================================================
   NOW MAP — the day's stops, numbered in order
   ============================================================ */
var nowMap = null, mapShowAll = false;
function nowMapIdx(){ var i = todayIdx(); return i >= 0 ? i : activeDayIdx; }
function mapStops(idx){
  var stops = [], seen = {};
  daySegs(idx).forEach(function(s){
    var L = locById(s.locationId);
    if(!L || L.lat == null || L.lng == null) return;
    if(!seen[L.id]){ seen[L.id] = { loc:L, segs:[] }; stops.push(seen[L.id]); }
    seen[L.id].segs.push(s);
  });
  return stops;
}
function nowMapHtml(){
  var idx = nowMapIdx(), d = ops.days[idx];
  return '<div class="sec-label"><span>Map · ' + esc(d ? d.label : '') + '</span>' +
    '<button class="btn sm ghost" style="min-height:34px" onclick="mapShowAll=!mapShowAll;initNowMap()">' +
    (mapShowAll ? 'Today only' : 'All places') + '</button></div>' +
    '<div id="nowmap"></div>' +
    '<div class="maplegend"><span><i style="background:var(--ochre)"></i>Now</span>' +
    '<span><i style="background:linear-gradient(90deg,#C12A0A 0 25%,#BDAA72 25% 50%,#7D8740 50% 75%,#701905 75%)"></i>Today, in order · colour = block type</span>' +
    '<span><i style="background:var(--good)"></i>Done</span>' +
    (mapShowAll ? '<span><i style="background:#701905;border-radius:3px;border:1px solid var(--cream-muted)"></i>Other places · # matches the Places tab</span>' : '') +
    '<button class="btn sm ghost" style="min-height:34px;margin-left:auto" onclick="locateMe()">◎ Where am I</button></div>' +
    '<div class="xs muted" style="margin-top:6px">Map tiles need signal the first time; areas you’ve viewed stay cached. Pins always work offline.</div>';
}
function placeNum(id){ for(var i=0;i<ops.locations.length;i++) if(ops.locations[i].id === id) return i + 1; return ''; }
function mapPopup(L, segs){
  return '<div class="mpop"><b>' + esc(L.name) + '</b><div class="t" style="margin-bottom:3px">Place #' + placeNum(L.id) + '</div>' +
    (segs || []).map(function(s){ return '<div class="t">' + fmt12(s.start) + ' · ' + esc(s.title) + '</div>'; }).join('') +
    '<div class="r"><button class="o" onclick="navTo(\'' + L.id + '\')">⌖ Navigate</button>' +
    '<button onclick="openLoc(\'' + L.id + '\')">Details</button></div></div>';
}
function initNowMap(){
  var el = document.getElementById('nowmap');
  if(nowMap){ try{ nowMap.remove(); }catch(e){} nowMap = null; }
  if(!el) return;
  if(!window.L){ el.innerHTML = '<div class="empty xs">Map unavailable</div>'; return; }
  var idx = nowMapIdx(), stops = mapStops(idx);
  var cur = currentSeg();
  nowMap = L.map(el, { scrollWheelZoom:false, zoomControl:true, attributionControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, subdomains:'abc', attribution:'© OpenStreetMap'
  }).addTo(nowMap);

  var pts = [];
  if(mapShowAll){
    var onDay = {}; stops.forEach(function(st){ onDay[st.loc.id] = 1; });
    ops.locations.forEach(function(Lc){
      if(onDay[Lc.id] || Lc.lat == null || Lc.lng == null) return;
      L.marker([Lc.lat, Lc.lng], { icon:L.divIcon({ className:'', iconSize:[26,20], iconAnchor:[13,10], popupAnchor:[0,-10],
          html:'<div class="mtag">' + placeNum(Lc.id) + '</div>' }), zIndexOffset:-100 })
        .bindPopup(mapPopup(Lc, ops.segments.filter(function(s){ return s.locationId === Lc.id; })))
        .addTo(nowMap);
      pts.push([Lc.lat, Lc.lng]);
    });
  }
  var line = stops.map(function(st){ return [st.loc.lat, st.loc.lng]; });
  if(line.length > 1) L.polyline(line, { color:'#D99A35', weight:2, opacity:.7, dashArray:'5 7' }).addTo(nowMap);
  stops.forEach(function(st, i){
    var isCur = cur && st.segs.some(function(s){ return s.id === cur.id; });
    var allDone = st.segs.every(function(s){ return s.status === 'done' || s.status === 'skipped'; });
    var icon = L.divIcon({ className:'', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14],
      html:'<div class="mpin t-' + st.segs[0].type + (isCur ? ' cur' : (allDone ? ' done' : '')) + '">' + (i + 1) + '</div>' });
    var m = L.marker([st.loc.lat, st.loc.lng], { icon:icon, zIndexOffset: isCur ? 1000 : 0 })
      .bindPopup(mapPopup(st.loc, st.segs)).addTo(nowMap);
  });

  var fit = line.length ? line : pts;
  if(mapShowAll) fit = line.concat(pts);
  if(fit.length === 1) nowMap.setView(fit[0], 15);
  else if(fit.length) nowMap.fitBounds(fit, { padding:[28,28], maxZoom:16 });
  else nowMap.setView([9.6540, -82.7549], 13);
  setTimeout(function(){ if(nowMap) nowMap.invalidateSize(); }, 80);
}
var meMarker = null;
function locateMe(){
  if(!navigator.geolocation){ toast('Location not available'); return; }
  toast('Finding you…');
  navigator.geolocation.getCurrentPosition(function(p){
    if(!nowMap) return;
    var ll = [p.coords.latitude, p.coords.longitude];
    meMarker = L.marker(ll, { icon:L.divIcon({ className:'', iconSize:[16,16], iconAnchor:[8,8], html:'<div class="mpin me"></div>' }) })
      .addTo(nowMap).bindPopup('You are here');
    nowMap.setView(ll, Math.max(nowMap.getZoom(), 15));
  }, function(){ toast('Couldn’t get your location'); }, { enableHighAccuracy:true, timeout:12000 });
}

/* ============================================================
   VIEW: NOW
   ============================================================ */
function viewNow(){
  var h = '<div id="nowzone"></div><div id="wxzone">' + wxHtml() + '</div>' + nowPhrases() + nowShots() + nowMapHtml();

  /* Rest of today */
  var i = todayIdx();
  var idx = i >= 0 ? i : activeDayIdx;
  var segs = daySegs(idx);
  var n = nowMin();
  var upcoming = i >= 0
    ? segs.filter(function(s){ return toMin(s.end) > n && s.status !== 'done' && s.status !== 'skipped'; })
    : segs;

  var doneCt = segs.filter(function(s){ return s.status === 'done'; }).length;
  h += '<div class="sec-label"><span>Rest of ' + (i >= 0 ? 'today' : esc(ops.days[idx] ? ops.days[idx].label : 'day')) + '</span>' +
       '<span class="xs">' + doneCt + ' / ' + segs.length + ' complete</span></div>';

  if(!upcoming.length){
    h += '<div class="card"><div class="muted sm">Nothing left on the schedule. ' +
         '<a class="link" href="#" onclick="go(\'day\');return false">Open the full day →</a></div></div>';
  } else {
    h += '<div class="tl">' + upcoming.slice(0,6).map(function(s){ return tlItem(s, false); }).join('') + '</div>';
    if(upcoming.length > 6){
      h += '<button class="btn full ghost" onclick="go(\'day\')">See all ' + segs.length + ' blocks →</button>';
    }
  }

  /* Consent gaps — the thing that bites you later */
  var gaps = ops.people.filter(function(p){
    return (p.stage === 'Recorded' || p.stage === 'In progress' || p.stage === 'Transcribed') &&
           (!p.consent.written || !p.consent.archive);
  });
  if(gaps.length){
    h += '<div class="sec-label">Consent needs closing</div>';
    gaps.forEach(function(p){
      var miss = [];
      if(!p.consent.written) miss.push('written release');
      if(!p.consent.archive) miss.push('archive permission');
      h += '<div class="card tight" onclick="openPerson(\'' + p.id + '\')">' +
        '<div class="spread"><div class="grow"><div class="seg-title" style="font-size:1.05rem">' + esc(p.name) + '</div>' +
        '<div class="xs muted" style="margin-top:3px">Recorded — missing ' + miss.join(' + ') + '</div></div>' +
        '<span class="chip bad">Open</span></div></div>';
    });
  }

  h += '<div class="sec-label">Reading</div>' + briefBtn() + phrBtn() + shotBtn();
  /* Day log */
  if(ops.log.length){
    h += '<div class="sec-label">Field log</div><div class="card">';
    h += ops.log.slice(0,7).map(function(L){
      var d = new Date(L.ts);
      return '<div class="kv"><b>' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '</b><span class="grow">' + esc(L.text) + '</span></div>';
    }).join('');
    h += '</div>';
  }
  return h;
}

/* The live card, repainted every second without rebuilding the page.
   Everything here is minute-granularity except the recording clock, which
   paintRecTimers updates in place — so we diff the markup and only touch
   the DOM when it actually changed. Without this the question list would
   be rebuilt under the director's finger once a second. */
var lastNowHtml = '';
function paintNow(){
  var zone = document.getElementById('nowzone');
  if(!zone) return;
  var cur = currentSeg(), late = overdueSeg(), nxt = nextSeg();
  var n = nowMin(), h = '';

  if(cur){
    var st = toMin(cur.start), en = toMin(cur.end);
    var left = en - n, elapsed = n - st, total = Math.max(1, en - st);
    var pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
    var loc = locById(cur.locationId);
    h = '<div id="nowcard" class="' + (left < 0 ? 'late' : '') + '">' +
      '<div class="now-kicker"><span class="pulse"></span>' +
        (cur.status === 'active' ? 'In progress' : 'Happening now') + ' · ' + SEG_TYPES[cur.type].label + '</div>' +
      '<div class="now-title">' + esc(cur.title) + '</div>' +
      (cur.speaker ? '<div class="now-meta">' + SEG_TYPES[cur.type].ic + ' ' + esc(cur.speaker) + '</div>' : '') +
      (loc ? '<button class="kv tap" style="border-bottom:0;margin-top:8px" ' +
             'onclick="openLoc(\'' + loc.id + '\')"><b>Where</b><span class="grow">' +
             esc(loc.name) + '</span></button>' : '') +
      (cur.personId ? '<button class="kv tap" style="border-bottom:0" ' +
             'onclick="openPerson(\'' + cur.personId + '\')"><b>Narrator</b><span class="grow">' +
             esc((perById(cur.personId)||{}).name || '') + '</span></button>' : '') +
      '<div class="now-time">' + fmt12(cur.start) + ' – ' + fmt12(cur.end) + ' · ' + durStr(total) + '</div>' +
      '<div class="countdown ' + (left < 0 ? 'over' : '') + '">' +
        (left < 0 ? '+' + durStr(-left) : durStr(left)) +
        '<small>' + (left < 0 ? 'over time' : 'remaining') + '</small></div>' +
      '<div id="progressbar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="btnrow">' +
        (cur.status === 'active'
          ? '<button class="btn good" onclick="doneSeg(\'' + cur.id + '\')">✓ Complete</button>'
          : '<button class="btn ochre" onclick="startSeg(\'' + cur.id + '\')">▶ Start</button>') +
        '<button class="btn" onclick="openSeg(\'' + cur.id + '\')">Details</button>' +
      '</div>' +
      '<div class="btnrow three">' +
        '<button class="btn sm ghost" onclick="pushDay(\'' + cur.id + '\',10)">+10m all</button>' +
        '<button class="btn sm ghost" onclick="pushDay(\'' + cur.id + '\',30)">+30m all</button>' +
        (loc ? '<button class="btn sm ghost" onclick="navTo(\'' + loc.id + '\')">⌖ Navigate</button>'
             : '<button class="btn sm ghost" onclick="skipSeg(\'' + cur.id + '\')">Skip</button>') +
      '</div>' +
      (cur.type === 'interview' && cur.personId ? recStrip(cur.personId) : '') +
    '</div>' +
    (cur.type === 'interview' && cur.personId ? nowQuestions(cur.personId) : '');
  } else if(late){
    var over = n - toMin(late.end);
    h = '<div id="nowcard" class="late">' +
      '<div class="now-kicker"><span class="pulse"></span>Running behind</div>' +
      '<div class="now-title">' + esc(late.title) + '</div>' +
      '<div class="now-time">Was ' + fmt12(late.start) + ' – ' + fmt12(late.end) + '</div>' +
      '<div class="countdown over">+' + durStr(over) + '<small>past its end</small></div>' +
      '<div class="btnrow">' +
        '<button class="btn good" onclick="doneSeg(\'' + late.id + '\')">✓ Complete</button>' +
        '<button class="btn ghost" onclick="skipSeg(\'' + late.id + '\')">Didn\'t happen</button>' +
      '</div>' +
      '<div class="btnrow"><button class="btn sm ghost" onclick="pushDay(\'' + late.id + '\',' + (Math.ceil(over/15)*15) + ')">' +
        'Shift the rest of the day +' + durStr(Math.ceil(over/15)*15) + '</button>' +
        '<button class="btn sm ghost" onclick="openSeg(\'' + late.id + '\')">Details</button></div>' +
    '</div>';
  } else if(false){
    var gapTxt = nxt ? durStr(toMin(nxt.start) - n) + ' until next' : 'Schedule complete';
    h = '<div id="nowcard" class="idle">' +
      '<div class="now-kicker">Open time</div>' +
      '<div class="now-title">' + (nxt ? 'Nothing scheduled right now' : 'Day complete') + '</div>' +
      '<div class="now-time">' + esc(gapTxt) + '</div>' +
      (nxt ? '<div class="btnrow"><button class="btn ochre" onclick="startSeg(\'' + nxt.id + '\')">▶ Start next early</button>' +
             '<button class="btn" onclick="openSeg(\'' + nxt.id + '\')">Details</button></div>' : '') +
    '</div>';
  }

  /* Next up preview */
  if(nxt && (!cur || nxt.id !== cur.id)){
    var nloc = locById(nxt.locationId);
    h += '<div class="sec-label"><span>Next up</span>' + (!cur && !late && todayIdx() >= 0 ? '<span class="xs">in ' + durStr(toMin(nxt.start) - n) + '</span>' : '') + '</div>' +
      '<div class="card tight" onclick="openSeg(\'' + nxt.id + '\')">' +
        '<div class="row"><div class="timecol">' + fmt12(nxt.start).replace(' ','') +
        '<small>' + durStr(toMin(nxt.end) - toMin(nxt.start)) + '</small></div>' +
        '<div class="grow"><div class="seg-title" style="font-size:1.1rem">' + esc(nxt.title) + '</div>' +
        '<div class="xs muted trunc" style="margin-top:3px">' +
          (nxt.speaker ? esc(nxt.speaker) + ' · ' : '') + (nloc ? esc(nloc.name) : SEG_TYPES[nxt.type].label) +
        '</div></div>' +
        '<span class="chip ' + nxt.type + '">' + SEG_TYPES[nxt.type].label + '</span></div>' +
      '</div>';
  }
  if(h === lastNowHtml) return;
  lastNowHtml = h;
  zone.innerHTML = h;
}

/* Live question guide under the NOW card during an interview block.
   Unasked questions float to the top so the remaining ground is obvious. */
function nowQuestions(pid){
  var p = perById(pid); if(!p) return '';
  if(!p.questions || !p.questions.length){
    return '<div class="sec-label">Question guide</div>' +
      '<div class="qnone">No question set for ' + esc(p.name) + '. ' +
      '<a class="link" href="#" onclick="openBank(\'' + p.id + '\');return false">Open the shared bank →</a></div>';
  }
  var n = askedCount(p), t = p.questions.length;
  var open = p.questions.filter(function(q){ return !q.asked; });
  var done = p.questions.filter(function(q){ return q.asked; });
  var h = '<div class="sec-label"><span>Asking ' + esc(p.name) + '</span>' +
    '<span class="qcount ' + (n === t ? 'done' : '') + '" data-qc="' + p.id + '">' +
    n + ' / ' + t + ' asked</span></div>';
  if(p.focus) h += '<div class="qfocus" style="margin:-4px 2px 10px">Focus · ' + esc(p.focus) + '</div>';
  h += '<div class="qwrap">' + open.concat(done).map(function(q){ return qRow(p.id, q); }).join('') + '</div>';
  h += '<div class="btnrow" style="margin-top:10px">' +
    '<button class="btn sm ghost" onclick="openBank(\'' + p.id + '\')">Shared bank</button>' +
    '<button class="btn sm ghost" onclick="openPerson(\'' + p.id + '\')">Consent &amp; log</button></div>';
  return h;
}

/* Compact recorder strip embedded in the NOW card for interview blocks */
function recStrip(pid){
  var p = perById(pid); if(!p) return '';
  var live = !!p.recStartedAt;
  var sec = p.recSec + (live ? Math.floor((Date.now() - p.recStartedAt)/1000) : 0);
  return '<div class="rec ' + (live ? 'live' : '') + '" data-rec="' + p.id + '">' +
    '<span class="recdot"></span>' +
    '<span class="rt">' + clockStr(sec) + '</span>' +
    '<button class="btn sm ' + (live ? 'danger' : 'ochre') + '" onclick="toggleRec(\'' + p.id + '\')">' +
      (live ? '■ Stop' : '● Record') + '</button>' +
    '<button class="btn sm ghost" onclick="openPerson(\'' + p.id + '\')">Log</button>' +
  '</div>';
}

/* One timeline row */
function tlItem(s, showDay){
  var cls = s.status === 'done' ? 'done' : (currentSeg() && currentSeg().id === s.id ? 'now' : '');
  var loc = locById(s.locationId);
  var per = perById(s.personId);
  var sub = [];
  if(s.speaker) sub.push(esc(s.speaker));
  if(per) sub.push(esc(per.name));
  if(loc) sub.push('⌖ ' + esc(loc.name));
  if(s.type === 'travel' && s.to) sub.push('→ ' + esc(s.to));
  return '<div class="tlitem t-' + s.type + ' ' + cls + '">' +
    '<div class="card tight" onclick="openSeg(\'' + s.id + '\')">' +
      '<div class="row">' +
        '<div class="timecol">' + fmt12(s.start).replace(' ','') +
          '<small>' + durStr(toMin(s.end) - toMin(s.start)) + '</small></div>' +
        '<div class="grow">' +
          '<div class="seg-title">' + esc(s.title) + '</div>' +
          (sub.length ? '<div class="xs muted trunc" style="margin-top:3px">' + sub.join(' · ') + '</div>' : '') +
        '</div>' +
        '<span class="chip ' + s.type + '">' + SEG_TYPES[s.type].ic + '</span>' +
      '</div>' +
    '</div></div>';
}

/* ============================================================
   VIEW: DAY  (full timeline, all blocks, day switcher)
   ============================================================ */
function dayPicker(){
  return '<div class="segctl">' + ops.days.map(function(d, i){
    var isToday = d.date === todayISO();
    return '<button class="' + (i === activeDayIdx ? 'active' : '') + '" onclick="setDay(' + i + ')">' +
      esc(d.label) + (isToday ? ' ·' : '') + '<span class="xs muted" style="display:block;font-size:.62rem">' +
      prettyDate(d.date) + '</span></button>';
  }).join('') + '</div>';
}
function setDay(i){ activeDayIdx = i; render(); }

function viewDay(){
  var segs = daySegs(activeDayIdx);
  var h = dayPicker();

  var doneCt = segs.filter(function(s){ return s.status === 'done'; }).length;
  var firstT = segs.length ? toMin(segs[0].start) : 0;
  var lastT  = segs.length ? Math.max.apply(null, segs.map(function(s){ return toMin(s.end); })) : 0;
  var travelMin = segs.filter(function(s){ return s.type === 'travel'; })
    .reduce(function(a, s){ return a + (toMin(s.end) - toMin(s.start)); }, 0);
  var ivCt = segs.filter(function(s){ return s.type === 'interview'; }).length;

  h += '<div class="card"><div class="row wrap" style="gap:16px">' +
    statBlock(segs.length ? fmt12(fromMin(firstT)) + ' – ' + fmt12(fromMin(lastT)) : '—', 'Field hours') +
    statBlock(doneCt + '/' + segs.length, 'Complete') +
    statBlock(durStr(travelMin), 'In transit') +
    statBlock(String(ivCt), 'Interviews') +
    '</div></div>';

  if(!segs.length){
    h += '<div class="empty"><div class="big">◌</div><div>No blocks on this day yet.</div>' +
      '<button class="btn ochre" style="margin-top:16px" onclick="openSeg(null)">+ Add a block</button></div>';
    return h;
  }

  h += '<div class="tl">' + segs.map(function(s, i){
    var gapHtml = '';
    if(i > 0){
      var gap = toMin(s.start) - toMin(segs[i-1].end);
      if(gap >= 20) gapHtml = '<div class="xs muted" style="margin:-4px 0 10px 4px">↕ ' + durStr(gap) + ' open</div>';
      if(gap < 0)   gapHtml = '<div class="xs" style="color:#EE8A6E;margin:-4px 0 10px 4px">⚠ overlaps previous by ' + durStr(-gap) + '</div>';
    }
    return gapHtml + tlItem(s, false);
  }).join('') + '</div>';

  h += '<button class="btn full ochre" onclick="openSeg(null)">+ Add a block to ' + esc(ops.days[activeDayIdx].label) + '</button>';
  return h;
}
function statBlock(v, l){
  return '<div style="flex:1;min-width:74px"><div style="font-family:var(--serif);font-size:1.3rem;color:var(--white);line-height:1.1">' +
    esc(v) + '</div><div class="xs muted" style="letter-spacing:.08em;text-transform:uppercase;margin-top:3px">' + esc(l) + '</div></div>';
}

/* ============================================================
   VIEW: RUN OF SHOW  (speaking segments across the school)
   ============================================================ */
function viewShow(){
  var h = dayPicker();
  var segs = daySegs(activeDayIdx).filter(function(s){ return s.type === 'speaking' || s.type === 'site'; });

  h += '<div class="sec-label"><span>Run of show</span><span class="xs">' + segs.length + ' segments</span></div>';
  if(!segs.length){
    h += '<div class="empty"><div class="big">◈</div><div>No speaking segments on this day.</div></div>';
    return h;
  }

  segs.forEach(function(s){
    var planned = toMin(s.end) - toMin(s.start);
    var actual = (s.actualStart && s.actualEnd) ? toMin(s.actualEnd) - toMin(s.actualStart) : null;
    var delta = actual != null ? actual - planned : null;
    var loc = locById(s.locationId);
    h += '<div class="card">' +
      '<div class="spread" style="align-items:flex-start">' +
        '<div class="grow"><div class="xs muted">' + fmt12(s.start) + ' – ' + fmt12(s.end) + ' · ' + durStr(planned) + ' allotted</div>' +
        '<div class="seg-title" style="font-size:1.25rem;margin-top:4px">' + esc(s.title) + '</div></div>' +
        '<span class="chip ' + s.type + '">' + SEG_TYPES[s.type].label + '</span>' +
      '</div>';

    var per = perById(s.personId);
    if(per) h += kvTap('Narrator', esc(per.name), 'openPerson(\'' + per.id + '\')');
    else if(s.speaker) h += kv('Speaker', esc(s.speaker));
    if(s.speakerBio) h += kv('Bio', esc(s.speakerBio));
    if(s.intro) h += kv('Intro copy', esc(s.intro));
    if(s.av) h += kv('AV / mic', esc(s.av));
    if(loc) h += kvTap('Where', esc(loc.name) + (loc.meetingPoint ? ' — ' + esc(loc.meetingPoint) : ''),
                       'openLoc(\'' + loc.id + '\')');
    if(actual != null){
      h += '<div class="kv"><b>Actual</b><span class="grow">' + durStr(actual) + ' ' +
        '<span class="chip ' + (Math.abs(delta) < 5 ? 'ok' : (delta > 0 ? 'warn' : 'ok')) + '">' +
        (Math.abs(delta) < 5 ? 'on time' : (delta > 0 ? '+' + durStr(delta) : durStr(-delta) + ' under')) +
        '</span></span></div>';
    }

    h += '<div class="linkrow">' +
      (s.status === 'done'
        ? '<button class="btn ghost" onclick="reopenSeg(\'' + s.id + '\')">↺ Reopen</button>'
        : (s.status === 'active'
          ? '<button class="btn good" onclick="doneSeg(\'' + s.id + '\')">✓ Wrap segment</button>'
          : '<button class="btn ochre" onclick="startSeg(\'' + s.id + '\')">▶ Start segment</button>')) +
      (loc ? '<button class="btn" onclick="navTo(\'' + loc.id + '\')">⌖ Navigate</button>' : '') +
      '<button class="btn ghost" onclick="openSeg(\'' + s.id + '\')">Edit</button>' +
    '</div></div>';
  });
  return h;
}

/* ============================================================
   VIEW: ORAL HISTORY
   ============================================================ */
function stageChip(stage){
  var cls = stage === 'Recorded' || stage === 'Transcribed' || stage === 'Archived' ? 'ok'
          : (stage === 'In progress' ? 'warn' : '');
  return '<span class="chip ' + cls + '">' + esc(stage) + '</span>';
}
function consentScore(p){
  var k = ['verbal','written','media','archive'];
  return k.filter(function(x){ return p.consent[x]; }).length;
}

function viewOral(){
  var people = ops.people.slice().sort(function(a,b){
    var rank = { 'In progress':0, 'Scheduled':1, 'Recorded':2, 'Transcribed':3, 'Archived':4, 'Not started':5 };
    return (rank[a.stage] - rank[b.stage]) || a.name.localeCompare(b.name);
  });
  var totalSec = people.reduce(function(a, p){ return a + (p.recSec || 0); }, 0);
  var totQ  = people.reduce(function(a, p){ return a + ((p.questions || []).length); }, 0);
  var askQ  = people.reduce(function(a, p){ return a + askedCount(p); }, 0);

  var h = '<div class="card"><div class="row wrap" style="gap:16px">' +
    statBlock(String(people.length), 'On roster') +
    statBlock(String(people.filter(function(p){ return p.stage === 'Recorded' || p.stage === 'Transcribed' || p.stage === 'Archived'; }).length), 'Recorded') +
    statBlock(askQ + '/' + totQ, 'Questions asked') +
    statBlock(String(people.filter(function(p){ return !p.consent.written && p.recSec > 0; }).length), 'Release gaps') +
    '</div></div>';

  if(ops.sharedBank){
    h += '<button class="btn full ghost" style="margin-bottom:4px" onclick="openBank(null)">' +
      '◍ Shared land &amp; water question bank</button>';
  }

  h += '<div class="sec-label"><span>Interview roster</span>' +
       '<button class="btn sm ghost" onclick="openPerson(null)">+ Person</button></div>';

  if(!people.length){
    h += '<div class="empty"><div class="big">◍</div><div>No one on the roster yet.</div>' +
      '<button class="btn ochre" style="margin-top:16px" onclick="openPerson(null)">+ Add a narrator</button></div>';
    return h;
  }

  people.forEach(function(p){
    var live = !!p.recStartedAt;
    var sec = p.recSec + (live ? Math.floor((Date.now() - p.recStartedAt)/1000) : 0);
    var cs = consentScore(p);
    h += '<div class="card">' +
      '<div class="spread" style="align-items:flex-start" onclick="openPerson(\'' + p.id + '\')">' +
        '<div class="grow">' +
          '<div class="seg-title" style="font-size:1.25rem">' + esc(p.name) + '</div>' +
          '<div class="xs muted" style="margin-top:3px">' + esc([p.role, p.org].filter(Boolean).join(' · ')) + '</div>' +
        '</div>' + stageChip(p.stage) +
      '</div>';

    if(p.relation) h += '<div class="sm dim" style="margin-top:9px">' + esc(p.relation) + '</div>';
    if(p.topics && p.topics.length){
      h += '<div class="row wrap" style="margin-top:9px;gap:6px">' +
        p.topics.map(function(t){ return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>';
    }

    /* Consent toggles — one tap each */
    h += '<div class="consent">' +
      ctog(p.id, 'verbal',  'Verbal consent') +
      ctog(p.id, 'written', 'Written release') +
      ctog(p.id, 'media',   'Photo / video') +
      ctog(p.id, 'archive', 'Archive + reuse') +
    '</div>';
    if(cs === 0){
      h += '<div class="xs" style="color:#EE8A6E;margin-top:8px">⚠ No consent recorded — do not record.</div>';
    } else if(p.recSec > 0 && !p.consent.written){
      h += '<div class="xs" style="color:var(--ochre-lite);margin-top:8px">⚠ Tape exists without a written release.</div>';
    }

    /* Recorder */
    h += '<div class="rec ' + (live ? 'live' : '') + '" data-rec="' + p.id + '">' +
      '<span class="recdot"></span><span class="rt">' + clockStr(sec) + '</span>' +
      '<button class="btn sm ' + (live ? 'danger' : 'ochre') + '" onclick="toggleRec(\'' + p.id + '\')">' +
        (live ? '■ Stop' : '● Record') + '</button>' +
      '<button class="btn sm ghost" onclick="openPerson(\'' + p.id + '\')">Details</button>' +
    '</div>';

    if(p.device) h += kv('Rig', esc(p.device));
    if(p.files && p.files.length) h += kv('Files', p.files.map(esc).join('<br>'));
    if(p.phone) h += kvTap('Phone', esc(p.phone), 'location.href=\'' + telHref(p.phone) + '\'');
    if(p.email) h += kvTap('Email', esc(p.email), 'location.href=\'mailto:' + esc(p.email) + '\'');

    /* Where and when this person is scheduled — tap through to the block */
    var mySegs = ops.segments.filter(function(s){ return s.personId === p.id; })
      .sort(function(a,b){ return (a.dayIdx - b.dayIdx) || (toMin(a.start) - toMin(b.start)); });
    mySegs.forEach(function(s){
      var L = locById(s.locationId);
      h += kvTap('Scheduled',
        esc((ops.days[s.dayIdx] || {}).label || 'Day') + ' · ' + fmt12(s.start) +
        (L ? '<br><span class="xs muted">' + esc(L.name) + '</span>' : ''),
        'openSeg(\'' + s.id + '\')');
    });
    if(p.notes) h += kv('Notes', esc(p.notes));

    h += questionGuide(p, false);
    h += '</div>';
  });
  return h;
}

function ctog(pid, key, label){
  var p = perById(pid);
  return '<button class="ctog ' + (p.consent[key] ? 'on' : '') + '" onclick="toggleConsent(\'' + pid + '\',\'' + key + '\')">' +
    '<span class="box">✓</span><span>' + esc(label) + '</span></button>';
}
function toggleConsent(pid, key){
  var p = perById(pid); if(!p) return;
  p.consent[key] = !p.consent[key];
  logEvent('consent', (p.consent[key] ? 'Recorded' : 'Cleared') + ' ' + key + ' consent — ' + p.name);
  haptic(); saveOps(); render();
  toast(p.name + ' · ' + key + ' ' + (p.consent[key] ? 'granted' : 'cleared'));
}

/* ---------- RECORDING TIMER ---------- */
function toggleRec(pid){
  var p = perById(pid); if(!p) return;
  if(p.recStartedAt){
    p.recSec += Math.floor((Date.now() - p.recStartedAt)/1000);
    p.recStartedAt = null;
    if(p.stage === 'Not started' || p.stage === 'Scheduled' || p.stage === 'In progress') p.stage = 'Recorded';
    p.recordedOn = todayISO();
    logEvent('rec', 'Stopped recording ' + p.name + ' — running total ' + clockStr(p.recSec));
    toast('Stopped · ' + clockStr(p.recSec) + ' logged');
  } else {
    if(consentScore(p) === 0){ toast('No consent on file — capture it first'); return; }
    p.recStartedAt = Date.now();
    p.stage = 'In progress';
    logEvent('rec', 'Started recording ' + p.name);
    toast('Recording ' + p.name);
  }
  haptic(); saveOps(); render();
  updateRecTimer();
}
function updateRecTimer(){
  var any = ops.people.some(function(p){ return !!p.recStartedAt; });
  recTimer = any;
}
function paintRecTimers(){
  document.querySelectorAll('[data-rec]').forEach(function(el){
    var p = perById(el.dataset.rec); if(!p) return;
    var live = !!p.recStartedAt;
    var sec = p.recSec + (live ? Math.floor((Date.now() - p.recStartedAt)/1000) : 0);
    var rt = el.querySelector('.rt');
    if(rt) rt.textContent = clockStr(sec);
  });
}


/* ============================================================
   FIELD BRIEFING — background reading for the visit
   ============================================================ */
function briefSrc(src){
  if(!src || !src.length) return '';
  return '<div class="brief-src">' + src.map(function(s){
    return s[1] ? '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + ' ↗</a>'
                : '<a style="border-style:dashed">' + esc(s[0]) + '</a>';
  }).join('') + '</div>';
}
function openBrief(secIdx){
  var B = CR2026.briefing; if(!B){ toast('No briefing'); return; }
  var h = '<div class="spread" style="margin-bottom:10px"><h2 style="font-size:1.4rem">' + esc(B.title) + '</h2>' +
    '<button class="icon-btn" onclick="closeSheet()">✕</button></div>';
  h += '<div class="qsrc">' + esc(B.source) + '</div>';
  h += '<div class="segctl" style="margin-bottom:4px">' + B.sections.map(function(s, i){
    return '<button class="' + (i === secIdx ? 'active' : '') + '" onclick="openBrief(' + i + ')">' + esc(s.h.split(' · ').pop()) + '</button>';
  }).join('') + '</div>';
  B.sections.forEach(function(s, i){
    h += '<div class="brief-sec c' + (i % 5) + (s.flag ? ' flag' : '') + '" id="brief-' + i + '"><h3>' + esc(s.h) + '</h3>';
    if(s.intro) h += '<div class="brief-intro">' + esc(s.intro) + '</div>' + briefSrc(s.src);
    s.items.forEach(function(it){
      var L = it.loc ? locById(it.loc) : null;
      h += '<div class="brief-item"><b>' + esc(it.t) + '</b><p>' + esc(it.b) + '</p>' + briefSrc(it.src) +
        (L ? '<div class="brief-loc"><button class="btn sm ghost" onclick="closeSheet();go(\'place\');setTimeout(function(){openLoc(\'' + L.id + '\')},250)">⌖ ' + esc(L.name.split(/[—(]/)[0].trim()) + '</button></div>' : '') +
        '</div>';
    });
    h += '</div>';
  });
  openSheet(h);
  if(secIdx != null){
    setTimeout(function(){
      var el = document.getElementById('brief-' + secIdx), sh = document.getElementById('sheet');
      if(el && sh) sh.scrollTop = el.offsetTop - 70;
    }, 60);
  }
}
function briefBtn(){
  if(!CR2026.briefing) return '';
  return '<button class="card tap briefcard" style="width:100%;text-align:left;display:block" onclick="openBrief(null)">' +
    '<div class="xs muted" style="letter-spacing:.14em;text-transform:uppercase">Field briefing</div>' +
    '<div class="seg-title" style="font-size:1.15rem;margin-top:4px">Afro-Indigenous history &amp; land on the southern Caribbean</div>' +
    '<div class="xs muted" style="margin-top:4px">Slavery &amp; flight · Bribri &amp; Talamanca · 1710 shipwrecks · bananas · land rights &amp; who to meet</div>' +
    '<div class="tapnote" style="margin-top:8px">Tap to read ›</div></button>';
}


/* ============================================================
   B-ROLL SHOT LIST
   ============================================================ */
var SHOT_KINDS = { wide:'Wide', detail:'Detail', action:'Action', sound:'Sound', portrait:'People', archival:'Archival' };
function shotsFor(locId){ return (ops.shots || []).filter(function(x){ return !locId || x.loc === locId; }); }
function shotRow(x){
  return '<button class="shot k-' + esc(x.kind) + (x.got ? ' got' : '') + '" data-shot="' + x.id + '" onclick="toggleShot(\'' + x.id + '\')">' +
    '<span class="qbox">✓</span><span class="grow"><span class="sk">' + esc(SHOT_KINDS[x.kind] || x.kind) + '</span>' +
    (x.release ? '<span class="rel">release</span>' : '') +
    '<span class="st">' + esc(x.title) + '</span>' + (x.note ? '<span class="sn">' + esc(x.note) + '</span>' : '') + '</span></button>';
}
function toggleShot(id){
  var x = (ops.shots || []).find(function(s){ return s.id === id; }); if(!x) return;
  x.got = !x.got; x.gotAt = x.got ? Date.now() : null;
  if(x.got) logEvent('shot', 'Got B-roll: ' + x.title);
  haptic(); saveOps();
  document.querySelectorAll('[data-shot="' + id + '"]').forEach(function(el){ el.classList.toggle('got', x.got); });
  document.querySelectorAll('[data-shotcount]').forEach(function(el){
    var l = el.getAttribute('data-shotcount'), a = shotsFor(l || null);
    el.textContent = a.filter(function(s){ return s.got; }).length + ' / ' + a.length;
  });
}
function openShots(locId){
  var all = shotsFor(locId);
  var h = '<div class="spread" style="margin-bottom:10px"><h2 style="font-size:1.4rem">' +
    (locId ? 'B-roll · ' + esc((locById(locId) || {}).name || '') : 'B-roll shot list') + '</h2>' +
    '<button class="icon-btn" onclick="closeSheet()">✕</button></div>';
  h += '<div class="qsrc">Preliminary list for the visit, built from the briefing sources. Tap to tick off. ' +
    '<b style="color:#EE8A6E">Release</b> = get consent before rolling. ' +
    '<span data-shotcount="' + (locId || '') + '">' + all.filter(function(s){ return s.got; }).length + ' / ' + all.length + '</span> captured.</div>';
  if(locId){
    h += all.map(shotRow).join('');
    h += '<button class="btn full ghost" style="margin-top:8px" onclick="openShots(null)">All shots</button>';
  } else {
    var order = [];
    all.forEach(function(x){ if(order.indexOf(x.loc) < 0) order.push(x.loc); });
    order.forEach(function(l){
      var L = locById(l);
      h += '<div class="qgroup" style="display:flex;justify-content:space-between"><span>' + esc(L ? L.name : l) + '</span>' +
        (L && L.lat != null ? '<a class="link" href="#" onclick="navTo(\'' + l + '\');return false">⌖</a>' : '') + '</div>';
      h += all.filter(function(x){ return x.loc === l; }).map(shotRow).join('');
    });
  }
  openSheet(h);
}
function shotBtn(){
  var all = shotsFor(null); if(!all.length) return '';
  var got = all.filter(function(s){ return s.got; }).length;
  return '<button class="card tap shotcard" style="width:100%;text-align:left;display:block" onclick="openShots(null)">' +
    '<div class="spread"><div class="xs muted" style="letter-spacing:.14em;text-transform:uppercase">B-roll shot list</div>' +
    '<span class="qcount" data-shotcount="">' + got + ' / ' + all.length + '</span></div>' +
    '<div class="seg-title" style="font-size:1.15rem;margin-top:4px">Preliminary shots for Talamanca &amp; Limón</div>' +
    '<div class="xs muted" style="margin-top:4px">Shipwreck coast · Bribri cacao · Liberty Hall · food as archive · land pressure</div>' +
    '<div class="tapnote" style="margin-top:8px">Tap to open ›</div></button>';
}
/* Shots for wherever the current block is */
function nowShots(){
  var cur = currentSeg(); if(!cur || !cur.locationId) return '';
  var a = shotsFor(cur.locationId); if(!a.length) return '';
  return '<div class="sec-label"><span>B-roll here</span><span class="qcount" data-shotcount="' + cur.locationId + '">' +
    a.filter(function(s){ return s.got; }).length + ' / ' + a.length + '</span></div>' + a.map(shotRow).join('');
}


/* ============================================================
   PHRASEBOOK — Spanish for each part of the trip
   ============================================================ */
var PHR_KIND = { w:'Word', p:'Phrase', q:'Question' };
function phrPack(id){ return (CR2026.phrasebook || []).find(function(p){ return p.id === id; }); }
var phrVoice = null;
function sayEs(txt){
  try{
    if(!('speechSynthesis' in window)){ toast('Speech not available'); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(txt).replace(/\s*\/\s*/g, ', ').replace(/…/g, '...'));
    if(!phrVoice){
      var vs = speechSynthesis.getVoices();
      phrVoice = vs.find(function(v){ return /es-CR/i.test(v.lang); }) || vs.find(function(v){ return /es-(MX|US|419)/i.test(v.lang); }) ||
                 vs.find(function(v){ return /^es/i.test(v.lang); }) || null;
    }
    if(phrVoice) u.voice = phrVoice;
    u.lang = phrVoice ? phrVoice.lang : 'es-CR'; u.rate = 0.85;
    speechSynthesis.speak(u);
  }catch(e){ toast('Could not play audio'); }
}
function phrRow(it){
  return '<div class="phr k-' + it.k + '"><span class="grow"><span class="sk" style="font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-muted)">' +
    PHR_KIND[it.k] + '</span><span class="es">' + esc(it.es) + '</span><span class="en">' + esc(it.en) + '</span>' +
    (it.n ? '<span class="nt">' + esc(it.n) + '</span>' : '') + '</span>' +
    '<button class="say" aria-label="Say it" onclick="sayEs(' + esc(JSON.stringify(it.es)) + ')">🔊</button></div>';
}
function openPhrases(packId){
  var PB = CR2026.phrasebook || []; if(!PB.length) return;
  var cur = phrPack(packId) || PB[0];
  var h = '<div class="spread" style="margin-bottom:10px"><h2 style="font-size:1.4rem">Spanish phrasebook</h2>' +
    '<button class="icon-btn" onclick="closeSheet()">✕</button></div>';
  h += '<div class="segctl" style="margin-bottom:8px">' + PB.map(function(p){
    return '<button class="' + (p.id === cur.id ? 'active' : '') + '" onclick="openPhrases(\'' + p.id + '\')">' + esc(p.title) + '</button>';
  }).join('') + '</div>';
  h += '<div class="phrkey"><span><i style="background:#BC7710"></i>Phrase</span><span><i style="background:#C12A0A"></i>Question</span>' +
    '<span><i style="background:#7D8740"></i>Word</span><span>🔊 plays it aloud (uses your phone’s Spanish voice)</span></div>';
  if(cur.intro) h += '<div class="qsrc">' + esc(cur.intro) + '</div>';
  var order = { p:0, q:1, w:2 };
  h += cur.items.slice().sort(function(a,b){ return order[a.k] - order[b.k]; }).map(phrRow).join('');
  openSheet(h);
  var sh = document.getElementById('sheet'); if(sh) sh.scrollTop = 0;
  var act = document.querySelector('#sheet .segctl button.active');
  if(act && act.parentNode){ var pn = act.parentNode; pn.scrollLeft = act.offsetLeft - (pn.clientWidth - act.offsetWidth) / 2; }
}
function phrBtn(){
  if(!(CR2026.phrasebook || []).length) return '';
  return '<button class="card tap phrcard" style="width:100%;text-align:left;display:block" onclick="openPhrases(null)">' +
    '<div class="xs muted" style="letter-spacing:.14em;text-transform:uppercase">Spanish phrasebook</div>' +
    '<div class="seg-title" style="font-size:1.15rem;margin-top:4px">¿Me regala…? — words, phrases &amp; questions</div>' +
    '<div class="xs muted" style="margin-top:4px">Bus · food · Bribri · beach · Josephine · consent · history &amp; land · emergencies</div>' +
    '<div class="tapnote" style="margin-top:8px">Tap to open ›</div></button>';
}
/* Phrases for the block in progress (or the next one) */
function nowPhrases(){
  var s = currentSeg() || nextSeg(); if(!s || !s.phrases || !s.phrases.length) return '';
  var packs = s.phrases.map(phrPack).filter(Boolean); if(!packs.length) return '';
  var first = packs[0];
  var picks = first.items.filter(function(it){ return it.k !== 'w'; }).slice(0, 3);
  return '<div class="sec-label"><span>Say it · ' + esc(first.title) + '</span>' +
    '<button class="btn sm ghost" style="min-height:34px" onclick="openPhrases(\'' + first.id + '\')">More</button></div>' +
    picks.map(phrRow).join('') +
    (packs.length > 1 ? '<div class="row wrap" style="gap:6px;margin:2px 0 4px">' + packs.slice(1).map(function(p){
      return '<button class="chip tap" onclick="openPhrases(\'' + p.id + '\')">' + esc(p.title) + ' ›</button>'; }).join('') + '</div>' : '');
}
if('speechSynthesis' in window){ try{ speechSynthesis.onvoiceschanged = function(){ phrVoice = null; }; }catch(e){} }


/* ============================================================
   WEATHER — Open-Meteo (no key). Cached on the device so the last
   forecast still shows with no signal.
   ============================================================ */
var WX_KEY = 'bel_wx_v1', wxBusy = false;
var WX_CODES = { 0:['☀️','Clear'],1:['🌤','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫','Fog'],48:['🌫','Fog'],
  51:['🌦','Light drizzle'],53:['🌦','Drizzle'],55:['🌧','Heavy drizzle'],56:['🌧','Freezing drizzle'],57:['🌧','Freezing drizzle'],
  61:['🌦','Light rain'],63:['🌧','Rain'],65:['🌧','Heavy rain'],66:['🌧','Freezing rain'],67:['🌧','Freezing rain'],
  71:['🌨','Snow'],73:['🌨','Snow'],75:['🌨','Snow'],77:['🌨','Snow'],80:['🌦','Showers'],81:['🌧','Showers'],82:['⛈','Heavy showers'],
  85:['🌨','Snow showers'],86:['🌨','Snow showers'],95:['⛈','Thunderstorm'],96:['⛈','Thunderstorm, hail'],99:['⛈','Thunderstorm, hail'] };
function wxCode(c){ return WX_CODES[c] || ['·', '—']; }
function wxPlace(){
  var s = currentSeg() || nextSeg(), L = s ? locById(s.locationId) : null;
  if(!L || L.lat == null){ var i = todayIdx(); var d = daySegs(i >= 0 ? i : activeDayIdx);
    for(var k = 0; k < d.length && (!L || L.lat == null); k++) L = locById(d[k].locationId); }
  if(!L || L.lat == null) L = locById('loc_pv');
  return L;
}
function wxRead(){ try{ return JSON.parse(localStorage.getItem(WX_KEY) || 'null'); }catch(e){ return null; } }
function wxWrite(v){ try{ localStorage.setItem(WX_KEY, JSON.stringify(v)); }catch(e){} }
function f2c(c){ return Math.round(c * 9 / 5 + 32); }
function hhmm(iso){ var t = String(iso || '').split('T')[1] || ''; return t ? fmt12(t.slice(0,5)) : ''; }
function wxHtml(){
  var w = wxRead(), L = wxPlace();
  var head = '<div class="where"><span>Weather · ' + esc(L ? L.name.split(/[—(]/)[0].trim() : '') + '</span>' +
    '<a class="link" href="#" onclick="loadWx(true);return false">↻</a></div>';
  if(!w || !w.f){
    return '<div class="wx">' + head + '<div class="d">' + (wxBusy ? 'Loading forecast…' :
      'No forecast saved yet — it loads automatically when there’s signal.') + '</div></div>';
  }
  var f = w.f, c = f.current || {}, code = wxCode(c.weather_code);
  var hrs = '', H = f.hourly || {}, now = Date.now();
  if(H.time){
    var start = 0;
    /* times are local to the place; compare by hour string against the place's own clock */
    var placeNow = new Date(now + (f.utc_offset_seconds || 0) * 1000).toISOString().slice(0,13);
    for(var j = 0; j < H.time.length; j++){ if(H.time[j].slice(0,13) >= placeNow){ start = j; break; } }
    for(var k = start; k < Math.min(start + 6, H.time.length); k++){
      var p = H.precipitation_probability ? H.precipitation_probability[k] : null;
      hrs += '<div>' + esc(fmt12(H.time[k].slice(11,16)).replace(':00','').replace(' ','')) +
        '<b>' + wxCode(H.weather_code[k])[0] + '</b><span class="rp' + (p >= 60 ? ' rain-hi' : '') + '">' + (p != null ? p + '%' : '') + '</span></div>';
    }
  }
  var D = f.daily || {}, m = w.m && w.m.current ? w.m.current : null;
  var facts = [];
  if(D.temperature_2m_max) facts.push('<span>High/low <b>' + Math.round(D.temperature_2m_max[0]) + '° / ' + Math.round(D.temperature_2m_min[0]) + '°</b></span>');
  if(D.precipitation_probability_max) facts.push('<span>Rain today <b>' + D.precipitation_probability_max[0] + '%</b></span>');
  if(c.wind_speed_10m != null) facts.push('<span>Wind <b>' + Math.round(c.wind_speed_10m) + ' km/h</b></span>');
  if(c.relative_humidity_2m != null) facts.push('<span>Humidity <b>' + c.relative_humidity_2m + '%</b></span>');
  if(D.uv_index_max) facts.push('<span>UV <b>' + Math.round(D.uv_index_max[0]) + '</b></span>');
  if(D.sunset){ var ss = D.sunset[0].slice(11,16); facts.push('<span>Sunset <b>' + fmt12(ss) + '</b> · golden hour from <b>' + fmt12(fromMin(toMin(ss) - 60)) + '</b></span>'); }
  if(m && m.wave_height != null) facts.push('<span>Waves <b>' + m.wave_height.toFixed(1) + ' m</b>' + (m.wave_period ? ' · ' + Math.round(m.wave_period) + ' s' : '') + '</span>');
  var age = Math.round((Date.now() - w.at) / 60000);
  var ageTxt = age < 2 ? 'Updated just now' : age < 90 ? 'Updated ' + age + ' min ago' : 'Updated ' + Math.round(age / 60) + ' h ago' + (age > 360 ? ' — offline, showing the last forecast' : '');
  return '<div class="wx">' + head +
    '<div class="top"><div class="ic">' + code[0] + '</div><div class="grow">' +
      '<div class="t">' + Math.round(c.temperature_2m) + '°C<small>' + f2c(c.temperature_2m) + '°F</small></div>' +
      '<div class="d">' + esc(code[1]) + (c.apparent_temperature != null ? ' · feels like ' + Math.round(c.apparent_temperature) + '°' : '') + '</div></div></div>' +
    (hrs ? '<div class="hrs">' + hrs + '</div>' : '') +
    '<div class="facts">' + facts.join('') + '</div>' +
    '<div class="stale">' + ageTxt + (w.place && L && w.place !== L.id ? ' · for ' + esc((locById(w.place) || {}).name || '') : '') + ' · Open-Meteo</div></div>';
}
function paintWx(){ var z = document.getElementById('wxzone'); if(z) z.innerHTML = wxHtml(); }
function wxFetch(url){
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var t = setTimeout(function(){ if(ctl) ctl.abort(); }, 9000);
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function(r){ clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json(); });
}
function loadWx(force){
  var L = wxPlace(); if(!L) return;
  var w = wxRead();
  if(!force && w && w.place === L.id && Date.now() - w.at < 30 * 60000) return;
  if(!navigator.onLine && !force) return;
  wxBusy = true; if(!w) paintWx();
  var q = 'latitude=' + L.lat + '&longitude=' + L.lng + '&timezone=auto';
  var fu = 'https://api.open-meteo.com/v1/forecast?' + q +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
    '&hourly=temperature_2m,precipitation_probability,weather_code&forecast_hours=12' +
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&forecast_days=1';
  var mu = 'https://marine-api.open-meteo.com/v1/marine?' + q + '&current=wave_height,wave_period';
  Promise.all([wxFetch(fu), wxFetch(mu).catch(function(){ return null; })]).then(function(r){
    wxWrite({ at: Date.now(), place: L.id, f: r[0], m: r[1] });
    wxBusy = false; paintWx(); if(force) toast('Weather updated');
  }).catch(function(){ wxBusy = false; paintWx(); if(force) toast('No signal — showing the last forecast'); });
}
window.addEventListener('online', function(){ if(view === 'now') loadWx(true); });

/* ============================================================
   VIEW: PLACES
   ============================================================ */
function viewPlace(){
  var h = briefBtn() + phrBtn() + shotBtn() + '<div class="sec-label"><span>Locations</span>' +
    '<button class="btn sm ghost" onclick="openLoc(null)">+ Place</button></div>';

  if(!ops.locations.length){
    h += '<div class="empty"><div class="big">⌖</div><div>No locations saved.</div>' +
      '<button class="btn ochre" style="margin-top:16px" onclick="openLoc(null)">+ Add a place</button></div>';
    return h;
  }

  ops.locations.forEach(function(L, li){
    var used = ops.segments.filter(function(s){ return s.locationId === L.id; });
    var q = encodeURIComponent(L.address || L.name);
    var mapHref = (L.lat && L.lng) ? ('geo:' + L.lat + ',' + L.lng + '?q=' + q) : ('https://maps.apple.com/?q=' + q);
    h += '<div class="card">' +
      '<div class="spread" style="align-items:flex-start">' +
        '<div class="grow"><div class="seg-title" style="font-size:1.25rem"><span class="pnum">' + (li + 1) + '</span>' + esc(L.name) + '</div>' +
        (L.address ? '<div class="xs muted" style="margin-top:3px">' + esc(L.address) + '</div>' : '') + '</div>' +
        (L.kind ? '<span class="chip k-' + esc(L.kind) + '">' + esc(L.kind) + '</span>' : '') +
      '</div>';

    if(L.address)      h += kvTap('Address', esc(L.address), 'navTo(\'' + L.id + '\')');
    if(L.meetingPoint) h += kv('Meet at', esc(L.meetingPoint));
    if(L.parking)      h += kv('Parking', esc(L.parking));
    if(L.access)       h += kv('Access', esc(L.access));
    if(L.contact){
      var ph = (L.contact.match(/[\d][\d\s().+-]{7,}/) || [''])[0].trim();
      h += ph ? kvTap('On site', esc(L.contact), 'location.href=\'' + telHref(ph) + '\'')
              : kv('On site', esc(L.contact));
    }
    if(L.notes)        h += kv('Notes', esc(L.notes));
    var lShots = shotsFor(L.id);
    if(lShots.length) h += kvTap('B-roll', lShots.filter(function(s){ return s.got; }).length + ' / ' + lShots.length + ' shots', 'openShots(\'' + L.id + '\')');

    used.forEach(function(s){
      h += kvTap('Scheduled',
        esc((ops.days[s.dayIdx] || {}).label || 'Day') + ' · ' + fmt12(s.start) +
        '<br><span class="xs muted">' + esc(s.title) + '</span>',
        'openSeg(\'' + s.id + '\')');
    });

    h += '<div class="linkrow">' +
      '<button class="btn ochre" onclick="navTo(\'' + L.id + '\')">⌖ Navigate</button>' +
      '<button class="btn ghost" onclick="openLoc(\'' + L.id + '\')">Edit</button>' +
    '</div></div>';
  });

  /* Travel legs summary — the documentarian's drive plan */
  var legs = ops.segments.filter(function(s){ return s.type === 'travel'; })
    .sort(function(a,b){ return (a.dayIdx - b.dayIdx) || (toMin(a.start) - toMin(b.start)); });
  if(legs.length){
    h += '<div class="sec-label">Travel legs</div>';
    legs.forEach(function(s){
      var mins = toMin(s.end) - toMin(s.start);
      var dest = locById(s.locationId);
      h += '<div class="card tight tap">' +
        '<div class="row" onclick="openSeg(\'' + s.id + '\')"><div class="timecol">' + fmt12(s.start).replace(' ','') +
        '<small>' + durStr(mins) + '</small></div>' +
        '<div class="grow"><div class="sm" style="color:var(--white)">' + esc(s.from || '—') + ' → ' + esc(s.to || '—') + '</div>' +
        '<div class="xs muted" style="margin-top:3px">' +
          esc(ops.days[s.dayIdx] ? ops.days[s.dayIdx].label : '') +
          (s.mode ? ' · ' + esc(s.mode) : '') + (s.buffer ? ' · ' + s.buffer + 'm buffer' : '') +
        '</div></div>' +
        '<span class="chip travel">→</span></div>' +
        (dest ? '<div class="linkrow"><button class="btn sm ochre" onclick="navTo(\'' + dest.id + '\')">' +

}

/* ============================================================
   QUESTION GUIDE
   ------------------------------------------------------------
   Question sets live on each narrator record (the Mississippi
   guide's sets are in the archived data). Each question
   carries an `asked` flag the director taps during the session,
   so what's left to cover is visible while the tape runs.
   ============================================================ */
function askedCount(p){
  if(!p.questions || !p.questions.length) return 0;
  return p.questions.filter(function(q){ return q.asked; }).length;
}
function toggleAsked(pid, qid){
  var p = perById(pid); if(!p || !p.questions) return;
  var q = p.questions.find(function(x){ return x.id === qid; });
  if(!q) return;
  q.asked = !q.asked;
  haptic(); saveOps();
  var el = document.querySelector('[data-q="' + qid + '"]');
  if(el){
    el.classList.toggle('asked', q.asked);
    document.querySelectorAll('[data-qc="' + pid + '"]').forEach(function(c){
      var n = askedCount(p), t = p.questions.length;
      c.textContent = n + ' / ' + t + ' asked';
      c.classList.toggle('done', n === t);
    });
  } else {
    render();
  }
}
function resetAsked(pid){
  var p = perById(pid); if(!p || !p.questions) return;
  p.questions.forEach(function(q){ q.asked = false; });
  saveOps(); render(); toast('Question guide reset');
}

/* One question row */
function qRow(pid, q){
  var h = '<button class="q ' + (q.asked ? 'asked' : '') + '" data-q="' + q.id + '" ' +
    'onclick="toggleAsked(\'' + pid + '\',\'' + q.id + '\')">' +
    '<span class="qbox">✓</span><span class="grow">' +
      '<span class="qlabel">' + esc(q.label) + '</span>' +
      '<span class="qtext">' + esc(q.text) + '</span>' +
    '</span></button>';
  if(q.sub && q.sub.length){
    h += '<div class="qsub">' + q.sub.map(function(s){ return '<div>' + esc(s) + '</div>'; }).join('') + '</div>';
  }
  return h;
}

/* The full guide block for one person */
function questionGuide(p, compact){
  var h = '';
  if(!p.questions || !p.questions.length){
    h += '<div class="qhead"><span class="lbl">Question guide</span></div>' +
      '<div class="qnone">No question set for ' + esc(p.name) + ' in the interview guide. ' +
      'Use the shared land &amp; water bank below, or write one before the day.</div>' +
      '<button class="btn full ghost" style="margin-top:9px" onclick="openBank(\'' + p.id + '\')">' +
      'Open shared question bank</button>';
    return h;
  }
  var n = askedCount(p), t = p.questions.length;
  h += '<div class="qhead"><span class="lbl">Question guide</span>' +
    '<span class="qcount ' + (n === t ? 'done' : '') + '" data-qc="' + p.id + '">' +
    n + ' / ' + t + ' asked</span></div>';
  if(p.focus) h += '<div class="qfocus" style="margin:0 0 11px">Focus · ' + esc(p.focus) + '</div>';
  h += '<div class="qwrap">' + p.questions.map(function(q){ return qRow(p.id, q); }).join('') + '</div>';
  if(!compact){
    h += '<div class="btnrow" style="margin-top:11px">' +
      '<button class="btn sm ghost" onclick="openBank(\'' + p.id + '\')">Shared bank</button>' +
      '<button class="btn sm ghost" onclick="resetAsked(\'' + p.id + '\')">Reset ticks</button></div>';
  }
  return h;
}

/* Shared land & water bank, opened from any narrator */
function openBank(pid){

  var h = '<div class="spread" style="margin-bottom:14px">' +

function saveSeg(id, isNew){
  var s = isNew ? ops._draftSeg : segById(id);
  if(!s) return;
  s.dayIdx     = +val('sg-day');
  s.start      = val('sg-start') || s.start;
  s.end        = val('sg-end')   || s.end;
  if(toMin(s.end) <= toMin(s.start)) s.end = fromMin(toMin(s.start) + 30);
  s.type       = val('sg-type');
  s.title      = val('sg-title') || 'Untitled block';
  s.speaker    = val('sg-speaker');
  s.speakerBio = val('sg-bio');
  s.intro      = val('sg-intro');
  s.av         = val('sg-av');
  s.from       = val('sg-from');
  s.to         = val('sg-to');
  s.mode       = val('sg-mode');
  s.buffer     = +val('sg-buffer') || 0;
  s.locationId = val('sg-loc') || null;
  s.personId   = val('sg-per') || null;
  s.notes      = val('sg-notes');
  if(isNew){ ops.segments.push(s); delete ops._draftSeg; logEvent('edit', 'Added block "' + s.title + '"'); }
  else logEvent('edit', 'Edited block "' + s.title + '"');
  saveOps(); closeSheet(); render(); toast('Saved');
}
function delSeg(id){
  var s = segById(id); if(!s) return;
  if(!confirm('Delete "' + s.title + '"?')) return;
  ops.segments = ops.segments.filter(function(x){ return x.id !== id; });
  logEvent('edit', 'Deleted block "' + s.title + '"');
  saveOps(); closeSheet(); render(); toast('Deleted');
}

function savePerson(id, isNew){

function delPerson(id){

  ops.segments.forEach(function(s){ if(s.personId === id) s.personId = null; });
  saveOps(); closeSheet(); render(); toast('Removed');
}
