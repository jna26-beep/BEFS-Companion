function loadSchool(fsId){
  var pl = loadPlanner();
  if(!pl) return;
  var fs = pl.fieldSchools.find(function(f){ return f.id === fsId; });
  if(!fs) return;
  if(!confirm('Load "' + fs.title + '"? This replaces the current field data on this device. Export first if you need it.')) return;
  ops = importFromPlanner(fs, pl.contacts || []);
  activeDayIdx = Math.max(0, ops.days.findIndex(function(d){ return d.date === todayISO(); }));
  saveOps();
  document.getElementById('fs-name').textContent = ops.schoolTitle;
  document.getElementById('fs-sub').textContent  = ops.destination || 'Black Ecologies Lab';
  closeSheet(); go('now'); toast('Loaded ' + fs.title);
}

function addDay(){
  var last = ops.days[ops.days.length - 1];
  ops.days.push({ date: addDays(last.date, 1), label: 'Day ' + (ops.days.length + 1) });
  saveOps(); closeSheet(); render(); toast('Day added');
}
function removeDay(){
  if(ops.days.length < 2) return;
  var i = ops.days.length - 1;
  if(ops.segments.some(function(s){ return s.dayIdx === i; })){
    if(!confirm('That day still has blocks. Remove it and its blocks?')) return;
    ops.segments = ops.segments.filter(function(s){ return s.dayIdx !== i; });
  }
  ops.days.pop();
  if(activeDayIdx >= ops.days.length) activeDayIdx = ops.days.length - 1;
  saveOps(); closeSheet(); render(); toast('Day removed');
}

function exportOps(){
  var blob = new Blob([JSON.stringify(ops, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'BEL-field-' + (ops.schoolTitle || 'school').replace(/[^a-z0-9]+/gi,'-').toLowerCase().slice(0,40) +
    '-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast('Exported');
}
function exportArchive(){
  var raw = null; try{ raw = localStorage.getItem(ARCHIVE_KEY); }catch(e){}
  if(!raw){ toast('No archived data on this device'); return; }
  var blob = new Blob([raw], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'BEL-field-mississippi-2026-archive.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast('Archive downloaded');
}
function importOps(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d.segments || !d.days) throw new Error('not a field file');
      if(!confirm('Replace current field data with this file?')) return;
      ops = d;
      activeDayIdx = 0;
      saveOps();
      document.getElementById('fs-name').textContent = ops.schoolTitle;
      document.getElementById('fs-sub').textContent  = ops.destination || 'Black Ecologies Lab';
      closeSheet(); go('now'); toast('Imported');
    }catch(e){ toast('That file was not a field export'); }
  };
  r.readAsText(f);
  input.value = '';
}
function resetOps(){
  if(!confirm('Wipe all field data on this device? Export first if you need a copy.')) return;
  localStorage.removeItem(OPS_KEY);
  location.reload();
}

/* Printable one-page day sheet — for the paper backup every field lead ends up wanting */
function exportDaySheet(){
  var d = ops.days[activeDayIdx];
  var segs = daySegs(activeDayIdx);
  var w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups to print the day sheet'); return; }
  var rows = segs.map(function(s){
    var loc = locById(s.locationId), per = perById(s.personId);
    var detail = [
      s.speaker ? 'Speaker: ' + s.speaker : '',
      per ? 'Narrator: ' + per.name : '',
      loc ? 'At: ' + loc.name + (loc.meetingPoint ? ' (' + loc.meetingPoint + ')' : '') : '',
      s.type === 'travel' && s.to ? s.from + ' → ' + s.to + (s.mode ? ' · ' + s.mode : '') : '',
      s.av ? 'AV: ' + s.av : '',
      s.notes || ''
    ].filter(Boolean).join('<br>');
    return '<tr><td class="t">' + fmt12(s.start) + '<br><span class="g">' + fmt12(s.end) + '</span></td>' +
      '<td><b>' + esc(s.title) + '</b> <span class="g">[' + SEG_TYPES[s.type].label + ']</span>' +
      (detail ? '<div class="g">' + detail + '</div>' : '') + '</td>' +
      '<td class="box"></td></tr>';
  }).join('');
  var pending = ops.people.filter(function(p){ return !p.consent.written; });

  /* Question sheets for anyone being interviewed today — the paper backup
     that matters most, because this is what you read from if the iPad dies. */
  var todaysPeople = [];
  segs.forEach(function(s){
    if(s.personId && todaysPeople.indexOf(s.personId) < 0) todaysPeople.push(s.personId);
  });
  var qBlocks = todaysPeople.map(function(pid){
    var p = perById(pid);
    if(!p || !p.questions || !p.questions.length) return '';
    return '<h3>Questions — ' + esc(p.name) + '</h3>' +
      (p.focus ? '<div class="g" style="margin-bottom:6px">Focus: ' + esc(p.focus) + '</div>' : '') +
      '<ol style="margin:0;padding-left:20px">' + p.questions.map(function(q){
        return '<li style="margin-bottom:9px"><b>' + esc(q.label) + '</b><br>' + esc(q.text) +
          (q.sub && q.sub.length ? '<ul style="margin:5px 0 0;padding-left:16px;color:#555">' +
            q.sub.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
          '</li>';
      }).join('') + '</ol>';
  }).filter(Boolean).join('');
  w.document.write(
    '<!doctype html><meta charset="utf-8"><title>' + esc(ops.schoolTitle) + ' — ' + esc(d.label) + '</title>' +
    '<style>body{font:12px/1.45 Georgia,serif;color:#111;margin:28px;}h1{font-size:18px;margin:0 0 2px}' +
    'h2{font-size:12px;font-weight:normal;color:#555;margin:0 0 16px;letter-spacing:.06em;text-transform:uppercase}' +
    'table{width:100%;border-collapse:collapse}td{border-top:1px solid #ccc;padding:8px 6px;vertical-align:top}' +
    '.t{width:74px;font-weight:bold;white-space:nowrap}.g{color:#666;font-size:11px}' +
    '.box{width:26px;border-left:1px solid #eee}.box:after{content:"";display:block;width:14px;height:14px;border:1px solid #666}' +
    'h3{font-size:12px;margin:22px 0 6px;letter-spacing:.06em;text-transform:uppercase;color:#555}' +
    'ul{margin:0;padding-left:18px;color:#333}</style>' +
    '<h1>' + esc(ops.schoolTitle) + '</h1>' +
    '<h2>' + esc(d.label) + ' · ' + prettyDate(d.date) + ' · ' + esc(ops.destination) + '</h2>' +
    '<table>' + rows + '</table>' +
    (pending.length ? '<h3>Releases still needed</h3><ul>' +
      pending.map(function(p){ return '<li>' + esc(p.name) + (p.recSec ? ' — ' + clockStr(p.recSec) + ' already recorded' : '') + '</li>'; }).join('') +
      '</ul>' : '') +
    qBlocks +
    '<h3>Notes</h3><div style="height:120px;border:1px solid #ddd"></div>'
  );
  w.document.close();
  setTimeout(function(){ w.print(); }, 350);
}

/* ============================================================
   GESTURES: swipe between the five views
   ============================================================ */
(function(){
  var order = ['now','day','oral','plugin:discover-ecology'];
  var x0 = null, y0 = null;
  var main = null;
  document.addEventListener('touchstart', function(e){
    if(document.getElementById('sheet').classList.contains('open')) return;
    if(e.touches.length !== 1) return;
    if(e.target.closest && (e.target.closest('.leaflet-container') || e.target.closest('.segctl'))){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive:true });
  document.addEventListener('touchend', function(e){
    if(x0 == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 70 || Math.abs(dy) > 55) return;
    var i = order.indexOf(view);
    var ni = dx < 0 ? Math.min(order.length - 1, i + 1) : Math.max(0, i - 1);
    if(ni !== i){ haptic(); go(order[ni]); }
  }, { passive:true });
})();

/* Keep the screen awake during a field day, where supported */
(function(){
  var lock = null;
  async function acquire(){
    try{
      if('wakeLock' in navigator && document.visibilityState === 'visible'){
        lock = await navigator.wakeLock.request('screen');
      }
    }catch(e){ /* unsupported or denied — not important */ }
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){ acquire(); render(); }
  });
  acquire();
})();

/* ============================================================
   INSTALL / OFFLINE
   ------------------------------------------------------------
   The service worker only registers over http(s). Opened as a
   local file the app still runs — it just can't install, so we
   say so plainly rather than failing silently.
   ============================================================ */
var deferredInstall = null;
var isStandalone = (function(){
  try{
    if(window.navigator.standalone === true) return true;
    return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }catch(e){ return false; }
})();

if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){
      console.warn('SW registration failed', e);
    });
  });
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstall = e;
  var b = document.getElementById('install-btn');
  if(b) b.style.display = '';
});

function installState(){
  if(isStandalone) return { code:'installed', text:'Installed — running as an app' };
  if(location.protocol === 'file:') return { code:'file',
    text:'Opened as a local file. iOS can’t add this to the Home Screen and Safari may clear its data. Publish it to a URL first — see the deploy guide.' };
  if(deferredInstall) return { code:'ready', text:'Ready to install' };
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)) return { code:'ios',
    text:'Tap the Share button in Safari, then “Add to Home Screen”.' };
  return { code:'browser', text:'Open this page in Safari or Chrome to install it as an app.' };
}
function doInstall(){
  if(deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(){ deferredInstall = null; closeSheet(); });
  } else {
    toast(installState().text);
  }
}

/* ============================================================
   PLUGIN HOST — manifests, lazy mount, error boundary, bridge
   (Discover Ecology integration manual §3–4, adapted to this
   single-file vanilla-JS Companion: no React, same contract.)
   ============================================================ */
var PLUGINS = [];
var pluginMounted = {};
function registerPlugin(m){ PLUGINS.push(m); }
function pluginById(id){ return PLUGINS.find(function(p){ return p.id === id; }); }

/* Read-only bridge: the plugin gets copies, never ops itself, plus one write callback. */
function makeBridge(manifest){
  var clone = function(x){ return JSON.parse(JSON.stringify(x == null ? null : x)); };
  var consent = {}; ops.people.forEach(function(p){ consent[p.id] = { name:p.name, verbal:!!p.consent.verbal, written:!!p.consent.written, media:!!p.consent.media, archive:!!p.consent.archive }; });
  var cur = currentSeg();
  return Object.freeze({
    locations: clone(ops.locations), segments: clone(ops.segments), consent: Object.freeze(consent),
    trip: Object.freeze({ title: ops.schoolTitle, destination: ops.destination, days: clone(ops.days),
      today: todayISO(), todayIdx: todayIdx(), activeSegmentId: cur ? cur.id : null,
      roster: ops.people.map(function(p){ return { id:p.id, name:p.name }; }) }),
    lang: deLang(),
    observations: clone(ops.observations || []),
    onObservation: function(obs){
      if(!obs || !obs.id) return false;
      ops.observations = ops.observations || [];
      var i = ops.observations.findIndex(function(o){ return o.id === obs.id; });
      if(obs._delete){ if(i >= 0) ops.observations.splice(i, 1); }
      else if(i >= 0) ops.observations[i] = clone(obs); else ops.observations.unshift(clone(obs));
      if(!obs._delete) logEvent('obs', 'Observation: ' + (obs.species || 'unidentified'));
      saveOps(); return true;
    }
  });
}
function mountPlugin(id){
  var m = pluginById(id), el = document.getElementById('main');
  if(!m){ el.innerHTML = '<div class="empty">Plugin missing</div>'; return; }
  try{
    if(!pluginMounted[id]){ pluginMounted[id] = m.load(); }      /* lazy: built on first open */
    pluginMounted[id].render(el, makeBridge(m));
  }catch(err){
    console.error(err);
    el.innerHTML = '<div class="empty"><div class="big">⌖</div><div>' + esc(m.name[deLang()] || m.name.en) + ' unavailable</div>' +
      '<div class="xs muted" style="margin-top:8px">' + esc(err && err.message) + '</div>' +
      '<div class="xs muted" style="margin-top:8px">The rest of the Companion is unaffected.</div></div>';
  }
}
function deLang(){ try{ return localStorage.getItem('de_lang') || 'es'; }catch(e){ return 'es'; } }

  /* ---------- the dot map ---------- */
  function mapSvg(){
    var V = REGION.views[view], d = '', p = V.pts, r = .32;
    for(var i = 0; i < p.length; i += 2) d += 'M' + (p[i] - r) + ' ' + p[i + 1] + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';
    var pins = '', obsDots = '';
    B.locations.forEach(function(l){
      if(l.lat == null) return; var q = proj(view, l.lat, l.lng); if(!q) return;
      var col = KIND_COLOR[l.kind] || KIND_COLOR.other, sel = selPin === l.id;
      pins += '<g class="de-pin" data-loc="' + esc(l.id) + '" onclick="DE.pick(\'' + esc(l.id) + '\')" style="cursor:pointer">' +
        '<circle cx="' + q.x + '" cy="' + q.y + '" r="' + (sel ? 1.5 : 1.05) + '" fill="' + col + '" stroke="' + (sel ? '#F8F2DF' : '#161A0E') + '" stroke-width="' + (sel ? .35 : .25) + '"/></g>';
    });
    (B.observations || []).forEach(function(o){
      if(o.lat == null) return; var q = proj(view, o.lat, o.lng); if(!q) return;
      obsDots += '<circle cx="' + q.x + '" cy="' + q.y + '" r=".7" fill="none" stroke="#E1D29E" stroke-width=".25" opacity=".9"/>';
    });
    return '<svg viewBox="-1 -1 ' + (V.w + 2) + ' ' + (V.hgt + 2) + '" style="width:100%;height:auto;display:block;background:#161A0E;border-radius:12px" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="' + d + '" fill="#3A3D25"/>' + obsDots + pins + '</svg>';
  }

  /* ---------- images: iNaturalist first, Wikipedia fallback; cached URLs + SW-cached files ---------- */
  var imgCache = store(IMG_KEY) || {};
  function imgFor(s){ return imgCache[s.id] || null; }
  function fetchImg(s){
    if(imgCache[s.id]) return Promise.resolve(imgCache[s.id]);
    return fetch('https://api.inaturalist.org/v1/taxa?per_page=1&q=' + encodeURIComponent(s.inat))
      .then(function(r){ return r.json(); })
      .then(function(j){
        var x = j && j.results && j.results[0], ph = x && x.default_photo;
        if(!ph) throw new Error('no photo');
        return { url: ph.medium_url || ph.square_url, credit: (ph.attribution || '') + ' · iNaturalist', link: 'https://www.inaturalist.org/taxa/' + x.id };
      })
      .catch(function(){
        return fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(s.sci.replace(/ /g, '_')))
          .then(function(r){ return r.json(); })
          .then(function(j){ if(!j.thumbnail) throw new Error('no thumb');
            return { url: j.thumbnail.source, credit: 'Wikipedia / Wikimedia Commons', link: (j.content_urls && j.content_urls.mobile && j.content_urls.mobile.page) || '' }; });
      })
      .then(function(v){ imgCache[s.id] = v; store(IMG_KEY, imgCache); return v; });
  }
  function hydrateImgs(all){
    var list = REGION.species.filter(function(s){ return all || cat === 'all' || s.cat === cat; });
    var i = 0, ok = 0;
    function next(){
      if(i >= list.length){ if(all) toast(ok + ' / ' + list.length + ' images ready offline'); return; }
      var s = list[i++];
      fetchImg(s).then(function(v){
        ok++;
        var el = document.querySelector('[data-spimg="' + s.id + '"]');
        if(el && !el.querySelector('img')) el.innerHTML = '<img src="' + esc(v.url) + '" alt="" loading="lazy">';
        if(all){ var im = new Image(); im.src = v.url; }        /* warms the service-worker cache */
      }).catch(function(){}).then(next);
    }
    if(navigator.onLine) next();
  }

  /* ---------- photos in IndexedDB ---------- */
  function db(){ return new Promise(function(res, rej){ var r = indexedDB.open(PHOTO_DB, 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('p'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  function putPhoto(k, v){ return db().then(function(d){ return new Promise(function(res, rej){ var tx = d.transaction('p', 'readwrite'); tx.objectStore('p').put(v, k); tx.oncomplete = res; tx.onerror = rej; }); }); }
  function getPhoto(k){ return db().then(function(d){ return new Promise(function(res){ var q = d.transaction('p').objectStore('p').get(k); q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ res(null); }; }); }).catch(function(){ return null; }); }
  function shrink(file, max){ return new Promise(function(res, rej){
    var fr = new FileReader(); fr.onload = function(){ var im = new Image(); im.onload = function(){
      var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .8)); }; im.onerror = rej; im.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); }); }

  /* Consent is checked at render time, not only at export (manual, troubleshooting). */
  function photoAllowed(o){ if(!o.partnerId) return true; var c = B.consent[o.partnerId]; return !!(c && c.media); }

  /* ---------- views ---------- */
  function render(el, bridge){
    B = bridge; el.innerHTML = page(); bind(); hydrateImgs(false); paintThumbs();
  }
  function page(){
    var h = '<div class="spread" style="align-items:flex-start;margin-bottom:10px"><div><h2 style="font-size:1.45rem;color:var(--white)">' + t('title') + '</h2>' +
      '<div class="xs muted" style="margin-top:3px">' + t('sub') + '</div></div>' +
      '<div class="segctl" style="margin:0;flex:0 0 auto"><button class="' + (L() === 'es' ? 'active' : '') + '" onclick="DE.lang(\'es\')">ES</button>' +
      '<button class="' + (L() === 'en' ? 'active' : '') + '" onclick="DE.lang(\'en\')">EN</button></div></div>';
    h += '<div class="segctl">' + Object.keys(REGION.views).map(function(k){
      return '<button class="' + (k === view ? 'active' : '') + '" onclick="DE.view(\'' + k + '\')">' + nm(REGION.views[k].label) + '</button>'; }).join('') + '</div>';
    h += '<div class="card" style="padding:10px">' + mapSvg() +
      '<div class="maplegend" style="margin-top:9px">' + ['ecological','historical','community','academic'].map(function(k){
        return '<span><i style="background:' + KIND_COLOR[k] + '"></i>' + k + '</span>'; }).join('') +
      '<span><i style="background:transparent;border:1px solid #E1D29E"></i>' + t('obs').toLowerCase() + '</span></div>' +
      (selPin ? pinCard(selPin) : '') + '</div>';
    h += '<button class="btn full ochre" style="margin-bottom:6px" onclick="DE.form(null)">' + t('log') + '</button>';
    h += '<div class="xs muted" style="text-align:center;margin-bottom:4px">' + t('saved') + '</div>';
    h += obsList();
    h += '<div class="sec-label"><span>' + t('guide') + '</span><button class="btn sm ghost" style="min-height:34px" onclick="DE.imgs()">↓ ' + (L() === 'es' ? 'Imágenes' : 'Images') + '</button></div>';
    h += '<div class="segctl">' + Object.keys(CATS).map(function(k){
      return '<button class="' + (k === cat ? 'active' : '') + '" onclick="DE.cat(\'' + k + '\')">' + nm(CATS[k]) + '</button>'; }).join('') + '</div>';
    h += '<div class="de-grid">' + REGION.species.filter(function(s){ return cat === 'all' || s.cat === cat; }).map(spCard).join('') + '</div>';
    h += '<div class="sec-label">' + t('season') + '</div><div class="card">' + REGION.season[L()].map(function(x){
      return '<div class="kv"><span class="grow">' + esc(x) + '</span></div>'; }).join('') + '</div>';
    h += '<div class="sec-label">' + t('permits') + '</div>' + permits();
    h += '<button class="btn full ghost" style="margin-top:6px" onclick="DE.geojson()">↓ ' + t('geo') + '</button>';
    return h;
  }
  function pinCard(id){
    var l = locOf(id); if(!l) return '';
    var n = (B.observations || []).filter(function(o){ return o.locationId === id; }).length;
    return '<div class="spread" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div class="grow">' +
      '<div class="seg-title" style="font-size:1.05rem">' + esc(l.name) + '</div><div class="xs muted">' + esc(l.kind || '') + ' · ' + n + ' ' + t('obs').toLowerCase() + '</div></div>' +
      '<button class="btn sm ghost" onclick="DE.form(null,\'' + esc(id) + '\')">' + t('here') + '</button></div>';
  }
  function spCard(s){
    var im = imgFor(s), seen = (B.observations || []).filter(function(o){ return o.speciesId === s.id; }).length;
    return '<div class="de-sp" onclick="DE.sp(\'' + s.id + '\')"><div class="de-img" data-spimg="' + s.id + '">' +
      (im ? '<img src="' + esc(im.url) + '" alt="" loading="lazy">' : '<span>' + ({bird:'🐦',flower:'🌺',plant:'🌿',fruit:'🍈',insect:'🐜'}[s.cat] || '·') + '</span>') + '</div>' +
      '<div class="de-sp-b"><div class="de-n">' + esc(L() === 'es' ? s.es : s.en) + '</div><div class="de-s">' + esc(s.sci) + '</div>' +
      '<div class="de-st">' + esc(L() === 'es' ? s.status_es : s.status) + (seen ? ' · ' + seen + ' ' + t('seen') : '') + '</div></div></div>';
  }
  function obsList(){
    var o = (B.observations || []).slice(0, 25);
    if(!o.length) return '<div class="card tight sm muted">' + t('none') + '</div>';
    return o.map(function(x){
      var l = locOf(x.locationId), when = new Date(x.observedAt);
      var allowed = photoAllowed(x);
      return '<div class="card tight"><div class="row" style="align-items:flex-start">' +
        (x.photoRef ? '<div class="de-thumb" data-photo="' + esc(x.photoRef) + '" data-ok="' + (allowed ? 1 : 0) + '">' + (allowed ? '' : '🔒') + '</div>' : '') +
        '<div class="grow"><div class="seg-title" style="font-size:1.05rem">' + esc(x.species || '—') +
          (x.communityName ? ' <span class="xs" style="color:#E2A548">“' + esc(x.communityName) + '”</span>' : '') + '</div>' +
        '<div class="xs muted" style="margin-top:3px">' + esc(pad(when.getHours()) + ':' + pad(when.getMinutes()) + ' · ' + prettyDate(x.observedAt.slice(0, 10))) +
          (l ? ' · ⌖ ' + esc(l.name.split(/[—(]/)[0].trim()) : '') + (x.observerId ? ' · ' + esc(x.observerId) : '') + (x.sensitive ? ' · 🔒 sensitive' : '') + '</div>' +
        (x.note ? '<div class="sm dim" style="margin-top:5px">' + esc(x.note) + '</div>' : '') +
        (x.photoRef && !allowed ? '<div class="xs" style="color:#EE8A6E;margin-top:5px">' + t('hidden') + '</div>' : '') +
        '</div><button class="btn sm ghost" onclick="DE.form(\'' + esc(x.id) + '\')">✎</button></div></div>';
    }).join('');
  }
  function paintThumbs(){
    document.querySelectorAll('.de-thumb[data-ok="1"]').forEach(function(el){
      getPhoto(el.getAttribute('data-photo')).then(function(v){ if(v && v.thumb) el.innerHTML = '<img src="' + v.thumb + '" alt="">'; });
    });
  }
  function permits(){
    var P = store('de_permits') || {};
    return REGION.protected.map(function(p){
      var l = locOf(p.locId); if(!l) return '';
      return '<div class="card tight"><div class="seg-title" style="font-size:1rem">' + esc(l.name) + '</div>' +
        '<div class="xs muted" style="margin:3px 0 6px">' + esc(p.body) + ' — ' + esc(p.note) + '</div>' +
        '<input placeholder="' + esc(t('permit_no')) + '" value="' + esc(P[p.locId] || '') + '" onchange="DE.permit(\'' + p.locId + '\',this.value)"></div>';
    }).join('');
  }
  function bind(){ /* inline handlers route through window.DE */ }

  /* ---------- the observation form ---------- */
  var draft = null;
  function form(id, locId){
    var o = id ? (B.observations || []).find(function(x){ return x.id === id; }) : null;
    var seg = B.trip.activeSegmentId ? segOf(B.trip.activeSegmentId) : null;
    draft = o ? JSON.parse(JSON.stringify(o)) : {
      id: 'obs' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      locationId: locId || (seg ? seg.locationId : null), segmentId: seg ? seg.id : null,
      species: '', speciesId: null, communityName: '', partnerId: (seg && seg.personId) || null, note: '', photoRef: null,
      lat: null, lng: null, observedAt: new Date().toISOString(), observerId: store('de_observer') || '', consentScope: null, sensitive: false
    };
    var dl = '<datalist id="de-sp">' + REGION.species.map(function(s){ return '<option value="' + esc((L() === 'es' ? s.es : s.en) + ' — ' + s.sci) + '">'; }).join('') + '</datalist>';
    var h = '<div class="spread" style="margin-bottom:14px"><h2 style="font-size:1.4rem">' + (o ? '✎ ' : '') + t('log').replace('+ ', '') + '</h2>' +
      '<button class="icon-btn" onclick="closeSheet()">✕</button></div>';
    h += lbl(t('species')) + '<input id="de-species" list="de-sp" value="' + esc(draft.species) + '" placeholder="Tucán, heliconia, zompopas…">' + dl;
    h += '<div style="height:10px"></div>' + lbl(t('photo')) + '<input id="de-photo" type="file" accept="image/*" capture="environment" onchange="DE.photo(this)">' +
      '<div id="de-photo-prev" class="xs muted" style="margin-top:6px">' + (draft.photoRef ? '✓ photo attached' : '') + '</div>';
    h += '<div style="height:10px"></div>' + lbl(t('note')) + '<textarea id="de-note" class="notefield" style="margin-top:0">' + esc(draft.note) + '</textarea>';
    h += '<div style="height:10px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div>' + lbl(t('cname')) +
      '<input id="de-cname" value="' + esc(draft.communityName) + '"></div><div>' + lbl(t('shared')) +
      '<select id="de-partner"><option value="">—</option>' + B.trip.roster.map(function(p){
        return '<option value="' + esc(p.id) + '"' + (p.id === draft.partnerId ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select></div></div>';
    h += '<div style="height:10px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div>' + lbl(t('nearest')) +
      '<select id="de-loc"><option value="">—</option>' + B.locations.filter(function(l){ return l.lat != null; }).map(function(l){
        return '<option value="' + esc(l.id) + '"' + (l.id === draft.locationId ? ' selected' : '') + '>' + esc(l.name.split(/[—(]/)[0].trim()) + '</option>'; }).join('') +
      '</select></div><div>' + lbl(t('observer')) + '<input id="de-observer" value="' + esc(draft.observerId) + '" placeholder="Jona / Ruanna"></div></div>';
    var sg = draft.segmentId ? segOf(draft.segmentId) : null;
    h += '<div class="xs muted" style="margin-top:8px">' + t('segment') + ': ' + (sg ? esc(sg.title) : '—') + '</div>';
    h += '<div class="row" style="margin-top:10px;gap:8px"><button class="btn sm" onclick="DE.gps()">◎ ' + t('gps') + '</button>' +
      '<span id="de-gps" class="xs muted">' + (draft.lat != null ? draft.lat.toFixed(5) + ', ' + draft.lng.toFixed(5) : '') + '</span></div>';
    h += '<button class="ctog' + (draft.sensitive ? ' on' : '') + '" id="de-sens" style="width:100%;margin-top:10px" onclick="this.classList.toggle(\'on\')"><span class="box">✓</span><span>' + t('sensitive') + '</span></button>';
    h += '<div class="btnrow" style="margin-top:16px"><button class="btn ochre" onclick="DE.save()">' + t('save') + '</button><button class="btn ghost" onclick="closeSheet()">' + t('cancel') + '</button></div>';
    if(o) h += '<button class="btn full danger" style="margin-top:10px" onclick="DE.del(\'' + esc(o.id) + '\')">' + t('delete') + '</button>';
    openSheet(h);
    if(!o && draft.lat == null) gps(true);
  }
  function lbl(s){ return '<div class="xs muted" style="letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">' + esc(s) + '</div>'; }
  function gps(quiet){
    if(!navigator.geolocation){ if(!quiet) toast('GPS unavailable'); return; }
    navigator.geolocation.getCurrentPosition(function(p){
      if(!draft) return; draft.lat = p.coords.latitude; draft.lng = p.coords.longitude;
      var n = nearestLoc(draft.lat, draft.lng);
      if(n && n.km < 3){ draft.locationId = n.loc.id; var sel = document.getElementById('de-loc'); if(sel) sel.value = n.loc.id; }
      var g = document.getElementById('de-gps'); if(g) g.textContent = draft.lat.toFixed(5) + ', ' + draft.lng.toFixed(5) + (n ? ' · ' + n.km.toFixed(1) + ' km' : '');
    }, function(){ if(!quiet) toast('No GPS fix'); }, { enableHighAccuracy: true, timeout: 15000 });
  }
  function photo(input){
    var f = input.files && input.files[0]; if(!f || !draft) return;
    var prev = document.getElementById('de-photo-prev'); if(prev) prev.textContent = '…';
    Promise.all([shrink(f, 1280), shrink(f, 220)]).then(function(r){
      var key = 'ph_' + draft.id; return putPhoto(key, { full: r[0], thumb: r[1] }).then(function(){ draft.photoRef = key;
        if(prev) prev.innerHTML = '<img src="' + r[1] + '" style="width:80px;border-radius:8px">'; }); })
    .catch(function(){ if(prev) prev.textContent = 'Could not save photo'; });
  }
  function save(){
    if(!draft) return;
    var raw = (document.getElementById('de-species').value || '').trim();
    var match = REGION.species.find(function(s){ return raw.indexOf(s.sci) >= 0 || raw.toLowerCase() === s.en.toLowerCase() || raw.toLowerCase() === s.es.toLowerCase(); });
    draft.species = raw; draft.speciesId = match ? match.id : null;
    draft.note = document.getElementById('de-note').value.trim();
    draft.communityName = document.getElementById('de-cname').value.trim();
    draft.partnerId = document.getElementById('de-partner').value || null;
    draft.locationId = document.getElementById('de-loc').value || draft.locationId;
    draft.observerId = document.getElementById('de-observer').value.trim(); store('de_observer', draft.observerId);
    draft.sensitive = document.getElementById('de-sens').classList.contains('on');
    if(draft.lat == null){ var l = locOf(draft.locationId); if(l && l.lat != null){ draft.lat = l.lat; draft.lng = l.lng; draft.approx = true; } }
    var c = draft.partnerId ? B.consent[draft.partnerId] : null;
    draft.consentScope = c ? { verbal:c.verbal, written:c.written, media:c.media, archive:c.archive, at: new Date().toISOString() } : null;
    if(B.onObservation(draft)){ closeSheet(); toast(L() === 'es' ? 'Observación guardada' : 'Observation saved'); rr(); }
  }
  function del(id){ if(!confirm('Delete?')) return; B.onObservation({ id: id, _delete: true }); closeSheet(); rr(); }

  function spSheet(id){
    var s = spOf(id); if(!s) return; var im = imgFor(s);
    var h = '<div class="spread" style="margin-bottom:12px"><h2 style="font-size:1.4rem">' + esc(L() === 'es' ? s.es : s.en) + '</h2>' +
      '<button class="icon-btn" onclick="closeSheet()">✕</button></div>';
    if(im) h += '<img src="' + esc(im.url) + '" alt="" style="width:100%;border-radius:12px;display:block">' +
      '<div class="xs muted" style="margin:5px 0 10px">' + esc(im.credit) + (im.link ? ' · <a class="link" href="' + esc(im.link) + '" target="_blank" rel="noopener">source</a>' : '') + '</div>';
    h += kv('Español', esc(s.es)) + kv('English', esc(s.en)) + kv('Sci.', '<i>' + esc(s.sci) + '</i>') + kv(t('status'), esc(L() === 'es' ? s.status_es : s.status)) +
      (s.where ? kv('⌖', esc(s.where)) : '') + (s.note ? kv('·', esc(s.note)) : '');
    if(s.flag) h += '<div class="qnone" style="margin-top:10px">' + esc(s.flag) + '</div>';
    var names = (B.observations || []).filter(function(o){ return o.speciesId === s.id && o.communityName; });
    if(names.length) h += '<div class="sec-label">' + t('cname') + '</div>' + names.map(function(o){
      var who = o.partnerId && B.consent[o.partnerId] ? B.consent[o.partnerId].name : (o.observerId || '');
      return '<div class="kv"><b>“' + esc(o.communityName) + '”</b><span class="grow">' + esc(who) + '</span></div>'; }).join('');
    h += '<button class="btn full ochre" style="margin-top:14px" onclick="DE.formFor(\'' + s.id + '\')">' + t('log') + '</button>';
    openSheet(h);
    if(!im) fetchImg(s).then(function(){ spSheet(id); }).catch(function(){});
  }

  /* GeoJSON export — consent applied: photos only where allowed, sensitive points rounded to ~1 km */
  function geojson(){
    var feats = (B.observations || []).map(function(o){
      var lat = o.lat, lng = o.lng; if(o.sensitive && lat != null){ lat = Math.round(lat * 100) / 100; lng = Math.round(lng * 100) / 100; }
      var c = o.partnerId ? B.consent[o.partnerId] : null;
      return { type: 'Feature', geometry: lat == null ? null : { type: 'Point', coordinates: [lng, lat] },
        properties: { id: o.id, species: o.species, speciesId: o.speciesId, communityName: o.communityName,
          sharedBy: o.partnerId && c && (c.written || c.archive) ? c.name : (o.partnerId ? '(partner — no written consent)' : null),
          note: o.note, locationId: o.locationId, segmentId: o.segmentId, observedAt: o.observedAt, observer: o.observerId,
          photo: o.photoRef ? (photoAllowed(o) ? o.photoRef : '(withheld — no media consent)') : null,
          sensitive: !!o.sensitive, approxLocation: !!o.approx,
          archive: !!(c && c.archive) } };
    });
    var blob = new Blob([JSON.stringify({ type: 'FeatureCollection', features: feats }, null, 2)], { type: 'application/geo+json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'BEL-observations-' + todayISO() + '.geojson';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  }

  function rr(){ var m = document.getElementById('main'), y = m.scrollTop; mountPlugin('discover-ecology'); m.scrollTop = y; }
  window.DE = {
    lang: function(l){ try{ localStorage.setItem('de_lang', l); }catch(e){} rr(); },
    view: function(v){ view = v; rr(); },
    cat: function(c){ cat = c; rr(); },
    pick: function(id){ selPin = selPin === id ? null : id; rr(); },
    form: form, formFor: function(sid){ var s = spOf(sid); form(null); setTimeout(function(){ var i = document.getElementById('de-species'); if(i) i.value = (L() === 'es' ? s.es : s.en) + ' — ' + s.sci; }, 30); },
    gps: function(){ gps(false); }, photo: photo, save: save, del: del, sp: spSheet,
    imgs: function(){ if(!navigator.onLine){ toast('Needs signal'); return; } toast('Downloading…'); hydrateImgs(true); },
    permit: function(id, v){ var P = store('de_permits') || {}; P[id] = v; store('de_permits', P); },
    geojson: geojson
  };
  return { render: render };
}


/* ---------- APPEARANCE ---------- */
function themePref(){ try{ return localStorage.getItem('bel_theme') || 'dark'; }catch(e){ return 'dark'; } }
function applyTheme(){
  var t = themePref(), l = t === 'light' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', l ? 'light' : 'dark');
  var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', l ? '#F5EFDD' : '#161A0E');
  var s = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]'); if(s) s.setAttribute('content', l ? 'default' : 'black-translucent');
}
function setTheme(t){ try{ localStorage.setItem('bel_theme', t); }catch(e){} applyTheme(); if(nowMap) initNowMap(); openMenu(); }
if(window.matchMedia){ try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){ if(themePref() === 'auto') applyTheme(); }); }catch(e){} }
applyTheme();

/* ---------- START ---------- */
try{
  boot();
  updateRecTimer();
}catch(err){
  document.getElementById('main').innerHTML =
    '<div class="empty"><div class="big">⚠</div><div>Something went wrong loading field data.</div>' +
    '<div class="xs muted" style="margin-top:10px">' + esc(err && err.message) + '</div>' +
    '<button class="btn danger" style="margin-top:16px" onclick="localStorage.removeItem(\'' + OPS_KEY + '\');location.reload()">Reset and reload</button></div>';
  console.error(err);
}

</script>
</body>
